name: Build and Deploy Android to Internal Testing

on:
  push:
    branches: [ main ] # Trigger workflow on pushes to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Use your project's Node.js version

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # Or another distribution
        java-version: '17' # Android builds often require JDK 17 now

    - name: Install Project Dependencies
      run: npm install
      working-directory: ./client

    - name: Build Angular Web App
      run: npx ng build --configuration=production # Use your production build command
      working-directory: ./client
      
    - name: Sync Capacitor Android Assets
      run: npx cap sync android
      working-directory: ./client

    # --- Signing Setup ---
    - name: Decode Keystore
      run: |
        mkdir -p client/android/app # <<< Add this line to ensure directory exists
        echo "${{ secrets.ANDROID_SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > client/android/app/release.jks

    # --- Build Android ---
    - name: Debug Before Chmod Gradlew
      run: |
        pwd
        echo "--- Listing client/android/ ---"
        ls -la client/android/
      working-directory: . # Run from root first

    - name: Set execute permissions for gradlew # Your existing step
      run: chmod +x gradlew
      working-directory: ./client/android

    - name: Build Android Release App Bundle
      run: ./gradlew bundleRelease
      working-directory: ./android # Run gradle from the android directory
      env: # Make secrets available as environment variables for build.gradle
        SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}

    # --- Upload to Google Play ---
    - name: Upload Android App Bundle to Internal Testing
      uses: r0adkll/upload-google-play@v1 # Or use actions/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.coupletaskmanager.app # !!! REPLACE with your actual package name !!!
        releaseFiles: android/app/build/outputs/bundle/release/*.aab
        track: internal # Target the Internal Testing track
        status: completed # Optional: Set rollout status immediately
        # Optional: Add release notes, version code handling etc.
        # releaseName: ${{ github.run_number }} # Example release name
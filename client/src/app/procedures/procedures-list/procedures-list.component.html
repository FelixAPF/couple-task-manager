<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="container mx-auto p-4 flex flex-col flex-grow pb-12">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-surface-800 dark:text-surface-100">Procedures</h1>
        <button pButton pRipple icon="pi pi-plus" label="New Procedure" class="p-button-primary p-button-rounded shadow-md" (click)="openProcedureDialog()"></button>
    </div>

    <div *ngIf="procedures.length === 0" class="flex flex-col items-center justify-center p-10 bg-surface-50 dark:bg-surface-800 rounded-2xl border border-dashed border-surface-300 dark:border-surface-600">
        <i class="pi pi-list text-5xl text-surface-400 dark:text-surface-500 mb-4"></i>
        <h3 class="text-lg font-bold text-surface-600 dark:text-surface-300">No Procedures Yet</h3>
        <p class="text-surface-500 dark:text-surface-400 text-sm mt-1 mb-6 text-center">Create a step-by-step procedure to attach to your tasks.</p>
        <button pButton pRipple label="Create First Procedure" class="p-button-outlined p-button-rounded" (click)="openProcedureDialog()"></button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let proc of procedures" 
             class="bg-white dark:bg-surface-900 rounded-2xl shadow-sm border border-surface-200 dark:border-surface-700 p-5 hover:shadow-md transition-shadow cursor-pointer flex flex-col"
             (click)="openProcedureDialog(proc)">
            
            <div class="flex justify-between items-start mb-3">
                <h3 class="font-bold text-lg text-surface-900 dark:text-surface-50">{{ proc.name }}</h3>
                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger w-8 h-8 flex-shrink-0" (click)="deleteProcedure(proc, $event)"></button>
            </div>

            <div class="flex items-center gap-2 mb-4">
                <span class="bg-primary-50 dark:bg-primary-900/30 text-primary-700 dark:text-primary-300 px-3 py-1 rounded-full text-xs font-semibold">
                    {{ proc.steps?.length || 0 }} Steps
                </span>
            </div>

            <div class="mt-auto border-t border-surface-100 dark:border-surface-800 pt-3">
                <p class="text-xs text-surface-500 dark:text-surface-400 italic line-clamp-1">
                    First step: {{ proc.steps && proc.steps.length > 0 ? proc.steps[0].description : 'No steps' }}
                </p>
            </div>
        </div>
    </div>
</div>

<form [formGroup]="formGroup" (ngSubmit)="save()">
    <div class="flex flex-col"> <!-- Main container for content + footer -->
  
      <!-- Dialog Content Area -->
      <div class="p-fluid flex flex-col gap-5 p-4">
  
        <!-- Dialog Title -->
        <h3 class="text-xl font-semibold text-center mb-1 text-surface-800 dark:text-surface-100">
          Ajouter un article
        </h3>
  
        <!-- Item Name (Autocomplete) -->
        <div class="field flex flex-col gap-2">
          <label for="itemName" class="font-semibold">Nom de l'article</label>
          <p-iconField iconPosition="left">
            <p-inputIcon class="pi pi-search"></p-inputIcon> <!-- Search icon for autocomplete -->
            <p-autocomplete
              inputId="itemName"
              formControlName="name"
              [suggestions]="filteredSuggestions"
              (completeMethod)="search($event)"
              placeholder="Rechercher ou saisir un nom..."
              appendTo="body">
              <!-- Add field="name" if suggestions are objects -->
            </p-autocomplete>
          </p-iconField>
          <small *ngIf="formGroup.get('name')?.invalid && formGroup.get('name')?.touched" class="p-error block">
            Le nom de l'article est requis.
          </small>
        </div>
  
        <!-- Item Type -->
        <div class="field flex flex-col gap-2">
          <label for="shoppingType" class="font-semibold">Type d'article</label>
          <p-select
            id="shoppingType"
            [options]="shoppingTypes"
            optionValue="value"
            optionLabel="label"
            formControlName="type"
            placeholder="Choisir un type"
            appendTo="body">
          </p-select>
          <small *ngIf="formGroup.get('type')?.invalid && formGroup.get('type')?.touched" class="p-error block">
            La sélection d'un type est requise.
          </small>
        </div>
  
        <!-- Store -->
        <div class="field flex flex-col gap-2">
          <label for="store" class="font-semibold">Magasin</label>
          <p-select
            id="store"
            [options]="stores"
            optionValue="value"
            optionLabel="label"
            formControlName="store"
            placeholder="Choisir un magasin"
            appendTo="body">
          </p-select>
          <small *ngIf="formGroup.get('store')?.invalid && formGroup.get('store')?.touched" class="p-error block">
            La sélection d'un magasin est requise.
          </small>
        </div>
  
      </div> <!-- End Dialog Content Area -->
  
      <!-- Footer Actions -->
      <div class="flex justify-end gap-2 p-4 border-t border-surface-200 dark:border-surface-700 mt-auto">
        <p-button
          type="button"
          label="Annuler"
          severity="secondary"
          (click)="close()"> <!-- Assuming close() method exists -->
        </p-button>
        <p-button
          type="submit"
          label="Sauvegarder"
          icon="pi pi-check"
          [disabled]="formGroup.invalid">
        </p-button>
      </div>
  
    </div> <!-- End Main container -->
  </form>

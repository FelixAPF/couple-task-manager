<div class="h-full w-full relative block" *ngIf="isBirthday else regularTemplate">
  
  <app-balloon-container 
      class="h-full w-full block"
      [numberOfBalloons]="30" 
      [minDuration]="10" 
      [maxDuration]="20">
      
      <ng-container *ngTemplateOutlet="template"></ng-container>
      
  </app-balloon-container>
</div>

<ng-template #regularTemplate>
   <ng-container *ngTemplateOutlet="template"></ng-container>
</ng-template>

<ng-template #template>
  <p-card [styleClass]="'day-card h-full flex flex-col bg-surface-0 dark:bg-surface-800 shadow-md hover:shadow-xl transition-all duration-300 ease-in-out hover:-translate-y-1 rounded-xl overflow-hidden cursor-default'"
      [ngClass]="borderHighlightClass">

      <ng-template pTemplate="header">
        <div class="p-3 bg-gradient-to-b from-surface-50 to-surface-100 dark:from-surface-700 dark:to-surface-800 border-b border-surface-200 dark:border-surface-600">
          <h3 class="text-center text-sm uppercase tracking-wider font-bold text-primary-600 dark:text-primary-300">
            {{ title }}
          </h3>
        </div>
      </ng-template>

      <ng-template pTemplate="content">
        <div class="p-3 flex-grow flex flex-col justify-center items-center text-center min-h-[140px]">
          
          <div *ngIf="meal" class="w-full flex flex-col items-center">
            
            <div (click)="openRecipeView()" class="relative inline-block mb-3 cursor-pointer group rounded-xl"> 
              
              <div class="overflow-hidden rounded-xl shadow-sm">
                <img *ngIf="meal.recipe.imageUrl"
                     [src]="meal.recipe.imageUrl"
                     [alt]="recipeName"
                     class="w-24 h-24 object-cover transition-transform duration-500 group-hover:scale-110"> <div *ngIf="!meal.recipe.imageUrl" 
                     class="w-24 h-24 flex items-center justify-center bg-gradient-to-br from-surface-100 to-surface-200 dark:from-surface-700 dark:to-surface-600 text-surface-400 dark:text-surface-500 transition-transform duration-500 group-hover:scale-110">
                  <i class="pi pi-image text-3xl opacity-50"></i>
                </div>
              </div>

              <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-xl pointer-events-none"></div>

              <div *ngIf="meal?.assignedUser as assignee" class="absolute -bottom-2 -right-2 z-20">
                 <img
                  [src]="assignee.imageUrl || 'assets/placeholder.jpg'"
                  [alt]="'Photo de ' + (assignee.name || 'Membre')"
                  class="w-9 h-9 rounded-full object-cover border-2 border-white dark:border-surface-800 shadow-md"
                  onError="this.src='assets/placeholder.jpg'"
                  [pTooltip]="assignee.name" 
                  tooltipPosition="bottom"
                />
              </div>

            </div>

            <p class="text-sm font-semibold text-surface-700 dark:text-surface-100 mb-2 w-full line-clamp-2 leading-tight min-h-[2.5rem] flex items-center justify-center"
              [pTooltip]="recipeName" tooltipPosition="top">
              {{ recipeName }}
            </p>
            
            <div *ngIf="meal.location" class="inline-flex items-center gap-1 px-2 py-1 bg-surface-100 dark:bg-surface-700 rounded-md text-xs font-medium text-surface-500 dark:text-surface-300 mb-2">
              <i class="pi pi-map-marker text-[10px]"></i>
              <span>{{ meal.location }}</span>
            </div>

            <ng-container [ngTemplateOutlet]="customTemplate"></ng-container>

          </div>
          <ng-container *ngIf="!meal && noMealPlanned" [ngTemplateOutlet]="noMealPlanned"></ng-container>
          
        </div>
      </ng-template>
    </p-card>
</ng-template>

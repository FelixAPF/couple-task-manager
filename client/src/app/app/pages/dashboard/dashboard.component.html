<!-- dashboard.component.html -->
<div class="container p-4 mx-auto flex flex-col gap-6"> <!-- Main container with padding and gap between sections -->
  <div>
    <app-meal-card [title]="'dashboard.meal-of-the-day'|translate" [isBirthday]="true" [noMealPlanned]="noMealPlanned" [meal]="todayMeal"></app-meal-card>
    <ng-template #noMealPlanned>
      <div class="flex flex-col items-center" routerLink="/meals">
        <i class="pi pi-calendar-times text-3xl text-surface-400 dark:text-surface-500 mb-2"></i>
        <p class="text-xs text-surface-500 dark:text-surface-400 italic mb-3">
          {{'dashboard.no-meal-planned'|translate}}
        </p>
      </div>
    </ng-template>
  </div>
  <!-- Section 2: Expired Tasks Accordion -->
  <!-- Only show if there are expired tasks -->
  <div *ngIf="expiredTasks?.length">
    <p-accordion>
      <!-- Use value="0" to potentially have it open by default, or remove/manage state if needed -->
      <p-accordion-panel value="0">
        <p-accordion-header styleClass="dashboard-accordion-header">
          <!-- Custom Header Content -->
          <div class="flex items-center justify-between w-full px-1 py-1"> <!-- Adjusted padding -->
            <div class="flex items-center gap-2">
              <i class="pi pi-exclamation-triangle text-red-500 dark:text-red-400 text-xl"></i>
              <span class="text-lg font-semibold text-red-600 dark:text-red-300">{{'dashboard.expired-tasks'|translate}}</span>
            </div>
            <p-badge [value]="expiredTasks.length" severity="danger" styleClass="ml-auto"></p-badge>
          </div>
        </p-accordion-header>
        <p-accordion-content>
          <!-- Embed the styled warning component -->
          <app-warning-tasks-due [expiredTasks]="expiredTasks"></app-warning-tasks-due>
        </p-accordion-content>
      </p-accordion-panel>
    </p-accordion>
  </div>

  <!-- Section 3: Completed Tasks Accordion -->
  <!-- Only show if there are completed tasks AND they are not hidden by the checkbox -->
  <div *ngIf="taskAssignments?.length">
    <p-accordion [value]="collapseCompletedTasks" (onClose)="saveHideStorage('collapseCompletedTasks',false)" (onOpen)="saveHideStorage('collapseCompletedTasks',true)">
       <!-- Use value="0" to potentially have it open by default, or manage state -->
       <p-accordion-panel value="0">
        <p-accordion-header styleClass="dashboard-accordion-header">
           <!-- Custom Header Content -->
           <div class="flex items-center justify-between w-full px-1 py-1"> <!-- Adjusted padding -->
            <div class="flex items-center gap-2">
              <i class="pi pi-check-circle text-green-500 dark:text-green-400 text-xl"></i>
              <span class="text-lg font-semibold text-green-600 dark:text-green-300">{{'dashboard.tasks-completed-today'|translate}}</span>
            </div>
            <p-badge [value]="taskAssignments.length" severity="success" styleClass="ml-auto"></p-badge>
          </div>
        </p-accordion-header>
        <p-accordion-content>
          <!-- Embed the styled completed tasks component -->
          <app-completed-tasks [taskAssignments]="taskAssignments"></app-completed-tasks>
        </p-accordion-content>
      </p-accordion-panel>
    </p-accordion>
  </div>

  <!-- Section 4: Active Tasks -->
  <div>
    <!-- Optional: Add a title for this main section -->
    <!-- <h2 class="text-xl font-semibold mb-3 text-surface-800 dark:text-surface-100">Mes Tâches Actives</h2> -->

    <!-- The app-my-tasks component now contains the p-card and styled list internally -->
    <app-my-tasks (taskCompleteEmitter)="refreshExpiredTasks($event)"></app-my-tasks>
  </div>

</div>

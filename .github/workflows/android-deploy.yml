name: Build Docker Images & Deploy Android

on:
  push:
    branches: [ main ] # Trigger workflow on pushes to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Use your project's Node.js version

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # Or another distribution
        java-version: '21' # For Android build and Java build

    # --- Docker Setup ---
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }} # Use the Access Token secret

    # --- Build Java Backend BEFORE Docker build ---
    - name: Build Java Backend with Maven
      run: mvn package -DskipTests # Build the JAR, skip tests for speed
      working-directory: ./server # Run Maven inside the 'server' directory
# --- Add this Step to check output ---
    - name: List Angular Build Output
      run: ls -lR client/dist/
      continue-on-error: true # Don't fail workflow if 'dist' doesn't exist yet
    # --- Build and Push Backend Docker Image ---
    - name: Build and push Backend image
      uses: docker/build-push-action@v6
      with:
        context: ./server # Assumes Dockerfile is in the 'server' directory
        push: true
        tags: felixapelletierr/couple-task-manager:latest # Your backend image tag

    # --- Build and Push Frontend Docker Image ---
    - name: Build and push Frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./client # Assumes Dockerfile is in the 'client' directory
        push: true
        tags: felixapelletierr/couple-task-manager-front-end:latest # Your frontend image tag

    # --- Start Client/Android Build Steps ---
    - name: Install Client Project Dependencies
      run: npm install
      working-directory: ./client

    - name: Build Angular Web App
      run: npx ng build --configuration=production
      working-directory: ./client
      
    - name: Sync Capacitor Android Assets
      run: npx cap sync android
      working-directory: ./client

    # --- Android Signing Setup ---
    - name: Decode Keystore
      run: |
        mkdir -p client/android/app
        echo "${{ secrets.ANDROID_SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > client/android/app/release.jks

    # --- Build Android ---
    - name: Set execute permissions for gradlew
      run: chmod +x gradlew
      working-directory: ./client/android

    - name: Build Android Release App Bundle
      run: ./gradlew bundleRelease
      working-directory: ./client/android
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}

    # --- Upload to Google Play ---
    - name: Upload Android App Bundle to Internal Testing
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.couple.taskmanager # !!! REPLACE with your actual package name !!!
        releaseFiles: client/android/app/build/outputs/bundle/release/*.aab
        track: internal
        status: draft

apply plugin: 'com.android.application'

android {
  namespace "com.couple.taskmanager"
  compileSdk rootProject.ext.compileSdkVersion

  signingConfigs {
    release {
      // Read signing configuration from environment variables (set by GitHub Actions secrets)
      if (System.getenv("SIGNING_STORE_PASSWORD") != null) {
        storeFile file("release.jks") // Assumes keystore is placed here by the workflow
        storePassword System.getenv("SIGNING_STORE_PASSWORD")
        keyAlias System.getenv("SIGNING_KEY_ALIAS")
        keyPassword System.getenv("SIGNING_KEY_PASSWORD")
      } else {
        // Optional: Add configuration for local builds if needed, or simply omit
        // logger.warn("Release signing configuration not found in environment variables.")
      }
    }
  }

  defaultConfig {
    applicationId "com.couple.taskmanager"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion

    // Read versionCode from the project property passed by GitHub Actions (-PversionCode=...).
    // Default to 1 if the property is not provided (e.g., for local builds).
    versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1

    // Set versionName manually here. Update this string when you release a new user-facing version.
    versionName "2.14"

    // Use the defined versionName to set the archive base name
    def date = new Date()
    def formattedDate = date.format('yyyy-MM-dd-HHmmss')
    archivesBaseName = "CoupleTaskManager_${versionName}_${formattedDate}" // Simplified assignment

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    aaptOptions {
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }

  buildTypes {
    release {
      // Ensure the release build type uses the signing config defined above
      signingConfig signingConfigs.release
      minifyEnabled false // Keep as is, or enable if desired
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  // Ensure compileOptions are set if needed, especially if targeting specific Java features
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17 // Match the JDK used for compilation if needed
    targetCompatibility JavaVersion.VERSION_17 // Match the JDK used for compilation if needed
  }
  // If using Kotlin
  // kotlinOptions {
  //    jvmTarget = '17'
  // }

} // End of android block

repositories {
  flatDir{
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
  // Ensure google() and mavenCentral() are also present if not inherited
  // google()
  // mavenCentral()
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation project(':capacitor-android')
  testImplementation "junit:junit:$junitVersion"
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
  implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
  def servicesJSON = file('google-services.json')
  if (servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
  }
} catch(Exception e) {
  // Use logger.warn or logger.info for Gradle logging
  logger.warn("google-services.json not found, google-services plugin not applied. Push Notifications might not work.")
}




<div class="flex flex-col gap-4 p-2">
  <span class="text-surface-600 dark:text-surface-400">
    Sélectionnez la personne à qui transférer cette tâche :
  </span>

  <div class="grid grid-cols-1 gap-2 max-h-[60vh] overflow-y-auto">
    <div *ngFor="let member of members" 
         (click)="selectMember(member)"
         [class.selected]="selectedMember?.id === member.id"
         class="member-item flex items-center gap-3 p-3 rounded-lg cursor-pointer border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-800">
      
      <img [src]="member.imageUrl || 'assets/placeholder.jpg'" 
           class="w-10 h-10 rounded-full object-cover"
           onError="this.src='assets/placeholder.jpg'"
           alt="Avatar">
      
      <span class="font-medium text-lg text-surface-900 dark:text-surface-0">{{ member.name }}</span>
      
      <i *ngIf="selectedMember?.id === member.id" class="pi pi-check-circle text-primary-500 ml-auto text-xl"></i>
    </div>
  </div>

  <div class="flex justify-end gap-2 mt-4">
    <button pButton label="Annuler" class="p-button-text p-button-secondary" (click)="cancel()"></button>
    <button pButton label="Transférer" class="p-button-primary" [disabled]="!selectedMember" (click)="submit()"></button>
  </div>
</div>

<div class="p-4">
      <h2 class="text-xl font-semibold mb-4">{{ 'rewards.selectReward' | translate }}</h2>
      <p class="mb-4">{{ 'rewards.availableRewards' | translate }}</p>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p-card *ngFor="let reward of rewards" 
                [header]="reward.name | translate" 
                [subheader]="reward.description | translate"
                styleClass="shadow-sm">
          <ng-template pTemplate="header">
            <div class="flex justify-center p-4">
              <i [class]="'pi ' + reward.icon" style="font-size: 3rem; color: var(--primary-color);"></i>
            </div>
          </ng-template>
          <ng-template pTemplate="footer">
            <div class="flex justify-center">
              <button pButton 
                      pRipple 
                      label="{{ 'rewards.claim' | translate }}" 
                      icon="pi pi-check" 
                      class="p-button-success" 
                      (click)="selectReward(reward)">
              </button>
            </div>
          </ng-template>
        </p-card>
      </div>

      <div class="flex justify-end mt-6">
        <button pButton 
                pRipple 
                label="{{ 'common.cancel' | translate }}" 
                icon="pi pi-times" 
                class="p-button-text p-button-secondary" 
                (click)="ref.close()">
        </button>
      </div>
    </div>

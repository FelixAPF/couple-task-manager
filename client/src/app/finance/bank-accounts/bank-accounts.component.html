<div class="container p-4 md:p-6 mx-auto pb-20 lg:pb-6">
    <button pButton pRipple icon="pi pi-arrow-left" label="Retour" class="p-button-text p-button-secondary mb-4" routerLink="/finance/dashboard"></button>
    
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-semibold text-surface-800 dark:text-surface-100 m-0">Comptes bancaires</h2>
        <button pButton pRipple icon="pi pi-plus" label="Ajouter Banque" class="p-button-primary hidden sm:block" (click)="addBank()"></button>
    </div>

    <div *ngIf="banks.length === 0" class="text-center py-10 bg-surface-0 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 text-surface-500 dark:text-surface-400">
        Aucun compte bancaire configuré.
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let bank of banks" class="bg-surface-0 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 flex flex-col">
            <div class="p-4 border-b border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-900 rounded-t-lg flex justify-between items-center gap-3">
                <input pInputText [(ngModel)]="bank.name" (blur)="updateBank(bank)" placeholder="Nom (ex: BNC)" class="font-bold w-full" />
                <button pButton pRipple icon="pi pi-trash" class="p-button-danger p-button-text p-button-rounded flex-shrink-0" (click)="removeBank(bank.id)"></button>
            </div>

            <div class="p-4 flex-grow flex flex-col gap-3">
                <div *ngIf="bank.subAccounts.length === 0" class="text-sm text-surface-500 italic">Aucun sous-compte.</div>
                <div *ngFor="let sub of bank.subAccounts" class="flex items-center gap-3">
                    <i class="pi pi-angle-right text-surface-400"></i>
                    <input pInputText [(ngModel)]="sub.name" (blur)="updateSubAccount(bank)" placeholder="Sous-compte (ex: Hockey)" class="w-full p-inputtext-sm" />
                    <button pButton pRipple icon="pi pi-times" class="p-button-secondary p-button-text p-button-rounded p-button-sm flex-shrink-0" (click)="removeSubAccount(bank.id, sub.id)"></button>
                </div>
            </div>

            <div class="p-4 pt-0 mt-auto">
                <button pButton pRipple icon="pi pi-plus" label="Ajouter un sous-compte" class="p-button-secondary p-button-outlined w-full p-button-sm" (click)="addSubAccount(bank.id)"></button>
            </div>
        </div>
    </div>
</div>

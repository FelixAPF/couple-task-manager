apply plugin: 'com.android.application'

def incrementVersionCode = {
  def buildGradle = file('build.gradle')
  def content = buildGradle.getText()
  def versionCodeRegex = "(versionCode\\s+)(\\d+)"
  def matcher = content =~ versionCodeRegex
  if (matcher.find()) {
    def oldVersionCode = matcher[0][2].toInteger()
    def newVersionCode = oldVersionCode + 1
    content = content.replaceFirst(versionCodeRegex, "\$1${newVersionCode}")
    buildGradle.write(content)
    println "Incremented versionCode to: $newVersionCode"
  } else {
    println "Warning: versionCode not found in build.gradle"
  }
}

// Call the incrementVersionCode function during the configuration phase
incrementVersionCode()

android {
  namespace "com.couple.taskmanager"
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId "com.couple.taskmanager"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    // versionCode will be read from the modified file
    versionCode 3
    versionName "1.11"
    def date = new Date();
    def formattedDate = date.format('yyyy-MM-dd-HHmmss')
    setProperty("archivesBaseName", "CoupleTaskManager" + "_" + versionName + "_"+formattedDate)
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    aaptOptions {
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }
}

repositories {
  flatDir{
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation project(':capacitor-android')
  testImplementation "junit:junit:$junitVersion"
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
  implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
  def servicesJSON = file('google-services.json')
  if (servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
  }
} catch(Exception e) {
  logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('incrementVersionName') {
  doLast {
    def powershellPath = 'powershell'
    def scriptPath = file('../../../server/increment_version.ps1').absolutePath // Adjusted path

    def command = [powershellPath, '-ExecutionPolicy', 'Bypass', '-File', scriptPath, '-FilePath', file('build.gradle').absolutePath]

    println "Executing PowerShell script: ${command.join(' ')}"

    def process = command.execute()
    process.waitFor()

    if (process.exitValue() != 0) {
      def errorOutput = new BufferedReader(new InputStreamReader(process.errorStream)).getText()
      logger.error "PowerShell script execution failed with error:\n${errorOutput}"
      throw new GradleException("Failed to increment versionName")
    } else {
      def standardOutput = new BufferedReader(new InputStreamReader(process.inputStream)).getText()
      println "PowerShell script executed successfully:\n${standardOutput}"
    }
  }
}
preBuild.dependsOn incrementVersionName

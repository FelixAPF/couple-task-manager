<form [formGroup]="formGroup" class="flex flex-col gap-6" (ngSubmit)="save()">
    
    <div class="flex flex-col gap-2">
        <label class="font-semibold text-surface-700 dark:text-surface-300">Procedure Name</label>
        <input pInputText formControlName="name" placeholder="e.g. Clean the coffee machine" class="w-full" />
    </div>

    <div class="flex justify-between items-end border-b border-surface-200 dark:border-surface-700 pb-2">
        <label class="font-semibold text-surface-700 dark:text-surface-300">Steps</label>
        <button type="button" pButton pRipple icon="pi pi-plus" label="Add Step" class="p-button-text p-button-sm p-button-primary" (click)="addStep()"></button>
    </div>

    <div formArrayName="steps" class="flex flex-col gap-3 max-h-[50vh] overflow-y-auto pr-2">
        <div *ngFor="let step of steps.controls; let i = index" [formGroupName]="i" 
             class="flex gap-3 items-center bg-surface-50 dark:bg-surface-800 p-3 rounded-xl border border-surface-200 dark:border-surface-700">
            
            <div class="flex flex-col gap-1 flex-shrink-0">
                <button type="button" pButton icon="pi pi-angle-up" class="p-button-rounded p-button-text p-button-sm w-6 h-6 p-0" [disabled]="i === 0" (click)="moveStepUp(i)"></button>
                <div class="w-6 h-6 rounded-full bg-primary-100 dark:bg-primary-900/50 text-primary-700 dark:text-primary-300 flex items-center justify-center font-bold text-xs">{{ i + 1 }}</div>
                <button type="button" pButton icon="pi pi-angle-down" class="p-button-rounded p-button-text p-button-sm w-6 h-6 p-0" [disabled]="i === steps.length - 1" (click)="moveStepDown(i)"></button>
            </div>

            <textarea pInputTextarea formControlName="description" rows="2" class="w-full flex-grow resize-none" placeholder="Describe this step..."></textarea>
            
            <button type="button" pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger flex-shrink-0" (click)="removeStep(i)"></button>
        </div>

        <div *ngIf="steps.length === 0" class="text-center py-4 text-surface-500 italic text-sm">
            No steps added yet. Click "Add Step" to begin.
        </div>
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-surface-200 dark:border-surface-700 mt-2">
        <button type="button" pButton label="Cancel" class="p-button-text p-button-secondary" (click)="cancel()"></button>
        <button type="submit" pButton label="Save Procedure" icon="pi pi-check" class="p-button-primary p-button-rounded px-6" [disabled]="formGroup.invalid"></button>
    </div>
</form>

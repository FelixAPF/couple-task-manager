<div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
  
  <div class="sm:mx-auto sm:w-full sm:max-w-2xl">
    <div class="flex items-center justify-between mb-8">
      <button routerLink="/letters" class="group flex items-center text-slate-500 hover:text-slate-800 transition-colors">
        <div class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center mr-2 group-hover:scale-110 transition-transform">
          <span class="material-icons text-sm">arrow_back</span>
        </div>
        <span class="text-sm font-medium">Annuler</span>
      </button>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Écrire une lettre</h2>
      <div class="w-20"></div> </div>

    <div class="bg-white py-8 px-6 shadow-xl rounded-3xl sm:px-10 border border-slate-100 relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500"></div>

      <form [formGroup]="letterForm" (ngSubmit)="onSubmit()" class="space-y-8">
        
        <div class="text-center">
          <label class="block text-sm font-medium text-slate-500 mb-4">Qui est le destinataire?</label>
          <div class="flex justify-center gap-6">
            <div *ngFor="let member of householdMembers" 
                 (click)="letterForm.patchValue({receiverId: member.id})"
                 class="group relative cursor-pointer transition-all duration-300"
                 [ngClass]="{'scale-110': letterForm.get('receiverId')?.value === member.id}">
              
              <div class="absolute -inset-1 rounded-full opacity-0 group-hover:opacity-50 transition-opacity duration-300"
                   [ngClass]="{'bg-gradient-to-tr from-pink-500 to-purple-600 opacity-100': letterForm.get('receiverId')?.value === member.id}"></div>
              
              <img [src]="member.imageUrl || 'assets/placeholder.jpg'" 
                   class="relative w-16 h-16 rounded-full object-cover border-4 border-white shadow-md">
              
              <p class="mt-2 text-xs font-semibold text-slate-600 group-hover:text-pink-600 transition-colors">
                {{ member.name }}
              </p>
            </div>
          </div>
        </div>

        <hr class="border-slate-100">

        <div class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Titre</label>
            <input type="text" formControlName="title" placeholder="Donnez lui un joli titre..." 
                   class="block w-full border-0 border-b-2 border-slate-200 bg-transparent py-2 px-0 text-xl font-bold text-slate-800 focus:border-pink-500 focus:ring-0 placeholder:text-slate-300 transition-colors">
          </div>

          <div>
             <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Type</label>
             <input type="text" formControlName="letterType" placeholder="e.g. Lettre d'amour, Juste parce que..." 
                    class="block w-full border-0 border-b-2 border-slate-200 bg-transparent py-2 px-0 text-md text-slate-600 focus:border-pink-500 focus:ring-0 placeholder:text-slate-300 transition-colors">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Contenu</label>
            <textarea formControlName="description" rows="8" placeholder="Écrivez ce qui vous passe par la tête..." 
                      class="block w-full rounded-xl border-slate-200 bg-slate-50 py-4 px-4 text-slate-700 shadow-inner focus:border-pink-500 focus:bg-white focus:ring-pink-500 transition-all font-serif leading-relaxed text-lg resize-y"></textarea>
          </div>
        </div>

        <div class="pt-4">
          <div class="flex items-center justify-between cursor-pointer" (click)="letterForm.get('hasOptions')?.setValue(!letterForm.get('hasOptions')?.value)">
             <div class="flex items-center gap-2">
                <div class="w-10 h-6 rounded-full p-1 transition-colors duration-300 ease-in-out" 
                     [ngClass]="letterForm.get('hasOptions')?.value ? 'bg-pink-500' : 'bg-slate-200'">
                  <div class="w-4 h-4 bg-white rounded-full shadow-sm transform transition-transform duration-300 ease-in-out"
                       [ngClass]="letterForm.get('hasOptions')?.value ? 'translate-x-4' : 'translate-x-0'"></div>
                </div>
                <span class="text-sm font-medium text-slate-700">Ajouter une question / option</span>
             </div>
          </div>

          <div *ngIf="letterForm.get('hasOptions')?.value" class="mt-6 bg-slate-50 rounded-2xl p-6 border border-slate-100 animate-fade-in-up">
            <div class="mb-4">
              <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Question</label>
              <input type="text" formControlName="optionsTitle" placeholder="e.g. Veux-tu un câlin?" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-pink-500 focus:border-pink-500">
            </div>

            <div formArrayName="options" class="space-y-3">
              <div *ngFor="let opt of options.controls; let i=index" class="flex items-center gap-2 group">
                <span class="text-slate-400 text-xs font-mono w-4">{{i+1}}.</span>
                <input [formControlName]="i" type="text" [placeholder]="`Choix ${i+1}`" class="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-pink-500 focus:border-pink-500">
                <button type="button" (click)="removeOption(i)" class="text-slate-300 hover:text-red-500 transition-colors" *ngIf="options.length > 2">
                  <span class="material-icons text-sm">close</span>
                </button>
              </div>
            </div>
            
            <button type="button" (click)="addOption()" class="mt-4 text-xs font-bold text-pink-600 hover:text-pink-700 flex items-center gap-1">
              <span class="material-icons text-sm">add_circle</span> Ajouter un autre option
            </button>
          </div>
        </div>

        <div class="pt-4">
          <button type="submit" [disabled]="letterForm.invalid" 
                  class="w-full flex justify-center py-4 px-4 border border-transparent rounded-2xl shadow-lg text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all duration-300 transform hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed">
            Send Letter
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

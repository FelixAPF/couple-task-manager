<p-confirmDialog [style]="{width: '50vw'}"></p-confirmDialog>
<p-toast></p-toast>

<div class="p-4 md:p-6">
  <!-- Loading, Error, Empty States... -->
  <div *ngIf="isLoading" class="flex justify-content-center align-items-center py-10">
    <p-progressSpinner styleClass="w-8 h-8" strokeWidth="4" animationDuration=".5s"></p-progressSpinner>
  </div>
  <div *ngIf="!isLoading && errorLoading" class="flex justify-content-center py-10">
     <p-message severity="error" text="Une erreur est survenue lors du chargement des recettes."></p-message>
  </div>

  <div *ngIf="!isLoading && !errorLoading" class="flex justify-end mb-4 md:mb-6">
    <button pButton pRipple
            type="button"
            icon="pi pi-plus"
            label="Ajouter une recette"
            class="p-button-raised"
            (click)="openCreateRecipeDialog()">
    </button>
</div>

  <div *ngIf="!isLoading && !errorLoading && recipes.length === 0" class="flex justify-content-center py-10">
     <p-message severity="info" text="Aucune recette trouvée. Commencez par en ajouter une !"></p-message>
  </div>

  <!-- Recipes Grid -->
  <div *ngIf="!isLoading && !errorLoading && recipes.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
    <div *ngFor="let recipe of recipes; trackBy: trackById" class="recipe-card-wrapper">
      <p-card [styleClass]="'recipe-card h-full flex flex-col bg-surface-0 dark:bg-surface-800 shadow-md hover:shadow-lg transition-shadow duration-200 rounded-lg overflow-hidden'">
        <!-- Header, Title, Subtitle... -->
        <ng-template pTemplate="header">
          <div class="relative h-48 bg-surface-100 dark:bg-surface-700">
            <img *ngIf="recipe.imageUrl; else imagePlaceholder" [src]="recipe.imageUrl" [alt]="recipe.name" class="w-full h-full object-cover">
            <ng-template #imagePlaceholder>
              <div #imagePlaceholderRef class="absolute inset-0 flex items-center justify-center text-surface-400 dark:text-surface-500">
                <i class="pi pi-image text-5xl"></i>
              </div>
            </ng-template>
          </div>
        </ng-template>
        <ng-template pTemplate="title">
          <span class="block truncate text-lg font-semibold text-surface-800 dark:text-surface-100" [pTooltip]="recipe.name" tooltipPosition="top">
            {{ recipe.name }}
          </span>
        </ng-template>
        <ng-template pTemplate="subtitle">
          <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-surface-600 dark:text-surface-400 mb-2">
            <span *ngIf="recipe.category">
               <p-tag [value]="recipe.category | titlecase" [severity]="getCategoryTagSeverity(recipe.category)" [rounded]="true"></p-tag>
            </span>
          </div>
        </ng-template>

        <!-- Card Content -->
        <ng-template pTemplate="content">
          <div class="flex-grow">
            <p *ngIf="recipe.description" class="text-sm text-surface-700 dark:text-surface-300 mb-3 line-clamp-3">
              {{ recipe.description }}
            </p>

            <!-- Accordion for Ingredients -->
            <p-accordion *ngIf="recipe.ingredients && recipe.ingredients.length > 0"
                         styleClass="recipe-details-accordion">
                <p-accordion-panel value="ingredients"> <!-- Panel value -->
                    <p-accordion-header>
                        Ingrédients ({{ recipe.ingredients.length }})
                    </p-accordion-header>
                    <p-accordion-content>
                        <ul class="list-disc pl-5 space-y-1 text-xs text-surface-700 dark:text-surface-300">
                            <li *ngFor="let ingredient of recipe.ingredients">
                                {{ formatIngredient(ingredient) }}
                            </li>
                        </ul>
                    </p-accordion-content>
                </p-accordion-panel>
            </p-accordion>
            <!-- End of changes -->

            <p *ngIf="!recipe.ingredients || recipe.ingredients.length === 0" class="text-xs text-surface-500 dark:text-surface-400 italic mt-2">
              Aucun ingrédient listé.
            </p>
          </div>
        </ng-template>

        <!-- Footer... -->
        <ng-template pTemplate="footer">
          <div class="flex justify-end gap-2 pt-2 border-t border-surface-100 dark:border-surface-700 mt-auto">
            <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm text-primary-500 dark:text-primary-400" (click)="editRecipe(recipe)" aria-label="Modifier la recette" pTooltip="Modifier" tooltipPosition="top"></button>
            <button pButton pRipple type="button" icon="pi pi-trash" class="p-button-rounded p-button-text p-button-sm p-button-danger" (click)="confirmDelete($event, recipe)" aria-label="Supprimer la recette" pTooltip="Supprimer" tooltipPosition="top" [disabled]="!recipe.id"></button>
          </div>
        </ng-template>

      </p-card>
    </div>
  </div>
</div>

<!-- Mobile Menu Overlay & Panel (Example Structure) -->
<!-- Overlay to close menu on outside click -->
<div *ngIf="isMenuOpen" class="sm:hidden fixed inset-0 z-40" (click)="toggleMenu()"></div>

<!-- Sliding Menu Panel -->
<div *ngIf="isMenuOpen"
     class="mobile-menu-panel sm:hidden fixed top-0 right-0 h-full w-64 bg-surface-0 dark:bg-surface-900 shadow-lg z-50 p-4 transition-transform duration-300 ease-in-out transform flex flex-col"
     [class.translate-x-0]="isMenuOpen"
     [class.translate-x-full]="!isMenuOpen">

  <!-- Menu Header -->
  <div class="flex justify-between items-center mb-6">
    <span class="font-semibold text-lg text-surface-800 dark:text-surface-100">{{'side-menu.menu'|translate}}</span>
    <button pButton pRipple type="button" icon="pi pi-times" class="p-button-text p-button-rounded" (click)="toggleMenu()"></button>
  </div>
  <!-- Optional: Add language/theme switches at the bottom -->
  <div class="border-t border-b border-surface-200 dark:border-surface-700">
     <button pButton pRipple (click)="useLanguage('en')" label="EN" class="p-button-text p-button-sm"></button>
     <button pButton pRipple (click)="useLanguage('fr')" label="FR" class="p-button-text p-button-sm"></button>
     <!-- Add theme switch button if needed -->
  </div>
  <div class="border-t border-b border-surface-200 dark:border-surface-700">
    <ng-container *ngIf="(isLoggedIn$ | async) && (household$ | async) as household">
      <a *ngIf="household && household.enableWaysToCare"
      routerLink="/household/ways-to-care"
      class="p-button p-button-text text-left w-full justify-start flex items-center gap-2"
      (click)="toggleMenu()"> <!-- Close menu on click -->
      <i class="pi pi-heart-fill"></i>
      <span>{{ 'side-menu.ways-to-care' | translate}}</span>
     </a>
    </ng-container>
 </div>
  <div class="border-t border-b border-surface-200 dark:border-surface-700">
    <ng-container *ngIf="(isLoggedIn$ | async) && (household$ | async) as household">
      <a *ngIf="household && household.enableToDoList"
      routerLink="/household/to-do"
      class="p-button p-button-text text-left w-full justify-start flex items-center gap-2"
      (click)="toggleMenu()"> <!-- Close menu on click -->
      <i class="pi pi-car"></i>
      <span>{{ 'side-menu.to-do-list' | translate}}</span>
     </a>
    </ng-container>
 </div>

  <div class="mt-auto pb-16 pt-4 border-t border-surface-200 dark:border-surface-700 flex-shrink-0"> <!-- Added flex-shrink-0 -->

    <!-- Household Join Code Section -->
    <ng-container *ngIf="(isLoggedIn$ | async) && (household$ | async) as household">
        <div *ngIf="household && household.householdJoinKey" class="mb-4">
            <label class="block text-xs font-medium text-surface-500 dark:text-surface-400 mb-1">{{'side-menu.household-invitation-code'|translate}} :</label>
            <div class="flex items-center justify-between gap-2 p-2 rounded bg-surface-100 dark:bg-surface-700 border border-surface-200 dark:border-surface-600">
                <span class="font-mono text-sm text-surface-700 dark:text-surface-200 truncate">
                    {{ household.householdJoinKey }}
                </span>
                <button pButton pRipple type="button" icon="pi pi-copy"
                        class="p-button-sm p-button-text p-button-secondary flex-shrink-0"
                        [pTooltip]="'side-menu.tooltip.copy-code' | translate" tooltipPosition="top"
                        [cdkCopyToClipboard]="household.householdJoinKey"
                        (cdkCopyToClipboardCopied)="onCopySuccess()">
                </button>
            </div>
        </div>
    </ng-container>

    <button *ngIf="(isLoggedIn$ | async)"
            pButton
            pRipple
            type="button"
            icon="pi pi-users"
            class="p-button-secondary p-button-text text-left w-full justify-start mb-2"
            (click)="openJoinHouseholdDialog()">
            {{'side-menu.join-household' | translate}}
    </button>

    
  <!-- Menu Items -->
  <div class="flex flex-col space-y-2 flex-grow overflow-y-auto">
    <!-- Add other mobile navigation links here -->
    <!-- Example: <a routerLink="/dashboard" class="p-button p-button-text text-left w-full justify-start" (click)="toggleMenu()">Dashboard</a> -->
    <!-- Example: <a routerLink="/tasks" class="p-button p-button-text text-left w-full justify-start" (click)="toggleMenu()">Tasks</a> -->
    <a *ngIf="(isLoggedIn$ | async) && (household$ | async)"
       routerLink="/household/manage"
       class="p-button p-button-text text-left w-full justify-start flex items-center gap-2"
       (click)="toggleMenu()"> <!-- Close menu on click -->
       <i class="pi pi-cog"></i>
       <span>{{ 'side-menu.manage-household' | translate}}</span>
    </a>
    <!-- *** ADD MOBILE LOGOUT BUTTON BACK *** -->
    <button *ngIf="isLoggedIn$ | async"
            pButton
            pRipple
            type="button"
            icon="pi pi-sign-out"
            class="p-button-danger p-button-text text-left w-full justify-start"
            (click)="logout()">
            {{'side-menu.logout' | translate}}
    </button>
    <!-- *** END MOBILE LOGOUT BUTTON *** -->

  </div> <!-- End Menu Items -->
  
  </div>
</div>

<p-panel header="Manage Travel Template">
  <p class="m-0 mb-3">
    Add or remove items that will be used as a starting point for all new trips.
  </p>
  
  <form [formGroup]="newItemForm" (ngSubmit)="addItem()" class="p-fluid p-formgrid grid align-items-center">
    <div class="field col">
      <input pInputText formControlName="name" placeholder="Item name" />
    </div>
    <div class="field col">
      <p-dropdown [options]="categories" formControlName="category" placeholder="Select a Category"></p-dropdown>
    </div>
    <div class="field col-fixed" style="width: 120px;">
      <p-button type="submit" label="Add" icon="pi pi-plus" [disabled]="newItemForm.invalid"></p-button>
    </div>
  </form>

  <p-table [value]="templateItems" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Category</th>
        <th style="width: 5rem;"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.category }}</td>
        <td>
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="deleteItem(item.id)"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="3">Your template is empty. Add some items to get started.</td>
        </tr>
    </ng-template>
  </p-table>
</p-panel>

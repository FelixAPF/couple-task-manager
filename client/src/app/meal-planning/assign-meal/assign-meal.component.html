<p-toast></p-toast>

<div class="assign-meal-container p-4">
  <h3 class="text-lg font-semibold mb-3">Assigner un repas pour le {{ formattedTargetDate }}</h3>

  <p-progressSpinner *ngIf="isLoading" styleClass="w-8 h-8" strokeWidth="4"></p-progressSpinner>

  <p-message *ngIf="errorLoading" severity="error" text="Erreur lors du chargement des recettes."></p-message>

  <div *ngIf="!isLoading && !errorLoading">

    <!-- Search Bar -->
    <div class="mb-4">
      <p-iconField iconPosition="left" styleClass="w-full">
        <p-inputIcon class="pi pi-search"></p-inputIcon>
        <input type="text" pInputText [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" placeholder="Rechercher une recette..." class="w-full" />
      </p-iconField>
    </div>
    <!-- End Search Bar -->

    <!-- Recipe List - Now uses filteredRecipes -->
    <div class="recipe-list mb-6 max-h-[40vh] overflow-y-auto p-2 rounded-md bg-surface-0 dark:bg-surface-800">
       <!-- Loop over filteredRecipes -->
       <div *ngFor="let recipe of filteredRecipes"
           class="recipe-item flex items-center p-2 cursor-pointer border-b border-surface-200 dark:border-surface-700 last:border-b-0 hover:bg-surface-50 dark:hover:bg-surface-700 transition-colors duration-150 rounded-md"
           [ngClass]="{'bg-primary-50 dark:bg-primary-900 !border-primary-500 ring-1 ring-primary-500': selectedRecipe?.id === recipe.id}"
           (click)="selectRecipe(recipe)">
         <img [src]="recipe.imageUrl || 'assets/recipe_placeholder.jpg'"
              alt="{{ recipe.name }}"
              class="w-12 h-12 object-cover rounded-md mr-3 flex-shrink-0"
              onError="this.src='assets/recipe_placeholder.jpg'">
         <div class="flex-grow">
           <div class="font-medium text-sm text-surface-800 dark:text-surface-100">{{ recipe.name }}</div>
           <p-tag *ngIf="recipe.category" [value]="recipe.category" severity="info" styleClass="text-xs mt-1"></p-tag>
         </div>
         <i *ngIf="selectedRecipe?.id === recipe.id" class="pi pi-check text-primary-500 ml-2 text-lg"></i>
       </div>

       <!-- Message when no recipes exist at all -->
       <div *ngIf="recipes.length === 0 && !isLoading" class="p-3 text-center text-surface-500 dark:text-surface-400">
         Aucune recette trouvée. Cliquez sur "Créer Recette" pour en ajouter.
       </div>

       <!-- Message when filter yields no results but recipes exist -->
       <div *ngIf="recipes.length > 0 && filteredRecipes.length === 0 && !isLoading" class="p-3 text-center text-surface-500 dark:text-surface-400">
         Aucune recette ne correspond à votre recherche "{{ searchTerm }}".
       </div>
    </div>
    <!-- End Recipe List -->

    <!-- Location Input -->
    <div class="field mb-4">
        <label for="location" class="block text-sm font-medium mb-1 text-surface-700 dark:text-surface-200">Lieu du repas</label>
        <input #locationInput id="location" type="text" pInputText [(ngModel)]="selectedLocation" class="w-full">
    </div>
    <!-- End Location Input -->

    <!-- Dialog Footer -->
    <div class="dialog-footer flex justify-between items-center mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
       <div>
         <button pButton pRipple type="button" icon="pi pi-plus" label="Créer Recette" class="p-button-outlined p-button-secondary mr-2" (click)="openCreateRecipeDialog()" pTooltip="Créer une nouvelle recette"></button>
       </div>
       <div>
         <button pButton pRipple type="button" label="Annuler" class="p-button-text mr-2" (click)="closeDialog()"></button>
         <button pButton pRipple type="button" label="Assigner ce repas" icon="pi pi-check" class="p-button-primary" [disabled]="!selectedRecipe" (click)="assignSelectedMeal()"></button>
       </div>
    </div>

  </div>
</div>

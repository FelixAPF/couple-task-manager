<div class="container p-4 mx-auto flex flex-col flex-grow">

  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-center mb-6 p-4 bg-surface-50 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 gap-4">
    <!-- Title -->
    <h2 class="text-xl sm:text-2xl font-semibold text-surface-800 dark:text-surface-100 text-center sm:text-left">
      Gestion & Répartition
    </h2>

    <!-- Button Group Container -->
    <div class="flex gap-2 w-full sm:w-auto justify-center sm:justify-end">
      <!-- Planifier Période Button (Was Assigner) -->
      <p-button
        (click)="create()"
        label="Assigner les tâches"        
        icon="pi pi-user-plus"      
        styleClass="p-button-outlined p-button-secondary flex-1 sm:flex-none" 
        pTooltip="Planifier les tâches pour une nouvelle période"
        tooltipPosition="bottom">
      </p-button>

      <!-- Créer Tâche Button -->
      <p-button
        (click)="openNewTaskDialog()"
        label="Créer Tâche"
        icon="pi pi-plus"
        styleClass="p-button-raised p-button-primary flex-1 sm:flex-none"
        pTooltip="Créer une nouvelle définition de tâche"
        tooltipPosition="bottom">
      </p-button>
    </div> <!-- End Button Group Container -->

  </div>

  <!-- Container for the two assignee lists -->
  <div class="flex flex-col sm:flex-row gap-6 flex-grow">
    <!-- Column for Felix's Tasks -->
    <div class="w-full sm:w-1/3 flex flex-col">
      <!-- The app-assignee-task-list component handles its own internal styling (header, cards) -->
      <app-assignee-task-list
        (unassignEmitter)="unassign($event)"
        [taskList]="tasksCopain"
        title="Tâches Copain"
        [assignee]="ASSIGNEE.Felix"
        (editTaskEmitter)="openNewTaskDialog($event)"
        (deleteTaskEmitter)="deleteTask($event)"
        class="flex-grow"> <!-- Allows this component to fill vertical space -->
      </app-assignee-task-list>
    </div>

    <!-- Column for Camille's Tasks -->
    <div class="w-full sm:w-1/3 flex flex-col">
      <!-- The app-assignee-task-list component handles its own internal styling (header, cards) -->
      <app-assignee-task-list
        (unassignEmitter)="unassign($event)"
        [taskList]="tasksCopine"
        title="Tâches Copine"
        (editTaskEmitter)="openNewTaskDialog($event)"
        (deleteTaskEmitter)="deleteTask($event)"
        [assignee]="ASSIGNEE.Camille"
        class="flex-grow"> <!-- Allows this component to fill vertical space -->
      </app-assignee-task-list>
    </div>

    <!-- Column for Camille's Tasks -->
    <div class="w-full sm:w-1/3 flex flex-col">
      <!-- The app-assignee-task-list component handles its own internal styling (header, cards) -->
      <app-assignee-task-list
        (unassignEmitter)="unassign($event)"
        (editTaskEmitter)="openNewTaskDialog($event)"
        (deleteTaskEmitter)="deleteTask($event)"
        [taskList]="unassignedTasks"
        title="Tâches non assignées"
        [assignee]="ASSIGNEE.Unassigned"
        class="flex-grow"> <!-- Allows this component to fill vertical space -->
      </app-assignee-task-list>
    </div>
  </div>

  <!-- Add some padding at the bottom -->
  <div class="pb-12"></div>
  <p-confirmDialog></p-confirmDialog>

</div>

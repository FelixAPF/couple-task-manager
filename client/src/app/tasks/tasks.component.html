<div class="flex flex-col min-h-screen">
  <div class="container p-4 flex-grow">
    <p-card>
      <div class="flex justify-between items-center mb-4">
        <p class="text-2xl font-semibold">Gérer les tâches</p>
        <p-button (onClick)="openNewTaskDialog()" class="create-button">Ajouter</p-button>
      </div>

      <div>
        <p-table
          [value]="tasks"
          [paginator]="true"
          [rows]="10"
          [showCurrentPageReport]="true"
          currentPageReportTemplate="Affichage des éléments {first} à {last} de {totalRecords}"
          [rowsPerPageOptions]="[10, 25, 100]"
        >
          <ng-template #header>
            <tr>
              <th style="width: 30%">Titre</th>
              <th style="width: 40%">Description</th>
              <th style="width: 20%">Fréquence</th>
              <th style="width: 20%">Pièce</th>
              <th style="width: 15%">Delete</th>
            </tr>
          </ng-template>
          <ng-template #body let-element>
            <tr>
              <td>{{ element.title }}</td>
              <td>{{ element.description }}</td>
              <td>{{ element.frequency | frequencyPipe }}</td>
              <td>{{ element.room | roomPipe }}</td>
              <td>
                <div class="flex justify-center flex-wrap gap-4" id="element.id">
                  <p-toast></p-toast>
                  <p-splitbutton
                    [appendTo]="element.id"
                    label="Supprimer"
                    (onClick)="delete($event, element.id)"
                    [model]="items(element)"
                    severity="danger"
                  ></p-splitbutton>
                </div>
              </td>
            </tr>
          </ng-template>
        </p-table>
        <div class="pb-12"></div>
      </div>
      <p-toast></p-toast>
      <p-confirmdialog></p-confirmdialog>
    </p-card>
  </div>
</div>

<div *ngIf="isLoggedIn$ | async" class="fixed bottom-0 inset-x-0 z-50 lg:hidden pointer-events-none">
  <div class="footer-navbar-safe-area px-3 pointer-events-auto">

    <nav class="flex items-center gap-0.5 min-h-[64px] px-2 py-2 overflow-x-auto no-scrollbar snap-x snap-mandatory
                rounded-[28px] bg-white/95 dark:bg-surface-900/95 backdrop-blur-xl
                border border-surface-200/70 dark:border-surface-700/60
                shadow-[0_-8px_30px_-8px_rgba(0,0,0,0.15)] dark:shadow-[0_-8px_30px_-8px_rgba(0,0,0,0.55)]">

      <a routerLink="/dashboard" routerLinkActive #rlaDash="routerLinkActive" [routerLinkActiveOptions]="{exact:true}"
         class="nav-item shrink-0 snap-center min-w-[62px] flex items-center justify-center p-1 rounded-2xl active:scale-90 transition-transform duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
        <ng-container *ngTemplateOutlet="navItem; context: { icon: 'pi-home', label: 'Dashboard', active: rlaDash.isActive }"></ng-container>
      </a>

      <a routerLink="/tasks" *ngIf="household && household.enableTasks"
         routerLinkActive #rlaTasks="routerLinkActive"
         class="nav-item shrink-0 snap-center min-w-[62px] flex items-center justify-center p-1 rounded-2xl active:scale-90 transition-transform duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
        <ng-container *ngTemplateOutlet="navItem; context: { icon: 'pi-list', label: 'Tâches', active: rlaTasks.isActive }"></ng-container>
      </a>

      <a routerLink="/finance/dashboard" *ngIf="household && household.enableTasks"
         routerLinkActive #rlaFinance="routerLinkActive"
         class="nav-item shrink-0 snap-center min-w-[62px] flex items-center justify-center p-1 rounded-2xl active:scale-90 transition-transform duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
        <ng-container *ngTemplateOutlet="navItem; context: { icon: 'pi-money-bill', label: 'Finances', active: rlaFinance.isActive }"></ng-container>
      </a>

      <a routerLink="/meals" *ngIf="household && household.enableMeal"
         routerLinkActive #rlaMeals="routerLinkActive"
         class="nav-item shrink-0 snap-center min-w-[62px] flex items-center justify-center p-1 rounded-2xl active:scale-90 transition-transform duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
        <ng-container *ngTemplateOutlet="navItem; context: { faIcon: 'fa-regular fa-lemon', label: 'Repas', active: rlaMeals.isActive }"></ng-container>
      </a>

      <a routerLink="/household/contacts"
         routerLinkActive #rlaContacts="routerLinkActive"
         class="nav-item shrink-0 snap-center min-w-[62px] flex items-center justify-center p-1 rounded-2xl active:scale-90 transition-transform duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
        <ng-container *ngTemplateOutlet="navItem; context: { icon: 'pi-address-book', label: 'Contacts', active: rlaContacts.isActive }"></ng-container>
      </a>

      <a routerLink="/shopping-list" *ngIf="household && household.enableShoppingList"
         routerLinkActive #rlaShopping="routerLinkActive"
         class="nav-item shrink-0 snap-center min-w-[62px] flex items-center justify-center p-1 rounded-2xl active:scale-90 transition-transform duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
        <ng-container *ngTemplateOutlet="navItem; context: { icon: 'pi-shopping-cart', label: 'Courses', active: rlaShopping.isActive }"></ng-container>
      </a>

      <a routerLink="/food-tracking" *ngIf="household && household.enableFoodIntakeTracking"
         routerLinkActive #rlaFood="routerLinkActive"
         class="nav-item shrink-0 snap-center min-w-[62px] flex items-center justify-center p-1 rounded-2xl active:scale-90 transition-transform duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
        <ng-container *ngTemplateOutlet="navItem; context: { faIcon: 'fa fa-cutlery', label: ('footer-navbar.food-intake-tracking' | translate), active: rlaFood.isActive }"></ng-container>
      </a>

    </nav>
  </div>
</div>

<!-- Shared visual template for a single tab: icon capsule + label, styled from the `active` flag -->
<ng-template #navItem let-icon="icon" let-faIcon="faIcon" let-label="label" let-active="active">
  <div class="flex flex-col items-center justify-center gap-1 transition-transform duration-200 w-full"
       [class.-translate-y-0.5]="active">
    <div class="w-10 h-10 rounded-2xl flex items-center justify-center transition-all duration-200"
         [ngClass]="active
           ? 'bg-gradient-to-br from-primary-500 to-pink-500 shadow-md shadow-primary-500/30 text-white'
           : 'text-surface-400 dark:text-surface-500'">
      <i *ngIf="icon" class="pi text-lg" [ngClass]="icon"></i>
      <i *ngIf="faIcon" class="text-base" [ngClass]="faIcon"></i>
    </div>
    <span class="text-[10px] font-bold leading-none whitespace-nowrap transition-colors duration-200"
          [ngClass]="active ? 'text-primary-600 dark:text-primary-400' : 'text-surface-400 dark:text-surface-500'">
      {{ label }}
    </span>
  </div>
</ng-template>

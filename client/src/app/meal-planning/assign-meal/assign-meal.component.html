<p-toast></p-toast>

<div class="assign-meal-container flex flex-col h-full bg-surface-0 dark:bg-surface-800 p-2 md:p-4">
  
  <div class="flex items-center gap-3 mb-5 border-b border-surface-200 dark:border-surface-700 pb-3">
    <div class="w-10 h-10 rounded-full bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center text-primary-600 dark:text-primary-400">
      <i class="pi pi-calendar text-xl"></i>
    </div>
    <div>
      <h3 class="text-lg font-bold text-surface-900 dark:text-surface-0 m-0 leading-tight">Planifier un repas</h3>
      <p class="text-sm text-surface-500 dark:text-surface-400 m-0 capitalize">{{ formattedTargetDate }}</p>
    </div>
  </div>

  <p-message *ngIf="errorLoading" severity="error" text="Erreur lors du chargement des recettes."></p-message>

  <div *ngIf="!errorLoading" class="flex flex-col gap-6">

    <div class="flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <label class="font-semibold text-surface-700 dark:text-surface-200">1. Choisir la recette</label>
            <button pButton pRipple type="button" icon="pi pi-sparkles" label="IA Planner" class="p-button-text p-button-sm p-button-help" (click)="openAiPlannerDialog()" pTooltip="Planifier la semaine avec l'IA"></button>
            <button pButton pRipple type="button" icon="pi pi-plus" label="Nouvelle" class="p-button-text p-button-sm p-button-secondary" (click)="openCreateRecipeDialog()" pTooltip="Créer une nouvelle recette"></button>
        </div>

        <p-iconField iconPosition="left" styleClass="w-full">
            <p-inputIcon class="pi pi-search"></p-inputIcon>
            <input type="text" pInputText [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" placeholder="Rechercher une recette..." class="w-full" />
        </p-iconField>

        <div class="recipe-list max-h-[25vh] overflow-y-auto p-2 rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-900/50 shadow-inner">
           <div *ngFor="let recipe of filteredRecipes"
               class="recipe-item flex items-center p-2 mb-1 cursor-pointer border border-transparent hover:border-surface-300 dark:hover:border-surface-600 transition-all duration-150 rounded-lg"
               [ngClass]="{'bg-primary-50 dark:bg-primary-900/40 !border-primary-500 ring-1 ring-primary-500 shadow-sm': selectedRecipe?.id === recipe.id}"
               (click)="selectRecipe(recipe)">
             <img [src]="recipe.imageUrl || 'assets/recipe_placeholder.jpg'"
                  alt="{{ recipe.name }}"
                  class="w-12 h-12 object-cover rounded-md mr-3 flex-shrink-0 shadow-sm">
             <div class="flex-grow">
               <div class="font-medium text-sm text-surface-800 dark:text-surface-100 line-clamp-1">{{ recipe.name }}</div>
               <p-tag *ngIf="recipe.category" [value]="recipe.category" severity="info" styleClass="text-xs mt-1 py-0.5 px-2"></p-tag>
             </div>
             <i *ngIf="selectedRecipe?.id === recipe.id" class="pi pi-check-circle text-primary-500 ml-2 text-xl mr-1"></i>
           </div>

           <div *ngIf="recipes.length === 0" class="p-4 text-center text-surface-500 dark:text-surface-400">
             Aucune recette trouvée. Cliquez sur "Nouvelle" pour en ajouter.
           </div>
           <div *ngIf="recipes.length > 0 && filteredRecipes.length === 0" class="p-4 text-center text-surface-500 dark:text-surface-400">
             Aucune recette ne correspond à "{{ searchTerm }}".
           </div>
        </div>
    </div>

    <div class="bg-surface-50 dark:bg-surface-800/40 p-4 rounded-xl border border-surface-200 dark:border-surface-700 flex flex-col gap-5">
        <label class="font-semibold text-surface-700 dark:text-surface-200">2. Détails & Assignation</label>

        <div class="flex flex-col items-center py-2 bg-surface-0 dark:bg-surface-900/50 rounded-lg border border-surface-100 dark:border-surface-800 shadow-sm">
            <p class="text-sm font-medium text-surface-600 dark:text-surface-300 mb-3">Qui s'occupe de ce repas ?</p>
            <app-household-member-selector 
                [preSelectedUser]="assignee" 
                (householdMemberSelected)="onAssigneeSelected($event)">
            </app-household-member-selector>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-1">
            <div class="flex flex-col gap-2 justify-center">
                <label for="location" class="text-xs font-semibold text-surface-600 dark:text-surface-400 uppercase tracking-wider ml-1">Lieu du repas</label>
                <p-iconField iconPosition="left">
                    <p-inputIcon class="pi pi-map-marker"></p-inputIcon>
                    <input #locationInput id="location" type="text" pInputText [(ngModel)]="selectedLocation" class="w-full">
                </p-iconField>
            </div>

            <div class="flex flex-col justify-end">
                <div class="flex items-center justify-between p-3 h-[42px] bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-100 dark:border-blue-800/50 transition-colors" [ngClass]="{'bg-blue-100 dark:bg-blue-900/40 border-blue-300 dark:border-blue-600': isThawingNeeded}">
                    <div class="flex items-center gap-2">
                        <i class="pi pi-snowflake text-blue-500 dark:text-blue-300 text-lg"></i>
                        <span class="font-medium text-blue-800 dark:text-blue-200 text-sm">Décongélation</span>
                    </div>
                    <p-inputSwitch [(ngModel)]="isThawingNeeded"></p-inputSwitch>
                </div>
                <span class="text-[10px] text-surface-400 dark:text-surface-500 mt-1 px-1"><i class="pi pi-bell text-[9px] mr-1"></i>Envoie un rappel la veille à 20h.</span>
            </div>
        </div>
    </div>

    <div class="flex justify-end gap-3 mt-2 pt-4 border-t border-surface-200 dark:border-surface-700">
         <button pButton pRipple type="button" label="Annuler" class="p-button-text p-button-secondary" (click)="closeDialog()"></button>
         <button pButton pRipple type="button" label="Confirmer le repas" icon="pi pi-check" class="p-button-primary px-4" [disabled]="!selectedRecipe" (click)="assignSelectedMeal()"></button>
    </div>

  </div>
</div>

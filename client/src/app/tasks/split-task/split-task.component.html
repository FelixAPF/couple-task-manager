<div class="container p-4 mx-auto flex flex-col flex-grow">

  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-center mb-6 p-4 bg-surface-50 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 gap-4">
    <h2 class="text-2xl font-semibold text-surface-800 dark:text-surface-100 text-center sm:text-left">
      Répartition des tâches
    </h2>
    <p-button
      label="Créer"
      icon="pi pi-plus"
      styleClass="p-button-raised p-button-primary w-full sm:w-auto"
      (click)="create()"
      pTooltip="Créer une nouvelle répartition"
      tooltipPosition="bottom">
    </p-button>
  </div>

  <!-- Container for the two assignee lists -->
  <div class="flex flex-col sm:flex-row gap-6 flex-grow">
    <!-- Column for Felix's Tasks -->
    <div class="w-full sm:w-1/2 flex flex-col">
      <!-- The app-assignee-task-list component handles its own internal styling (header, cards) -->
      <app-assignee-task-list
        (unassignEmitter)="unassign($event)"
        [taskList]="tasksCopain"
        title="Tâches Copain"
        class="flex-grow"> <!-- Allows this component to fill vertical space -->
      </app-assignee-task-list>
    </div>

    <!-- Column for Camille's Tasks -->
    <div class="w-full sm:w-1/2 flex flex-col">
      <!-- The app-assignee-task-list component handles its own internal styling (header, cards) -->
      <app-assignee-task-list
        (unassignEmitter)="unassign($event)"
        [taskList]="tasksCopine"
        title="Tâches Copine"
        class="flex-grow"> <!-- Allows this component to fill vertical space -->
      </app-assignee-task-list>
    </div>
  </div>

  <!-- Add some padding at the bottom -->
  <div class="pb-12"></div>

</div>

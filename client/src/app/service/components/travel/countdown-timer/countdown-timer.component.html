<!-- Voyage à venir : Compte à rebours actif -->
<div *ngIf="status === 'upcoming'"
     class="bg-gradient-to-br from-indigo-500/10 via-sky-500/5 to-purple-500/10 dark:from-indigo-900/30 dark:to-purple-900/20 border border-indigo-100 dark:border-indigo-800/40 rounded-3xl p-5 shadow-sm">
  <div class="flex items-center justify-center gap-2 mb-4">
    <i class="pi pi-clock text-indigo-500 text-sm"></i>
    <span class="text-xs font-black uppercase tracking-wider text-surface-600 dark:text-surface-300">
      Temps restant avant le départ
    </span>
  </div>

  <div class="grid grid-cols-4 gap-2 sm:gap-4 text-center max-w-md mx-auto">
    <div class="bg-white dark:bg-surface-800 p-2.5 sm:p-3 rounded-2xl border border-surface-200/80 dark:border-surface-700 shadow-sm">
      <span class="block text-2xl sm:text-3xl font-black text-indigo-600 dark:text-indigo-400 tabular-nums">{{ days }}</span>
      <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-surface-400 dark:text-surface-500">Jours</span>
    </div>
    <div class="bg-white dark:bg-surface-800 p-2.5 sm:p-3 rounded-2xl border border-surface-200/80 dark:border-surface-700 shadow-sm">
      <span class="block text-2xl sm:text-3xl font-black text-indigo-600 dark:text-indigo-400 tabular-nums">{{ hours }}</span>
      <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-surface-400 dark:text-surface-500">Heures</span>
    </div>
    <div class="bg-white dark:bg-surface-800 p-2.5 sm:p-3 rounded-2xl border border-surface-200/80 dark:border-surface-700 shadow-sm">
      <span class="block text-2xl sm:text-3xl font-black text-indigo-600 dark:text-indigo-400 tabular-nums">{{ minutes }}</span>
      <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-surface-400 dark:text-surface-500">Min</span>
    </div>
    <div class="bg-white dark:bg-surface-800 p-2.5 sm:p-3 rounded-2xl border border-surface-200/80 dark:border-surface-700 shadow-sm">
      <span class="block text-2xl sm:text-3xl font-black text-indigo-600 dark:text-indigo-400 tabular-nums">{{ seconds }}</span>
      <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-surface-400 dark:text-surface-500">Sec</span>
    </div>
  </div>
</div>

<!-- Jour du départ -->
<div *ngIf="status === 'today'"
     class="flex items-center justify-center gap-2.5 bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-200 dark:border-indigo-800/50 rounded-2xl px-5 py-3 text-indigo-700 dark:text-indigo-300 font-bold text-sm shadow-sm">
  <i class="fa-solid fa-plane-departure text-base"></i>
  <span>Jour du départ !</span>
</div>

<!-- Voyage passé : affichage neutre et discret -->
<div *ngIf="status === 'past'"
     class="flex items-center justify-center gap-2 bg-surface-100 dark:bg-surface-800/60 border border-surface-200/80 dark:border-surface-700/80 rounded-2xl px-4 py-2.5 text-surface-500 dark:text-surface-400 font-semibold text-xs">
  <i class="pi pi-history text-xs"></i>
  <span>Voyage passé</span>
</div>

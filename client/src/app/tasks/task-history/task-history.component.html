<div *ngIf="loading" class="flex justify-center p-4">
    <i class="pi pi-spin pi-spinner text-2xl text-primary-500"></i>
</div>

<div *ngIf="!loading && historyLogs.length === 0" class="text-center p-6 text-surface-500 dark:text-surface-400 bg-surface-50 dark:bg-surface-800 rounded-lg border border-dashed">
    <i class="pi pi-clock text-3xl mb-2 text-surface-400"></i>
    <p>Aucun historique pour cette tâche.</p>
</div>

<div *ngIf="!loading && historyLogs.length > 0" class="flex flex-col gap-3 max-h-[400px] overflow-y-auto pr-2">
    <div *ngFor="let log of historyLogs" class="flex items-center gap-3 p-3 bg-white dark:bg-surface-800 border dark:border-surface-700 rounded-lg shadow-sm">
        <img [src]="log.completedBy?.imageUrl || 'assets/placeholder.jpg'" 
             class="w-10 h-10 rounded-full border border-surface-200 dark:border-surface-700 object-cover" 
             [pTooltip]="log.completedBy?.name" tooltipPosition="top">
        
        <div class="flex-grow">
            <p class="font-medium text-surface-900 dark:text-surface-0">{{ log.completedBy?.name }} a complété cette tâche</p>
            <p class="text-xs text-surface-500 flex items-center gap-1">
                <i class="pi pi-calendar-check text-[10px]"></i>
                {{ log.completedDate | date:'medium' }}
            </p>
        </div>
    </div>
</div>

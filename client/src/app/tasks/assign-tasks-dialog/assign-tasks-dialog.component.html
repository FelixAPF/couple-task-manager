<div class="dialog-container">
  
  <div class="filters-container">
    <span class="p-input-icon-left w-full">
        <i class="pi pi-search"></i>
        <input type="text" pInputText [(ngModel)]="searchTerm" (ngModelChange)="filterTasks()" placeholder="Search tasks..." class="w-full" />
    </span>

    <div class="dropdowns-row">
        <p-dropdown 
            [options]="rooms" 
            [(ngModel)]="selectedRoom" 
            (onChange)="filterTasks()" 
            placeholder="Room" 
            [showClear]="true" 
            styleClass="w-full" 
            appendTo="body">
        </p-dropdown>
        
        <p-dropdown 
            [options]="frequencies" 
            [(ngModel)]="selectedFrequency" 
            (onChange)="filterTasks()" 
            placeholder="Frequency" 
            [showClear]="true" 
            styleClass="w-full" 
            appendTo="body">
        </p-dropdown>
    </div>
  </div>

  <div class="task-list-container">
    <div *ngFor="let task of filteredTasks" 
         class="task-item"
         [class.selected]="task.id && isSelected(task.id)"
         (click)="task.id && toggleSelection(task.id)">
      
      <div class="checkbox-wrapper">
        <p-checkbox [binary]="true" [ngModel]="task.id && isSelected(task.id)" (onChange)="task.id && toggleSelection(task.id)" (click)="$event.stopPropagation()"></p-checkbox>
      </div>
      
      <div class="task-content">  
        <span class="task-title" [pTooltip]="task.title" tooltipPosition="top">
            {{task.title}}
        </span>
        
        <div *ngIf="task.id && getAssignee(task.id)" class="assigned-indicator">
            <i class="pi pi-user mr-1 text-xs"></i> 
            <span>Assigned to {{ getAssignee(task.id) }}</span>
        </div>
        <span class="task-desc" *ngIf="task.description">
            {{task.description}}
        </span>
      </div>

      <div class="badges-container">
        <span class="badge badge-frequency" *ngIf="task.frequency" pTooltip="Frequency">
            <i class="pi pi-history"></i> {{ task.frequency | frequencyPipe }}
        </span>
        
        <span class="badge badge-room" *ngIf="task.room" pTooltip="Location">
            <i class="pi pi-home"></i> {{ task.room | roomPipe }}
        </span>
      </div>

    </div>
    
    <div *ngIf="filteredTasks.length === 0" class="empty-message">
      <i class="pi pi-filter-slash" style="font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.5;"></i>
      <span>No tasks found matching your filters.</span>
    </div>
  </div>

  <div class="dialog-footer">
    <p-button label="Cancel" styleClass="p-button-text" (onClick)="close()"></p-button>
    <p-button label="Assign Tasks" (onClick)="submit()" [disabled]="selectedTasks.length === 0">
        <ng-template pTemplate="icon">
            <i class="pi pi-check mr-2"></i>
            <span *ngIf="selectedTasks.length > 0" class="font-bold mr-1">{{selectedTasks.length}}</span>
        </ng-template>
    </p-button>
  </div>

</div>

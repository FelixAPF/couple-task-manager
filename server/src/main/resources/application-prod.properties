spring.application.name=task-manager
spring.thymeleaf.prefix=classpath:/config/templates/

spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.url=${DATABASE_URL}
spring.jpa.hibernate.ddl-auto=update
app.base-url=${DNS_URL}
logging.level.org.springframework.security=${LOG_LEVEL}


app.jwt.expiration-ms=2592000000
app.jwt.secret=${JWT_SECRET}

# Your Google Cloud Project ID
gcp.project.id=couple-task-manager-458414
# The region where you are using Vertex AI (e.g., us-central1)
gcp.region=us-central1
# The specific Imagen model you want to use
gcp.model.name=imagen-3.0-generate-002


gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent
gemini.imagen.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp-image-generation:generateContent
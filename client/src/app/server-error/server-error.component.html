<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4 py-12">
  <div class="max-w-md w-full space-y-8 bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl text-center">

    <div class="mx-auto flex items-center justify-center h-24 w-24 rounded-full bg-red-100 dark:bg-red-900">
      <svg class="h-16 w-16 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
    </div>

    <h2 class="mt-6 text-3xl font-extrabold text-gray-900 dark:text-white">
        {{'server-error.title'|translate}}
    </h2>

    <p class="mt-2 text-base text-gray-600 dark:text-gray-300">
        {{'server-error.message'|translate}}
    </p>

    <p *ngIf="isMaintenanceMode" class="mt-2 text-sm text-yellow-600 dark:text-yellow-400 font-medium">
        {{'server-error.maintenance'|translate}}
    </p>

    <div class="mt-6 flex flex-col items-center space-y-4">
      <button
        class="w-full sm:w-auto flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200"
        (click)="reloadPage()"
        routerLink="/"
      >
        <svg class="-ml-1 mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356-2A8.001 8.001 0 004 13v1a8.001 8.001 0 0015.356 2M17 9V3M7 3v6"></path>
        </svg>
        {{'server-error.try-again'|translate}}
      </button>
    </div>

    <p class="mt-8 text-xs text-gray-500 dark:text-gray-400">
        {{'server-error.thanks'|translate}}
    </p>
  </div>
</div>

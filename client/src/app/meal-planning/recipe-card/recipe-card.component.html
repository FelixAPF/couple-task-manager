<p-card [styleClass]="'recipe-card h-full flex flex-col bg-white dark:bg-surface-800 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all duration-300 rounded-3xl overflow-hidden'">
    <ng-template pTemplate="header">
      <div class="relative h-56 bg-surface-50 dark:bg-surface-700 group"> 
        <img *ngIf="recipe.imageUrl; else imagePlaceholder" [src]="recipe.imageUrl" [alt]="recipe.name" class="w-full h-full object-cover rounded-t-3xl">
        
        <button 
          (click)="openEditRecipe($event)"
          class="absolute bottom-3 right-3 z-30 w-12 h-12 flex items-center justify-center cursor-pointer bg-white/90 dark:bg-surface-800/90 backdrop-blur-md rounded-full shadow-lg hover:bg-primary-500 hover:text-white transition-all duration-300 border border-white/20 dark:border-surface-600/50 hover:scale-110"
          [pTooltip]="'Modifier la recette'"
          tooltipPosition="left">
          <i class="pi pi-pencil text-[14px]"></i>
        </button>

        <ng-template #imagePlaceholder>
          <div #imagePlaceholderRef class="absolute inset-0 flex items-center justify-center text-surface-300 dark:text-surface-600">
            <i class="pi pi-image text-6xl"></i>
          </div>
        </ng-template>
      </div>
    </ng-template>

    <ng-template pTemplate="title">
      <span class="block text-2xl font-bold text-surface-900 dark:text-white leading-tight mt-2" [pTooltip]="recipe.name" tooltipPosition="top">
        {{ recipe.name }}
      </span>
    </ng-template>
    
    <ng-template pTemplate="subtitle">
      <div class="flex flex-wrap gap-x-2 gap-y-2 text-xs mb-4 mt-2">
        <span *ngIf="recipe.category">
           <p-tag [value]="`RECIPE_CATEGORY.${recipe.category}` | translate | titlecase" [severity]="getCategoryTagSeverity(recipe.category)" [rounded]="true" styleClass="px-3 py-1 font-bold tracking-wide shadow-sm"></p-tag>
        </span>
      </div>
    </ng-template>

    <ng-template pTemplate="content">
      <div class="flex-grow px-1">
        <p #descriptionParagraph *ngIf="recipe.description"
        class="text-sm text-surface-600 dark:text-surface-300 mb-1 description-paragraph leading-relaxed"
        [class.line-clamp-3]="clampDescription && !overrideDescriptionClamp">
       {{ recipe.description }}
     </p>
        <span *ngIf="clampDescription && isDescriptionOverflowing"
        (click)="toggleDescriptionClamp()"
        class="text-xs text-primary-600 dark:text-primary-400 hover:text-primary-700 font-bold mt-1 inline-block mb-4 cursor-pointer transition-colors description-paragraph">
          {{ overrideDescriptionClamp ? 'Voir moins' : 'Voir plus' }}
        </span>

        <p-accordion [value]="openIngredients ? 'ingredients' : ''" *ngIf="recipe.ingredients && recipe.ingredients.length > 0"
          styleClass="recipe-details-accordion">
        <p-accordion-panel value="ingredients"> 
            <p-accordion-header>
                Ingrédients <span class="bg-surface-200 dark:bg-surface-700 text-surface-700 dark:text-surface-300 px-2 py-0.5 rounded-full ml-2 text-xs">{{ recipe.ingredients.length }}</span>
            </p-accordion-header>
            <p-accordion-content>
                <div *ngIf="recipe.basePortionRatio && recipe.basePortionRatio > 0" class="mb-5 p-3 rounded-2xl bg-surface-50 dark:bg-surface-800/50 border border-surface-100 dark:border-surface-700">
                    <label for="portionInput-{{recipe.id || 0}}" class="block text-xs font-bold uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-2">
                        Portions
                    </label>
                    <div class="flex items-center gap-3"> 
                        <p-inputNumber
                            inputId="portionInput-{{recipe.id || 0}}"
                            [(ngModel)]="displayPortionRatio"
                            (ngModelChange)="onPortionChange()"
                            mode="decimal"
                            [showButtons]="true"
                            [min]="1"
                            [step]="1"
                            #portionInputRef
                            inputStyleClass="w-16 sm:w-20 px-3 py-2 text-base font-bold text-center border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-900 text-surface-800 dark:text-surface-100 rounded-xl focus:ring-2 focus:ring-primary-500 transition-all"
                            styleClass="p-inputnumber-sm" aria-label="Nombre de portions">
                        </p-inputNumber>
                        <small class="text-xs font-medium text-surface-400 dark:text-surface-500">
                              (Base: {{ recipe.basePortionRatio }})
                        </small>
                    </div>
                </div>
                <ul class="list-none p-0 m-0 space-y-2 text-sm text-surface-700 dark:text-surface-300"> 
                    <li *ngFor="let ingredient of scaledIngredients" class="flex items-start gap-2 border-b border-surface-100 dark:border-surface-700/50 pb-2 last:border-0">
                        <i class="pi pi-check text-emerald-500 mt-0.5 text-xs"></i>
                        <span class="flex-grow">{{ formatIngredient(ingredient) }}</span>
                        <i class="pi pi-plus-circle text-primary-400 hover:text-primary-600 cursor-pointer transition-colors p-1" (click)="addIngredientToShopList(ingredient)" pTooltip="Ajouter à la liste"></i>
                    </li>
                </ul>
            </p-accordion-content>
        </p-accordion-panel>
        </p-accordion>
      <p *ngIf="!recipe.ingredients || recipe.ingredients.length === 0" class="text-sm text-surface-400 dark:text-surface-500 italic mt-4 text-center">
        Aucun ingrédient listé.
      </p>
    </div>
  </ng-template>

    <ng-template pTemplate="footer" *ngIf="buttonsTemplate">
        <div class="flex justify-end gap-2 pt-4 border-t border-surface-100 dark:border-surface-700 mt-auto px-1">
            <ng-container [ngTemplateOutlet]="buttonsTemplate"></ng-container>
        </div>
    </ng-template>
  </p-card>

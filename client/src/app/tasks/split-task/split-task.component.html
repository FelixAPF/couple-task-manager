<div class="container p-4 flex flex-col flex-grow">
    <p-card class="flex flex-col flex-grow relative">
      <div class="flex justify-between items-center mb-4">
        <p class="font-semibold text-2xl">Répartition des tâches</p>
        <p-button
          class="create-button absolute top-4 right-4 z-10"
          size="large"
          mat-flat-button
          (click)="create()"
        >
          Créer
        </p-button>
      </div>
      <app-assignee-task-list
        (unassignEmitter)="unassign($event)"
        [taskList]="tasksCopain"
        title="Tâches Copain"
        class="flex-grow"
      ></app-assignee-task-list>
      <app-assignee-task-list
        (unassignEmitter)="unassign($event)"
        [taskList]="tasksCopine"
        title="Tâches Copine"
        class="flex-grow"
      ></app-assignee-task-list>
    </p-card>
  </div>

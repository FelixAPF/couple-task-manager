<div class="flex flex-col gap-4 h-full">
  <div *ngIf="!taskList?.tasks || !taskList?.tasks?.length" class="text-center text-surface-500 dark:text-surface-400 mt-4 p-4 border border-dashed rounded-lg bg-surface-50 dark:bg-surface-800 flex-grow flex items-center justify-center">
    <div>
      <i class="pi pi-inbox block text-2xl mb-2"></i>
      <span>Aucune tâche assignée à {{ title }}.</span>
    </div>
  </div>

  <div class="flex flex-col gap-3 overflow-y-auto flex-grow" *ngIf="taskList?.tasks && taskList?.tasks?.length">
    <div *ngFor="let task of taskList?.tasks">
      <p-card [styleClass]="'assigned-task-card shadow-sm hover:shadow-md transition-shadow duration-150 border-l-4 border-primary-500 dark:border-primary-400'">
        <div class="flex items-center gap-3">
          <div class="flex-grow min-w-0">
            <p class="text-base font-medium text-surface-800 dark:text-surface-100 mb-0.5 truncate" [pTooltip]="task.title" tooltipPosition="top">
              {{ task.title }}
            </p>
            <div class="text-xs text-surface-600 dark:text-surface-400 flex flex-wrap items-center gap-x-3 gap-y-0.5">
              <span class="flex items-center gap-1" pTooltip="Fréquence" tooltipPosition="bottom">
                <i class="pi pi-sync text-primary-500 dark:text-primary-400"></i>
                <span>{{ `FREQUENCY.${task.frequency}` | translate }}</span>
              </span>
              <span class="flex items-center gap-1" pTooltip="Pièce" tooltipPosition="bottom">
                <i class="pi pi-map-marker text-primary-500 dark:text-primary-400"></i>
                <span>{{ task.room }}</span>
              </span>
            </div>
            <p *ngIf="task.description" class="text-xs text-surface-500 dark:text-surface-500 mt-1 italic truncate" [pTooltip]="task.description" tooltipPosition="bottom">
              {{ task.description }}
            </p>
          </div>

          <div class="flex-shrink-0 flex flex-row items-center gap-1 ml-auto mt-3 sm:mt-0">
            <button pButton type="button"
                    icon="pi pi-history"
                    class="p-button-rounded p-button-secondary p-button-text"
                    [routerLink]="['history', task.id]"
                    pTooltip="Voir l'historique"
                    tooltipPosition="left">
            </button>
            <button pButton type="button"
                    icon="pi pi-pencil"
                    class="p-button-rounded p-button-info p-button-text"
                    (click)="editTask(task)"
                    pTooltip="Modifier"
                    tooltipPosition="left">
            </button>
            <button pButton type="button"
                    icon="pi pi-trash"
                    class="p-button-rounded p-button-danger p-button-text"
                    (click)="deleteTask($event, task)"
                    pTooltip="Supprimer"
                    tooltipPosition="left">
            </button>
          </div>
        </div>
      </p-card>
    </div>
  </div>
</div>

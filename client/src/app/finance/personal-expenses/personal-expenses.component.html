<div class="container p-4 md:p-6 mx-auto pb-20 lg:pb-6">
    <button pButton pRipple icon="pi pi-arrow-left" label="Retour" class="p-button-text p-button-secondary mb-4" routerLink="/finance/dashboard"></button>
    
    <div class="bg-surface-0 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 p-4 md:p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold text-surface-800 dark:text-surface-100 m-0">Dépenses personnelles</h2>
            <button pButton pRipple icon="pi pi-plus" label="Ajouter" class="p-button-primary p-button-sm hidden sm:block" (click)="addExpense()"></button>
        </div>

        <div *ngIf="expenses.length === 0" class="text-center py-8 text-surface-500 dark:text-surface-400 border border-dashed border-surface-200 dark:border-surface-700 rounded-lg">
            Aucune dépense personnelle configurée.
        </div>

        <div class="flex flex-col gap-4">
            <div *ngFor="let expense of expenses" class="bg-surface-50 dark:bg-surface-900 p-4 rounded-lg border border-surface-200 dark:border-surface-700 flex flex-col md:flex-row gap-4 items-start md:items-center">
                <div class="w-full md:w-1/4 flex flex-col gap-1">
                    <label class="text-xs font-medium text-surface-500">Nom / Objectif</label>
                    <input pInputText [(ngModel)]="expense.name" (blur)="saveExpense(expense)" class="w-full" placeholder="Ex: Hockey" />
                </div>
                <div class="w-full md:w-1/4 flex flex-col gap-1">
                    <label class="text-xs font-medium text-surface-500">Montant</label>
                    <p-inputNumber [(ngModel)]="expense.amount" (onBlur)="saveExpense(expense)" mode="currency" currency="CAD" styleClass="w-full" inputStyleClass="w-full"></p-inputNumber>
                </div>
                <div class="w-full md:w-1/4 flex flex-col gap-1">
                    <label class="text-xs font-medium text-surface-500">Fréquence</label>
                    <p-dropdown [options]="frequencies" [(ngModel)]="expense.frequency" (onChange)="saveExpense(expense)" styleClass="w-full" appendTo="body"></p-dropdown>
                </div>
                <div class="w-full md:w-1/4 flex flex-col gap-1">
                    <label class="text-xs font-medium text-surface-500">Compte cible</label>
                    <p-dropdown [options]="bankAccountOptions()" [(ngModel)]="expense.targetSubAccountId" (onChange)="onSubAccountChange(expense, $event.value)" placeholder="Sélectionner" [group]="true" styleClass="w-full" appendTo="body">
                        <ng-template let-group pTemplate="group">
                            <div class="font-bold text-primary-500">{{group.label}}</div>
                        </ng-template>
                    </p-dropdown>
                </div>
                <div class="flex-shrink-0 self-end md:self-center mt-2 md:mt-0">
                    <button pButton pRipple icon="pi pi-trash" class="p-button-danger p-button-text p-button-rounded" (click)="removeExpense(expense.id)"></button>
                </div>
            </div>
        </div>
        <button pButton pRipple icon="pi pi-plus" label="Ajouter une dépense" class="p-button-outlined w-full mt-4 sm:hidden" (click)="addExpense()"></button>
    </div>
</div>

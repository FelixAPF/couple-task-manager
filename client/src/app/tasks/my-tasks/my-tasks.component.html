

<div class="container d-block">
    <div class="float-right d-block" [formGroup]="formGroup">
        <p-select class="input-width" [formControlName]="DISPLAY_DURATION.DISPLAY_DURATION" (onChange)="onChange($event)" label="Affichage du" [options]="options" optionValue="value" optionLabel="label"></p-select>
        <p-button (click)="changeUser()" severity="info" class="switch-user">Changer Utilisateur</p-button>
    </div>
    <h2>Mes tâches - {{selectedAssignee}}</h2>
    
    <div class="mt-4">
        <p-table
        stripedRows="true"
        [value]="tasks"
        [paginator]="true"
        [rows]="10"
        sortField="dueDate"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[10, 25, 50]"
    >
        <ng-template #header>
            <tr>
                <th style="width:30%">Titre</th>
                <th style="width:30%">Description</th>
                <th style="width:10%">Pièce</th>
                <th style="width:15%">Deadline</th>
                <th style="width:15%">Compléter</th>
            </tr>
        </ng-template>
        <ng-template #body let-element>
            <tr>
                <td>{{ element.taskTitle }}</td>
                <td>{{ element.taskDescription }}</td>
                <td>{{ element?.room | roomPipe }}</td>
                <td>{{ element.dueDate | date: 'longDate' }}</td>
                <td (click)="completeTask(element)"><i class="pi pi-check hover" style="font-size: 1.5rem"></i></td>
            </tr>
        </ng-template>
    </p-table>
    </div>
    <div class="d-flex float-right">
        <p-button (click)="startNewPeriod()" class="create-button float-right">Débuter une période de tâches</p-button>
    </div>
</div>

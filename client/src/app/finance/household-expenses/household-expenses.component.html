<div class="container p-4 md:p-6 mx-auto pb-20 lg:pb-6">
    <button pButton pRipple icon="pi pi-arrow-left" label="Retour" class="p-button-text p-button-secondary mb-4" routerLink="/finance/dashboard"></button>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="col-span-1 bg-surface-0 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 p-4 md:p-6 h-fit">
            <h2 class="text-xl font-semibold mb-6 mt-0 text-surface-800 dark:text-surface-100">Ratios du ménage</h2>
            <div class="flex flex-col gap-6">
                <div *ngFor="let member of members" class="flex items-center gap-4">
                    <p-avatar [image]="member.iconUrl" size="xlarge" shape="circle"></p-avatar>
                    <div class="flex flex-col flex-grow gap-2">
                        <span class="font-semibold text-surface-800 dark:text-surface-100">{{ member.name }}</span>
                        <p-inputNumber [(ngModel)]="member.proratedPercentage" (onBlur)="updateMemberRatio(member)" [min]="0" [max]="100" suffix="%" styleClass="w-full" inputStyleClass="w-full"></p-inputNumber>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-span-1 lg:col-span-2 bg-surface-0 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 p-4 md:p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-surface-800 dark:text-surface-100 m-0">Dépenses communes</h2>
                <button pButton pRipple icon="pi pi-plus" label="Ajouter" class="p-button-primary p-button-sm hidden sm:block" (click)="addExpense()"></button>
            </div>

            <div *ngIf="expenses.length === 0" class="text-center py-8 text-surface-500 dark:text-surface-400 border border-dashed border-surface-200 dark:border-surface-700 rounded-lg">
                Aucune dépense commune configurée.
            </div>

            <div class="flex flex-col gap-4">
                <div *ngFor="let expense of expenses" class="bg-surface-50 dark:bg-surface-900 p-4 rounded-lg border border-surface-200 dark:border-surface-700 flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                    <div class="w-full sm:w-1/3 flex flex-col gap-1">
                        <label class="text-xs font-medium text-surface-500">Nom de la dépense</label>
                        <input pInputText [(ngModel)]="expense.name" (blur)="saveExpense(expense)" class="w-full" placeholder="Ex: Hypothèque" />
                    </div>
                    <div class="w-full sm:w-1/3 flex flex-col gap-1">
                        <label class="text-xs font-medium text-surface-500">Montant</label>
                        <p-inputNumber [(ngModel)]="expense.amount" (onBlur)="saveExpense(expense)" mode="currency" currency="CAD" styleClass="w-full" inputStyleClass="w-full"></p-inputNumber>
                    </div>
                    <div class="w-full sm:w-1/3 flex flex-col gap-2">
                        <label class="text-xs font-medium text-surface-500">Séparation</label>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center">
                                <p-radioButton [name]="'splitType' + expense.id" value="EQUAL" [(ngModel)]="expense.splitType" [inputId]="'eq' + expense.id" (onClick)="saveExpense(expense)"></p-radioButton>
                                <label [for]="'eq' + expense.id" class="ml-2 text-sm text-surface-700 dark:text-surface-200">50/50</label>
                            </div>
                            <div class="flex items-center">
                                <p-radioButton [name]="'splitType' + expense.id" value="PRORATED" [(ngModel)]="expense.splitType" [inputId]="'pr' + expense.id" (onClick)="saveExpense(expense)"></p-radioButton>
                                <label [for]="'pr' + expense.id" class="ml-2 text-sm text-surface-700 dark:text-surface-200">Prorata</label>
                            </div>
                        </div>
                    </div>
                    <div class="flex-shrink-0 self-end sm:self-center mt-2 sm:mt-0">
                        <button pButton pRipple icon="pi pi-trash" class="p-button-danger p-button-text p-button-rounded" (click)="removeExpense(expense.id)"></button>
                    </div>
                </div>
            </div>
            <button pButton pRipple icon="pi pi-plus" label="Ajouter une dépense" class="p-button-outlined w-full mt-4 sm:hidden" (click)="addExpense()"></button>
        </div>
    </div>
</div>

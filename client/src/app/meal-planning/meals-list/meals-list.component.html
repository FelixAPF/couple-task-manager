<p-confirmDialog [style]="{width: '50vw'}"></p-confirmDialog>
<p-toast></p-toast>

<div class="p-4 md:p-6 pb-16">

  <!-- Loading Indicator -->
  <div *ngIf="isLoading" class="flex justify-content-center align-items-center py-10">
    <p-progressSpinner styleClass="w-8 h-8" strokeWidth="4" animationDuration=".5s"></p-progressSpinner>
  </div>

  <!-- Error Message -->
  <div *ngIf="!isLoading && errorLoading" class="flex justify-content-center py-10">
     <p-message severity="error" text="Une erreur est survenue lors du chargement du plan de repas."></p-message>
  </div>

  <!-- Only show controls and grid when not loading/error -->
  <div *ngIf="!isLoading && !errorLoading">

    <!-- === Week Navigation Controls === -->
    <div class="flex justify-between items-center mb-4 md:mb-6 px-2 py-2 rounded-lg bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 shadow-sm">
      <button pButton pRipple type="button" icon="pi pi-arrow-left"
              class="p-button-rounded p-button-text"
              (click)="previousWeek()"
              pTooltip="Semaine précédente" tooltipPosition="bottom"
              aria-label="Semaine précédente">
      </button>

      <div class="flex flex-col items-center">
         <span class="text-sm font-semibold text-surface-800 dark:text-surface-100">
           {{ formattedWeekRange }}
         </span>
         <button pButton pRipple type="button" label="Aujourd'hui"
                 class="p-button-link p-button-sm !text-xs !py-0 !px-1"
                 (click)="goToCurrentWeek()"
                 aria-label="Aller à la semaine actuelle">
         </button>
      </div>


      <button pButton pRipple type="button" icon="pi pi-arrow-right"
              class="p-button-rounded p-button-text"
              (click)="nextWeek()"
              pTooltip="Semaine suivante" tooltipPosition="bottom"
              aria-label="Semaine suivante">
      </button>
    </div>
    <!-- === End Week Navigation Controls === -->


    <!-- Week Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-4 md:gap-6">
      <!-- Day Card Loop -->
      <div *ngFor="let day of weekDays" class="day-card-wrapper">
        <app-meal-card [customTemplate]="customTemplate" [noMealPlanned]="noMealPlanned"
          [title]="day.formattedDate" [borderHighlightClass]="day.borderClass" [meal]="day.meal"></app-meal-card>
          <ng-template #customTemplate>
                          <!-- Action Buttons -->
              <div class="flex justify-center gap-2 mt-auto">
                <button pButton pRipple type="button" icon="pi pi-pencil"
                        class="p-button-rounded p-button-text p-button-sm text-primary-500 dark:text-primary-400"
                        (click)="assignMeal(day.date, day.meal)" aria-label="Modifier le repas"
                        pTooltip="Modifier" tooltipPosition="top">
                </button>
                <button pButton pRipple type="button" icon="pi pi-trash"
                        class="p-button-rounded p-button-text p-button-sm p-button-danger"
                        (click)="confirmRemoveMeal($event, day.meal)" aria-label="Supprimer le repas"
                        pTooltip="Supprimer" tooltipPosition="top">
                </button>
              </div>
          </ng-template>
            <!-- If No Meal is Planned -->
            <ng-template #noMealPlanned>
              <div class="flex flex-col items-center">
                <i class="pi pi-calendar-times text-3xl text-surface-400 dark:text-surface-500 mb-2"></i>
                <p class="text-xs text-surface-500 dark:text-surface-400 italic mb-3">
                  Aucun repas prévu
                </p>
                <button pButton pRipple type="button" icon="pi pi-plus" label="Assigner"
                        class="p-button-sm p-button-outlined"
                        (click)="assignMeal(day.date, day.meal)"
                        aria-label="Assigner un repas">
                </button>
              </div>
            </ng-template>
      </div> <!-- End Day Card Loop -->
    </div> <!-- End Week Grid -->

  </div> <!-- End *ngIf=!isLoading -->

</div> <!-- End Outer Padding Div -->

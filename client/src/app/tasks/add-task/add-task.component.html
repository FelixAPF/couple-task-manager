

<div class="container flex flex-col gap-6 w-full sm:w-auto">
    <div>
        <form [formGroup]="formGroup" class="form-container" (submit)="save()">
          <div class="card grid gap-4">
            <p-inputgroup>
              <p-inputgroup-addon>
                <i class="pi pi-user"></i>
              </p-inputgroup-addon>
              <input pInputText formControlName="title" placeholder="Titre" />
            </p-inputgroup>

            <p-inputgroup>
              <p-inputgroup-addon>
                <i class="pi pi-user"></i>
              </p-inputgroup-addon>
              <input pInputText formControlName="description" placeholder="Description" />
            </p-inputgroup>
          </div>

            <label for="room" class="block font-semibold mb-2">Pièce</label>
            <div class="flex flex-wrap gap-4">
                <p-select [options]="rooms" id="room" appendTo="body" class="input-width block" optionValue="value" optionLabel="label" formControlName="room"></p-select>
            </div>

            <div>
                <!-- <div *ngFor="let frequence of frequencies; let i = index">
                    <div>
                        <p-radiobutton name="frequency" [value]="frequence.value" formControlName="frequency" [inputId]="'frequence-' + i" />
                        <label [for]="'frequence-' + i" class="ml-2">{{ frequence.label }}</label>
                    </div>
                </div>      -->
                <label for="frequency" class="block font-semibold mb-2">Fréquence</label>
                <div id="frequency">
                    <div>
                        <p-radiobutton name="frequency" [value]="FREQUENCY.DAILY" formControlName="frequency" [inputId]="FREQUENCY.DAILY" />
                        <label [for]="FREQUENCY.DAILY">Quotidien</label>
                    </div>
                    <div>
                        <p-radiobutton name="frequency" [value]="FREQUENCY.WEEKLY" formControlName="frequency" [inputId]="FREQUENCY.WEEKLY" />
                        <label [for]="FREQUENCY.WEEKLY">Hebdomadaire</label>
                    </div>
                    <div>
                        <p-radiobutton name="frequency" [value]="FREQUENCY.BIWEEKLY" formControlName="frequency" [inputId]="FREQUENCY.BIWEEKLY" />
                        <label [for]="FREQUENCY.BIWEEKLY">Bi-mensuel</label>
                    </div>
                    <div>
                        <p-radiobutton name="frequency" [value]="FREQUENCY.MONTHLY" formControlName="frequency" [inputId]="FREQUENCY.MONTHLY" />
                        <label [for]="FREQUENCY.MONTHLY">Mensuel</label>
                    </div>
                    <div>
                        <p-radiobutton name="frequency" [value]="FREQUENCY.QUARTERLY" formControlName="frequency" [inputId]="FREQUENCY.QUARTERLY" />
                        <label [for]="FREQUENCY.QUARTERLY">Trimestriel</label>
                    </div>
                    <div>
                        <p-radiobutton name="frequency" [value]="FREQUENCY.BIYEARLY" formControlName="frequency" [inputId]="FREQUENCY.BIYEARLY" />
                        <label [for]="FREQUENCY.BIYEARLY">Bi-annuel</label>
                    </div>
                    <div>
                        <p-radiobutton name="frequency" [value]="FREQUENCY.YEARLY" formControlName="frequency" [inputId]="FREQUENCY.YEARLY" />
                        <label [for]="FREQUENCY.YEARLY">Annuel</label>
                    </div>
                </div>
            </div>

            <div class="button-space">
                <p-button type="submit" class="submit-button">Sauvegarder</p-button>
                <p-button (onClick)="close()" class="submit-button" severity="secondary">Annuler</p-button>
            </div>
        </form>
    </div>
</div>

<form [formGroup]="formGroup" (ngSubmit)="quickComplete()"> <!-- Use quickComplete() for submit -->
  <div class="p-fluid flex flex-col gap-5 p-4"> <!-- p-fluid helps PrimeNG inputs fill width, added padding and gap -->

    <!-- Task Selection -->
    <div class="field flex flex-col gap-2">
      <label for="task" class="font-semibold">Tâche complétée</label>
      <!-- Added IconField -->
      <p-iconField iconPosition="left">
        <p-inputIcon class="pi pi-tag"></p-inputIcon> <!-- Changed icon -->
        <p-autocomplete
        inputId="task"
        formControlName="taskId"
        [suggestions]="filteredTasks"
        (completeMethod)="searchTask($event)"
        field="title"          
        [dropdown]="true"
        forceSelection="true"
        placeholder="Sélectionner une tâche..."
        styleClass="w-full"
        [style]="{'width':'100%'}"
        appendTo="body">
      </p-autocomplete>
      </p-iconField>
      <!-- Basic Validation Message Example -->
      <small *ngIf="formGroup.get('taskId')?.invalid && formGroup.get('taskId')?.touched" class="p-error block">
        La sélection d'une tâche est requise.
      </small>
    </div>

    <!-- Assignee Selection -->
    <div class="field flex flex-col gap-2">
      <label class="font-semibold">Complété par</label>
      <p-selectButton
        [options]="assigneeOptions"
        formControlName="assignee"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false">
        <!-- Custom template to show images -->
        <ng-template let-item pTemplate="item">
            <div class="flex items-center gap-2 px-2 py-1 justify-center w-full"> <!-- Centered content -->
                <img
                    [src]="item.src"
                    [alt]="item.label"
                    class="w-6 h-6 rounded-full object-cover border border-surface-300 dark:border-surface-600"
                    onError="this.src='assets/placeholder.jpg'"
                />
                <span>{{ item.label }}</span>
            </div>
        </ng-template>
      </p-selectButton>
      <!-- Basic Validation Message Example -->
      <small *ngIf="formGroup.get('assignee')?.invalid && formGroup.get('assignee')?.touched" class="p-error block">
        La sélection d'un assigné est requise.
      </small>
    </div>

  </div>

  <!-- Footer Actions -->
  <div class="flex justify-end gap-2 p-4 border-t border-surface-200 dark:border-surface-700 mt-2">
    <p-button
      type="button"
      label="Annuler"
      severity="secondary"
      (click)="onCancel()">
    </p-button>
    <p-button
      type="submit"
      label="Compléter"
      icon="pi pi-check"
      [disabled]="formGroup.invalid">
    </p-button>
  </div>
</form>

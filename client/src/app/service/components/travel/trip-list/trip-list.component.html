@if (selectedTrip) {
  <p-button label="Back to All Trips" icon="pi pi-arrow-left" (click)="selectedTrip = null" [styleClass]="'p-button-secondary mb-3'"></p-button>
  <app-trip-details [trip]="selectedTrip"></app-trip-details>
} @else {
  <div class="flex justify-content-between align-items-center mb-3">
    <h3>My Trips</h3>
    <p-button label="New Trip" icon="pi pi-plus" (click)="showCreateTripDialog()"></p-button>
  </div>

  <div class="list-group">
      @for (trip of trips; track trip.id) {
        <a (click)="selectTrip(trip)" class="list-group-item list-group-item-action cursor-pointer">
          <div class="d-flex w-100 justify-content-between">
            <h5 class="mb-1">{{ trip.destination }}</h5>
            <span class="badge bg-primary rounded-pill">{{ daysUntil(trip.departureDate) }} days to go</span>
          </div>
          <p class="mb-1">Departing on: {{ trip.departureDate | date: 'fullDate' }}</p>
        </a>
      } @empty {
        <div class="alert alert-info" role="alert">
          You have no upcoming trips. Create one to get started!
        </div>
      }
  </div>
}

<p-dialog header="Create a New Trip" [(visible)]="displayCreateTripModal" [modal]="true" [style]="{ width: '30rem' }" [draggable]="false">
  <form #tripForm="ngForm" (ngSubmit)="createTrip(tripForm.value)">
    <div class="p-fluid">
      <div class="field mb-3">
        <label for="destination" class="form-label">Destination / Title</label>
        <input pInputText id="destination" name="destination" ngModel required />
      </div>
      <div class="field">
        <label for="departureDate" class="form-label">Departure Date</label>
        <p-calendar id="departureDate" name="departureDate" ngModel required dateFormat="yy-mm-dd"></p-calendar>
      </div>
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <p-button label="Cancel" severity="secondary" (click)="displayCreateTripModal = false"></p-button>
      <p-button label="Create Trip" type="submit" [disabled]="tripForm.invalid"></p-button>
    </div>
  </form>
</p-dialog>

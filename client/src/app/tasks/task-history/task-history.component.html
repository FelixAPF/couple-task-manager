<div *ngIf="loading" class="flex flex-col items-center justify-center p-8 gap-4">
    <i class="pi pi-spin pi-spinner text-4xl text-primary-500"></i>
    <span class="text-surface-500 font-medium">Chargement...</span>
</div>

<div *ngIf="!loading && historyLogs.length === 0" class="flex flex-col items-center justify-center p-8 bg-surface-50 dark:bg-surface-800/50 rounded-3xl border border-dashed border-surface-200 dark:border-surface-700">
    <div class="bg-white dark:bg-surface-700 p-4 rounded-full mb-3 shadow-sm border border-surface-100 dark:border-surface-600">
        <i class="pi pi-clock text-2xl text-surface-400"></i>
    </div>
    <p class="text-surface-600 dark:text-surface-300 font-medium m-0">Aucun historique pour cette tâche.</p>
</div>

<div *ngIf="!loading && historyLogs.length > 0" class="flex flex-col gap-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
    <div *ngFor="let log of historyLogs" class="flex items-center gap-4 p-4 bg-white dark:bg-surface-800 border border-surface-100 dark:border-surface-700 rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] hover:bg-surface-50 dark:hover:bg-surface-700/50 transition-colors">
        
        <img [src]="log.completedBy?.imageUrl || 'assets/placeholder.jpg'" 
             class="w-12 h-12 rounded-full object-cover shadow-sm ring-2 ring-surface-100 dark:ring-surface-700" 
             [pTooltip]="log.completedBy?.name" tooltipPosition="top">
        
        <div class="flex-grow">
            <p class="font-bold text-surface-900 dark:text-white m-0 leading-tight">{{ log.completedBy?.name }}</p>
            <p class="text-surface-500 dark:text-surface-400 text-sm m-0 mt-0.5">a complété cette tâche</p>
            
            <div class="flex items-center gap-1.5 mt-2">
                <span class="inline-flex items-center gap-1 px-2 py-1 bg-surface-100 dark:bg-surface-700 rounded-md text-xs font-semibold text-surface-600 dark:text-surface-300">
                    <i class="pi pi-calendar-check text-[10px]"></i>
                    {{ log.completedDate | date:'medium' }}
                </span>
            </div>
        </div>
        
    </div>
</div>

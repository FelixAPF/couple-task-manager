<div class="min-h-screen bg-slate-100 py-10 px-4 flex items-center justify-center">

  <div *ngIf="letter" class="max-w-3xl w-full animate-pop">
    
    <button routerLink="/letters" class="mb-6 flex items-center text-slate-500 hover:text-slate-900 transition-colors font-medium text-sm">
      <span class="material-icons mr-1 text-base">arrow_back_ios</span> Retour à la boîte à malle
    </button>

    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden relative">
      
      <div class="bg-slate-900 px-8 py-8 text-white relative overflow-hidden">
        <div class="absolute top-0 right-0 -mr-10 -mt-10 w-40 h-40 bg-white opacity-5 rounded-full"></div>
        <div class="absolute bottom-0 left-0 -ml-10 -mb-10 w-32 h-32 bg-pink-500 opacity-20 rounded-full blur-2xl"></div>

        <div class="relative z-10 flex justify-between items-start">
          <div class="flex items-center gap-4">
            <img [src]="letter.sender.imageUrl || 'assets/placeholder.jpg'" class="w-14 h-14 rounded-full border-4 border-slate-800 shadow-md object-cover">
            <div>
              <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Message entrant</p>
              <h1 class="text-2xl font-bold text-white">{{ letter.title }}</h1>
            </div>
          </div>
          <div class="text-right">
             <span class="bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium text-pink-200 border border-white/10">
               {{ letter.letterType }}
             </span>
             <p class="text-slate-400 text-xs mt-2">{{ letter.createdDate | date:'mediumDate' }}</p>
          </div>
        </div>
      </div>

      <div class="bg-[#fafafa] relative px-8 py-10 sm:px-12 sm:py-14">
        <div class="prose prose-lg prose-slate max-w-none font-serif text-slate-700 leading-loose whitespace-pre-wrap">
          {{ letter.description }}
        </div>

        <div class="mt-12 flex justify-end">
          <div class="text-center">
             <p class="font-handwriting text-2xl text-slate-800 transform -rotate-6">Avec amour,</p>
             <p class="font-bold text-slate-900 mt-1">{{ letter.sender.name }}</p>
          </div>
        </div>
      </div>

      <div *ngIf="letter.hasOptions" class="bg-white border-t border-slate-100 px-8 py-8">
        
        <h3 class="text-lg font-bold text-slate-800 mb-6 text-center">
          {{ letter.optionsTitle }}
        </h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          
          <div *ngFor="let option of letter.options" 
               (click)="!letter.selectedOption ? selectedChoice = option : null"
               class="relative p-4 rounded-xl border-2 transition-all duration-200 flex items-center justify-start text-left h-full min-h-[60px]"
               [ngClass]="{
                 'cursor-pointer hover:border-pink-200 hover:bg-white': !letter.selectedOption && selectedChoice !== option,
                 'border-pink-500 bg-pink-50 text-pink-700 shadow-md scale-[1.02]': selectedChoice === option || letter.selectedOption === option,
                 'border-slate-100 bg-slate-50 text-slate-400 opacity-60': letter.selectedOption && letter.selectedOption !== option,
                 'border-slate-100 bg-slate-50 text-slate-600': !letter.selectedOption && selectedChoice !== option
               }">
             
             <div class="w-5 h-5 rounded-full border-2 mr-3 flex items-center justify-center flex-shrink-0"
                  [ngClass]="(selectedChoice === option || letter.selectedOption === option) ? 'border-pink-500' : 'border-slate-300'">
                <div class="w-2.5 h-2.5 rounded-full bg-pink-500 transition-transform duration-200"
                     [ngClass]="(selectedChoice === option || letter.selectedOption === option) ? 'scale-100' : 'scale-0'"></div>
             </div>

             <span class="font-medium" 
                   [ngClass]="{'text-slate-800': !letter.selectedOption && selectedChoice !== option}">
               {{ option }}
             </span>

             <div *ngIf="letter.selectedOption === option" class="absolute -top-2 -right-2 bg-green-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">
               RÉPONDRE
             </div>
          </div>

        </div>

        <div *ngIf="!letter.selectedOption" class="mt-8">
          <button (click)="submitReply()" 
                  [disabled]="!selectedChoice || isSubmitting"
                  class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="!isSubmitting">Envoyer réponse</span>
            <span *ngIf="isSubmitting" class="flex items-center justify-center gap-2">
              <span class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span> Envoi...
            </span>
          </button>
        </div>

        <div *ngIf="letter.selectedOption" class="mt-6 text-center animate-fade-in-up">
           <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">
             Réponse {{ letter.repliedDate | date:'medium' }}
           </p>
        </div>

      </div>
    </div>

  </div>
</div>

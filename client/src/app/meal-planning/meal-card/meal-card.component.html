<div class="h-full w-full relative block" *ngIf="isBirthday else regularTemplate">
  <app-balloon-container 
      class="h-full w-full block"
      [numberOfBalloons]="30" 
      [minDuration]="10" 
      [maxDuration]="20">
      <ng-container *ngTemplateOutlet="template"></ng-container>
  </app-balloon-container>
</div>

<ng-template #regularTemplate>
   <ng-container *ngTemplateOutlet="template"></ng-container>
</ng-template>

<ng-template #template>
  <p-card [styleClass]="'day-card h-full flex flex-col bg-white dark:bg-surface-800 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all duration-300 ease-in-out hover:-translate-y-1 rounded-3xl overflow-hidden cursor-default'"
      [ngClass]="borderHighlightClass">

      <ng-template pTemplate="header">
        <div class="relative p-4 bg-gradient-to-b from-surface-50 to-white dark:from-surface-800/80 dark:to-surface-800 border-b border-surface-100 dark:border-surface-700/50 flex items-center justify-center">
          
          <h3 class="text-xs uppercase tracking-widest font-black text-surface-400 dark:text-surface-500 m-0">
            {{ title }}
          </h3>

          <div *ngIf="meal" class="absolute right-3 flex items-center">
            <button pButton pRipple type="button" icon="pi pi-trash"
                  class="p-button-rounded p-button-text p-button-sm w-8 h-8 !p-0 text-surface-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors"
                  (click)="onRemoveClick($event)" aria-label="Supprimer le repas"
                  [pTooltip]="'meals.delete' | translate" tooltipPosition="left">
            </button>
          </div>

        </div>
      </ng-template>

      <ng-template pTemplate="content">
        <div class="p-4 flex-grow flex flex-col justify-center items-center text-center min-h-[140px]">
          
          <div *ngIf="meal" class="w-full flex flex-col items-center">
            
            <div (click)="openRecipeView()" class="relative inline-block mb-4 cursor-pointer group rounded-2xl"> 
              
              <div class="overflow-hidden rounded-2xl shadow-sm border border-surface-100 dark:border-surface-700/50">
                <img *ngIf="meal.recipe.imageUrl"
                     [src]="meal.recipe.imageUrl"
                     [alt]="recipeName"
                     class="w-28 h-28 object-cover transition-transform duration-500 group-hover:scale-110"> 
                <div *ngIf="!meal.recipe.imageUrl" 
                     class="w-28 h-28 flex items-center justify-center bg-gradient-to-br from-surface-100 to-surface-200 dark:from-surface-700 dark:to-surface-600 text-surface-400 dark:text-surface-500 transition-transform duration-500 group-hover:scale-110">
                  <i class="pi pi-image text-4xl opacity-40"></i>
                </div>
              </div>

              <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-2xl pointer-events-none"></div>

               <div *ngIf="meal.isThawingNeeded" 
                   class="absolute -top-3 -left-3 z-20 flex items-center justify-center w-8 h-8 bg-blue-50 dark:bg-blue-900/80 text-blue-500 dark:text-blue-300 rounded-full shadow-md border-2 border-white dark:border-surface-800 transition-transform duration-300 hover:scale-110"
                   pTooltip="Décongélation requise" 
                   tooltipPosition="top">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[14px] h-[14px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <line x1="12" y1="2" x2="12" y2="22"></line>
                  <line x1="20" y1="16" x2="16" y2="12"></line>
                  <line x1="20" y1="8" x2="16" y2="12"></line>
                  <line x1="4" y1="8" x2="8" y2="12"></line>
                  <line x1="4" y1="16" x2="8" y2="12"></line>
                  <line x1="16" y1="4" x2="12" y2="8"></line>
                  <line x1="8" y1="4" x2="12" y2="8"></line>
                  <line x1="16" y1="20" x2="12" y2="16"></line>
                  <line x1="8" y1="20" x2="12" y2="16"></line>
                </svg>
              </div>

              <div *ngIf="meal?.assignedUser as assignee" class="absolute -bottom-2 -right-2 z-20">
                 <img
                  [src]="assignee.imageUrl || 'assets/placeholder.jpg'"
                  [alt]="'Photo de ' + (assignee.name || 'Membre')"
                  class="w-10 h-10 rounded-full object-cover border-[3px] border-white dark:border-surface-800 shadow-md"
                  onError="this.src='assets/placeholder.jpg'"
                  [pTooltip]="assignee.name" 
                  tooltipPosition="bottom"
                />
              </div>

            </div>

            <p class="text-base font-bold text-surface-800 dark:text-surface-100 mb-2 w-full line-clamp-2 leading-tight min-h-[2.5rem] flex items-center justify-center"
              [pTooltip]="recipeName" tooltipPosition="top">
              {{ recipeName }}
            </p>
            
            <div *ngIf="meal.location" class="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-50 dark:bg-surface-700/50 rounded-full text-xs font-semibold text-surface-500 dark:text-surface-300 border border-surface-100 dark:border-surface-700">
              <i class="pi pi-map-marker text-[10px]"></i>
              <span>{{ meal.location }}</span>
            </div>

            <ng-container [ngTemplateOutlet]="customTemplate"></ng-container>

          </div>
          <ng-container *ngIf="!meal && noMealPlanned" [ngTemplateOutlet]="noMealPlanned"></ng-container>
          
        </div>
      </ng-template>
    </p-card>
</ng-template>

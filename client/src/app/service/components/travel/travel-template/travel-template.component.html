<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="flex flex-col gap-6">
  <!-- Carte d'ajout rapide au modèle -->
  <div class="bg-white dark:bg-surface-800 rounded-3xl p-5 sm:p-6 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-surface-100 dark:border-surface-700">
    <div class="mb-4">
      <h3 class="text-xl font-bold text-surface-900 dark:text-white m-0">Gérer votre liste de base</h3>
      <p class="text-xs text-surface-500 dark:text-surface-400 mt-1 m-0">
        Ces articles sont automatiquement importés dans chaque nouveau voyage que vous créez.
      </p>
    </div>

    <form [formGroup]="newItemForm" (ngSubmit)="addItem()" class="flex flex-col sm:flex-row items-center gap-3">
      <input pInputText
             formControlName="name"
             placeholder="Nom de l'article (ex: Passeport, Chargeur, Trousse...)"
             class="w-full sm:flex-grow !rounded-2xl !py-3 !px-4 border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-900 text-sm font-medium" />
      
      <p-dropdown [options]="categories"
                  formControlName="category"
                  optionLabel="label"
                  optionValue="value"
                  styleClass="w-full sm:w-56 !rounded-2xl !border-surface-200 dark:!border-surface-700"
                  appendTo="body">
      </p-dropdown>

      <button pButton pRipple
              type="submit"
              icon="pi pi-plus"
              label="Ajouter au modèle"
              [disabled]="newItemForm.invalid"
              class="p-button-primary p-button-rounded font-bold w-full sm:w-auto shrink-0 shadow-md shadow-primary-500/20 whitespace-nowrap">
      </button>
    </form>
  </div>

  <!-- Filtres par catégorie -->
  <div class="flex gap-1.5 overflow-x-auto pb-1">
    <button type="button"
            (click)="selectedCategory = 'ALL'"
            class="px-4 py-2 rounded-2xl text-xs font-bold transition-all cursor-pointer"
            [ngClass]="selectedCategory === 'ALL'
              ? 'bg-surface-900 text-white dark:bg-white dark:text-surface-900 shadow-sm'
              : 'bg-white dark:bg-surface-800 text-surface-600 dark:text-surface-300 border border-surface-200 dark:border-surface-700'">
      Tous ({{ templateItems.length }})
    </button>
    <button *ngFor="let cat of categories"
            type="button"
            (click)="selectedCategory = cat.value"
            class="px-4 py-2 rounded-2xl text-xs font-bold transition-all whitespace-nowrap cursor-pointer"
            [ngClass]="selectedCategory === cat.value
              ? 'bg-surface-900 text-white dark:bg-white dark:text-surface-900 shadow-sm'
              : 'bg-white dark:bg-surface-800 text-surface-600 dark:text-surface-300 border border-surface-200 dark:border-surface-700'">
      {{ cat.label }}
    </button>
  </div>

  <!-- Liste des articles du modèle -->
  <div class="bg-white dark:bg-surface-800 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-surface-100 dark:border-surface-700 p-5 divide-y divide-surface-100 dark:divide-surface-800">
    <div *ngFor="let item of filteredItems"
         class="py-3 flex items-center justify-between gap-4 group">
      <div class="flex items-center gap-3 min-w-0">
        <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
        <span class="font-bold text-sm sm:text-base text-surface-900 dark:text-surface-100 truncate">
          {{ item.name }}
        </span>
        <span class="text-xs px-2.5 py-0.5 rounded-full bg-surface-100 dark:bg-surface-700 text-surface-600 dark:text-surface-400 font-medium">
          {{ getCategoryLabel(item.category) }}
        </span>
      </div>

      <button pButton pRipple
              icon="pi pi-trash"
              class="p-button-rounded p-button-text p-button-danger !w-8 !h-8 text-surface-400 hover:text-red-500"
              (click)="confirmDeleteItem($event, item.id!, item.name)"
              pTooltip="Supprimer du modèle"
              tooltipPosition="left">
      </button>
    </div>

    <div *ngIf="filteredItems.length === 0 && !isLoading" class="py-12 text-center text-surface-400 text-xs italic">
      Aucun article dans cette catégorie pour l'instant.
    </div>
  </div>
</div>

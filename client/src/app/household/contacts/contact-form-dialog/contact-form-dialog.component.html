<form [formGroup]="contactForm" (ngSubmit)="saveContact()" class="p-4">
  <div class="flex flex-col gap-4 p-fluid">
    <div class="flex flex-col gap-2">
      <label for="name">Name</label>
      <input pInputText id="name" formControlName="name" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="email">Email</label>
      <input pInputText id="email" formControlName="email" type="email" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="phoneNumber">Phone Number</label>
      <p-inputMask id="phoneNumber" mask="(999) 999-9999" formControlName="phoneNumber" placeholder="(514) 123-4567"></p-inputMask>
    </div>

    <div class="flex flex-col gap-2">
      <label for="contactType">Contact Type</label>
      <input pInputText id="contactType" formControlName="contactType" />
      <small *ngIf="contactForm.get('contactType')?.invalid && contactForm.get('contactType')?.touched" class="p-error">Contact type is required.</small>
    </div>
  </div>

  <div class="flex justify-end gap-2 pt-6">
    <button pButton pRipple type="button" label="Cancel" icon="pi pi-times" class="p-button-text" (click)="closeDialog()"></button>
    <button pButton pRipple type="submit" label="Save" icon="pi pi-check" [disabled]="contactForm.invalid"></button>
  </div>
</form>

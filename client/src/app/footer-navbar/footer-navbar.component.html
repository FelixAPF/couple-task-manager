<div *ngIf="isLoggedIn$ | async" class="fixed bottom-0 left-0 right-0 z-50 h-16
  bg-surface-0 dark:bg-surface-900
  border-t border-surface-200 dark:border-surface-700
  shadow-[0_-2px_5px_rgba(0,0,0,0.1)] dark:shadow-[0_-2px_5px_rgba(0,0,0,0.3)] lg:hidden">

<!-- Flex container for navigation items -->
<div class="fixed bottom-0 left-0 right-0 z-50 h-16
            bg-surface-0 dark:bg-surface-900
            border-t border-surface-200 dark:border-surface-700
            shadow-[0_-2px_5px_rgba(0,0,0,0.1)] dark:shadow-[0_-2px_5px_rgba(0,0,0,0.3)]">

  <!-- Flex container for navigation items -->
  <div class="flex justify-around items-center h-full px-1 sm:px-2"> <!-- Reduced padding slightly -->

    <!-- Dashboard Link -->
    <a routerLink="/dashboard"
       routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
       class="nav-item flex flex-col items-center justify-center p-2 rounded-md
              text-surface-600 dark:text-surface-300
              hover:text-primary-500 dark:hover:text-primary-400
              transition-colors duration-150 w-1/5"> <!-- Changed to w-1/5 -->
      <i class="pi pi-home text-xl mb-1"></i>
      <span class="text-xs font-medium">Dashboard</span>
    </a>

    <a routerLink="/tasks"
       routerLinkActive="active-link"
       class="nav-item flex flex-col items-center justify-center p-2 rounded-md
              text-surface-600 dark:text-surface-300
              hover:text-primary-500 dark:hover:text-primary-400
              transition-colors duration-150 w-1/5">
      <i class="pi pi-list text-xl mb-1"></i>
      <span class="text-xs font-medium">Tâches</span>
    </a>
    <!-- Recipes Link -->
    <a routerLink="/meals"
       routerLinkActive="active-link"
       class="nav-item flex flex-col items-center justify-center p-2 rounded-md
              text-surface-600 dark:text-surface-300
              hover:text-primary-500 dark:hover:text-primary-400
              transition-colors duration-150 w-1/5"> <!-- Changed to w-1/5 -->
      <i class="fa-regular fa-lemon text-xl mb-1"></i>
      <span class="text-xs font-medium">Repas</span>
    </a>
    <a routerLink="/household/contacts"
       routerLinkActive="active-link"
       class="nav-item flex flex-col items-center justify-center p-2 rounded-md
              text-surface-600 dark:text-surface-300
              hover:text-primary-500 dark:hover:text-primary-400
              transition-colors duration-150 w-1/5">
      <i class="pi pi-address-book text-xl mb-1"></i>
      <span class="text-xs font-medium">Contacts</span>
    </a>

    <!-- Shopping List Link -->
    <a routerLink="/shopping-list"
       routerLinkActive="active-link"
       class="nav-item flex flex-col items-center justify-center p-2 rounded-md
              text-surface-600 dark:text-surface-300
              hover:text-primary-500 dark:hover:text-primary-400
              transition-colors duration-150 w-1/5"> <!-- Changed to w-1/5 -->
      <i class="pi pi-shopping-cart text-xl mb-1"></i>
      <span class="text-xs font-medium">Courses</span>
    </a>

    <!-- Shopping List Link -->
    <a routerLink="/food-tracking"
      *ngIf="household && household.enableFoodIntakeTracking"
       routerLinkActive="active-link"
       class="nav-item flex flex-col items-center justify-center p-2 rounded-md
              text-surface-600 dark:text-surface-300
              hover:text-primary-500 dark:hover:text-primary-400
              transition-colors duration-150 w-1/5"> <!-- Changed to w-1/5 -->
      <i class="fa fa-cutlery text-xl mb-1"></i>
      <span class="text-xs font-medium">{{'footer-navbar.food-intake-tracking'|translate}}</span>
    </a>

  </div>
</div>

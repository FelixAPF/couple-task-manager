@if (trip) {
  <h2>{{ trip.destination }}</h2>
  <p>{{ daysUntil(trip.departureDate) }} days to go!</p>

  <p-accordion [multiple]="true" [activeIndex]="[0,1,2,3,4]">
    @for (category of categories; track category) {
      <p-accordionTab [header]="category">
        <p-table [value]="getItemsByCategory(category)" styleClass="p-datatable-sm">
          <ng-template pTemplate="body" let-item>
            <tr>
              <td style="width: 3rem;">
                <p-checkbox [(ngModel)]="item.packed" [binary]="true" (onChange)="onItemUpdate(item)"></p-checkbox>
              </td>
              <td>{{ item.name }}</td>
              <td style="width: 8rem;">
                <p-inputNumber [(ngModel)]="item.quantity" [showButtons]="true" [min]="0" [max]="100" (onInput)="onItemUpdate(item)"></p-inputNumber>
              </td>
              <td style="width: 4rem;">
                <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="removeItem(item)"></p-button>
              </td>
            </tr>
          </ng-template>
        </p-table>
        <div class="p-fluid p-formgrid grid mt-3">
          <div class="field col">
            <input pInputText [(ngModel)]="newItemName[category]" placeholder="Add new item..." (keyup.enter)="addNewItem(category)" />
          </div>
          <div class="field col-fixed" style="width: 80px;">
            <p-button icon="pi pi-plus" (onClick)="addNewItem(category)"></p-button>
          </div>
        </div>
      </p-accordionTab>
    }
  </p-accordion>
}

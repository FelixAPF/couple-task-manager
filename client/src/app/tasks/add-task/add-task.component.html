

<div class="container">

    <p-card>
        <div>
            <H3>{{idFormControl?.value === null ? 'Ajouter' : 'Modifier'}} une tâche</H3>
        </div>
        <div>
            <form [formGroup]="formGroup" class="form-container" (submit)="save()">
                <div>
                <mat-form-field class="d-block input-width">
                    <mat-label>Tâche</mat-label>
                    <input matInput formControlName="title">
                </mat-form-field>
                
                <mat-form-field class="d-block input-width">
                    <mat-label>Descrption</mat-label>
                    <input matInput formControlName="description">
                </mat-form-field>
                </div>

                <div>
                    <div *ngFor="let frequence of frequencies">
                        <p-radiobutton name="frequency" [value]="frequence.value" size="large" formControlName="frequency" [inputId]="frequence.value" />
                        <label [for]="frequence.value" class="ml-2">{{ frequence.label }}</label>
                    </div>
                </div>                
                
                <div class="flex flex-wrap gap-4">
                    <p-select [options]="rooms" class="input-width" optionValue="value" optionLabel="label" formControlName="room"></p-select>
                </div>
            
                <div class="button-space">
                    <p-button type="submit" class="submit-button">Sauvegarder</p-button>
                    <p-button routerLink=".." class="submit-button" severity="secondary">Annuler</p-button>
                </div>
            </form>
        </div>
    </p-card>
</div>

name: Build Docker Images & Deploy Android

on:
  push:
    branches: [ main ] # Trigger workflow on pushes to the main branch
  workflow_dispatch:

permissions:
  contents: write # Needed so the action can push the updated version files back to GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    # --- Initial Setup ---
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # --- NEW: Version Parsing & Auto-Update ---
    - name: Parse Commit Message and Update Version
      id: version_bump
      run: |
        COMMIT_MSG="${{ github.event.head_commit.message }}"
        echo "Commit message: $COMMIT_MSG"
        
        # Regex to capture V2.39 or V2.39.1 etc. at the beginning of the commit message
        if [[ "$COMMIT_MSG" =~ ^V([0-9]+(\.[0-9]+)+) ]]; then
          NEW_VERSION="${BASH_REMATCH[1]}"
          echo "Detected version $NEW_VERSION from commit message!"
          
          # Update build.gradle
          sed -i -E 's/(versionName\s+")[^"]+("\s*)/\1'"$NEW_VERSION"'\2/' client/android/app/build.gradle
          
          # Update version.json using jq
          jq '.version = "'"$NEW_VERSION"'"' client/version.json > tmp.json && mv tmp.json client/version.json
          
          # Commit and push changes back to the repository
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add client/android/app/build.gradle client/version.json
          
          # Commit with [skip ci] so this push doesn't trigger the workflow again
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push
          
          # Export to environment for later steps
          echo "APP_VERSION=$NEW_VERSION" >> $GITHUB_ENV
        else
          echo "No version tag found in commit message. Using existing file versions."
          # Extract existing version from build.gradle as fallback
          FALLBACK_VERSION=$(grep -E '^\s*versionName\s+"[^"]+"' client/android/app/build.gradle | sed -n 's/.*versionName "\(.*\)".*/\1/p' | head -n 1)
          echo "APP_VERSION=$FALLBACK_VERSION" >> $GITHUB_ENV
        fi

    - name: Create Google Services JSON File
      run: |
        echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > client/android/app/google-services.json

    - name: Create Server Firebase Key
      run: |
        echo "${{ secrets.SERVER_FIREBASE_JSON_BASE64 }}" | base64 -d > server/src/main/resources/firebase-service-account.json

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # --- Client Build ---
    - name: Install Client Project Dependencies
      run: npm install
      working-directory: ./client

    - name: Build Angular Web App
      run: npx ng build --configuration=production
      working-directory: ./client
      
    # --- Docker Setup & Build/Push ---
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }} # Use the Access Token secret

    - name: Build Java Backend with Maven
      run: mvn package -DskipTests # Build the JAR, skip tests for speed
      working-directory: ./server # Run Maven inside the 'server' directory

    - name: Build and push Backend image
      uses: docker/build-push-action@v6
      with:
        context: ./server # Assumes Dockerfile is in the 'server' directory
        push: true
        tags: felixapelletierr/couple-task-manager:latest # Your backend image tag

    - name: Build and push Frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./client # Assumes Dockerfile is in the 'client' directory
        push: true
        tags: felixapelletierr/couple-task-manager-front-end:latest # Your frontend image tag

    # --- Start Android Build Steps ---
    - name: Sync Capacitor Android Assets
      run: npx cap sync android
      working-directory: ./client

    - name: Decode Keystore
      run: |
        mkdir -p client/android/app
        echo "${{ secrets.ANDROID_SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > client/android/app/release.jks

    - name: Set execute permissions for gradlew
      run: chmod +x gradlew
      working-directory: ./client/android

    - name: Build Android Release App Bundle
      # Pass the GitHub run number as the versionCode property
      run: ./gradlew bundleRelease -PversionCode=$((${{ github.run_number }} + 168))
      working-directory: ./client/android
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}

    # --- Upload to Google Play ---
    - name: Upload Android App Bundle to Internal Testing
      uses: r0adkll/upload-google-play@v2
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.couple.taskmanager
        releaseFiles: client/android/app/build/outputs/bundle/release/*.aab
        tracks: internal
        status: completed

# --- Notify Version Endpoint ---
    - name: Post Version to Endpoint
      run: |
        echo "Attempting to post version ${{ env.APP_VERSION }} to endpoint..."
        
        # Retry up to 12 times, waiting 10 seconds between each attempt (2 minutes total)
        for i in {1..12}; do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://server.coupletaskmanager.com/version/${{ env.APP_VERSION }})
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Version updated successfully!"
            exit 0
          fi
          
          echo "Server not ready (Status: $HTTP_STATUS). Retrying in 10 seconds... ($i/12)"
          sleep 10
        done
        
        echo "Failed to update version. The server might be crashing on startup."
        exit 1
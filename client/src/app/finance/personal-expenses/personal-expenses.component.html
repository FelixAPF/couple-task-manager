<div class="container p-4 md:p-6 mx-auto pb-20 lg:pb-6">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
    <div class="flex items-center gap-3">
        <p-button icon="pi pi-arrow-left" [text]="true" [rounded]="true" routerLink="/finance"></p-button>
        <h2 class="text-2xl font-semibold text-surface-800 dark:text-surface-100 m-0">Dépenses Personnelles</h2>
    </div>
    <button pButton icon="pi pi-plus" label="Ajouter" class="p-button-primary w-full sm:w-auto" (click)="addExpense()"></button>
  </div>
  
  <div class="flex flex-col gap-4">
    <div *ngFor="let exp of expenses" class="bg-surface-0 dark:bg-surface-800 p-4 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 flex flex-col md:flex-row gap-4 items-start md:items-center">
      
      <div class="flex-1 w-full">
        <label class="block text-sm font-medium text-surface-600 dark:text-surface-300 mb-1">Nom de la dépense</label>
        <input pInputText [(ngModel)]="exp.name" (blur)="saveExpense(exp)" class="w-full" />
      </div>

      <div class="w-full md:w-40">
        <label class="block text-sm font-medium text-surface-600 dark:text-surface-300 mb-1">Montant ($)</label>
        <p-inputNumber [(ngModel)]="exp.amount" (onBlur)="saveExpense(exp)" mode="currency" currency="CAD" locale="fr-CA" class="w-full" styleClass="w-full"></p-inputNumber>
      </div>

      <div class="w-full md:w-48">
        <label class="block text-sm font-medium text-surface-600 dark:text-surface-300 mb-1">Fréquence</label>
        <p-dropdown [options]="frequencies" [(ngModel)]="exp.frequency" (onChange)="saveExpense(exp)" optionLabel="label" optionValue="value" styleClass="w-full" appendTo="body"></p-dropdown>
      </div>

      <div class="w-full md:w-56">
        <label class="block text-sm font-medium text-surface-600 dark:text-surface-300 mb-1">Banque cible</label>
        <p-dropdown [options]="bankOptions" [(ngModel)]="exp.targetBankAccountId" (onChange)="onBankChange(exp)" optionLabel="label" optionValue="value" styleClass="w-full" appendTo="body" placeholder="Sélectionner"></p-dropdown>
      </div>

      <div class="w-full md:w-56" *ngIf="exp.targetBankAccountId !== 'JOINT_ACCOUNT'">
        <label class="block text-sm font-medium text-surface-600 dark:text-surface-300 mb-1">Sous-compte cible</label>
        <p-dropdown [options]="getSubAccountOptions(exp.targetBankAccountId)" [(ngModel)]="exp.targetSubAccountId" (onChange)="saveExpense(exp)" optionLabel="label" optionValue="value" styleClass="w-full" appendTo="body" placeholder="Sélectionner"></p-dropdown>
      </div>

      <div class="flex justify-end w-full md:w-auto mt-2 md:mt-0 md:pt-6">
        <button pButton icon="pi pi-trash" class="p-button-danger p-button-text p-button-rounded" (click)="removeExpense(exp.id)" pTooltip="Supprimer"></button>
      </div>
    </div>
    
    <div *ngIf="expenses.length === 0" class="text-center p-8 bg-surface-50 dark:bg-surface-800 rounded-lg border border-surface-200 dark:border-surface-700 text-surface-500">
      <i class="pi pi-user text-4xl mb-3 text-surface-400"></i>
      <p class="m-0">Aucune dépense personnelle configurée.</p>
    </div>
  </div>
</div>

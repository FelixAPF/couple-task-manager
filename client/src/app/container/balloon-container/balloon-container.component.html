<div class="balloon-wrapper">
  <div class="content-projection">
    <ng-content></ng-content>
  </div>
  
  <div *ngFor="let balloon of balloons"
       class="balloon-float"
       [style]="balloon.style">
       
    <div class="balloon-sway">
      <div class="balloon-body"></div>
      <div class="balloon-string"></div>
    </div>
    
  </div>
</div>

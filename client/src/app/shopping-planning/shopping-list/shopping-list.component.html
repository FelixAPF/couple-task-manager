<div class="flex flex-col min-h-screen">
    <div class="container p-4 flex-grow">
      <p-card>
        <div class="flex justify-between items-center mb-4">
          <p class="text-2xl font-semibold">Liste d'achat</p>
          <p-button (onClick)="openNewTaskDialog()" class="create-button">Ajouter</p-button>
        </div>
  
        <div>
          <p-table
            [value]="shoppingItems"
            [paginator]="true"
            [rows]="10"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="Affichage des éléments {first} à {last} de {totalRecords}"
            [rowsPerPageOptions]="[25, 50, 100]" #test
          >
            <ng-template #header>
              <tr>
                <th style="width: 40%">Article</th>
                <th style="width: 30%">Magasin</th>
                <th style="width: 30%">Acheter</th>
              </tr>
            </ng-template>
            <ng-template #body let-element>
              <tr>
                <td>{{ element.name }}</td>
                <td>{{ 'STORE.' + element.store |translate }}</td>
                <td>
                  <div class="flex justify-center flex-wrap gap-4">
                    <p-toast></p-toast>
                    <div></div>
                    <p-splitbutton
                      appendTo="test"
                      label="Marquer comme acheté"
                      (onClick)="delete($event, element.id)"
                      [model]="items(element)"
                    ></p-splitbutton>
                  </div>
                </td>
              </tr>
            </ng-template>
          </p-table>
          <div class="pb-12"></div>
        </div>
        <p-toast></p-toast>
        <p-confirmdialog></p-confirmdialog>
      </p-card>
    </div>
  </div>

<div class="container p-4 mx-auto">
    <h2 class="text-2xl font-semibold mb-6 text-center">Historique des tâches complétées</h2>
  
    <!-- Add a message if there are no assignments -->
    <div *ngIf="!taskAssignments || taskAssignments.length === 0" class="text-center text-surface-500 dark:text-surface-400 mt-8 p-4 border rounded-lg bg-surface-100 dark:bg-surface-800">
      <i class="pi pi-info-circle mr-2"></i>
      Aucun historique de tâche trouvé pour cette tâche.
    </div>
  
    <!-- List of completed tasks -->
    <div class="flex flex-col gap-4" *ngIf="taskAssignments && taskAssignments.length > 0">
      <div *ngFor="let taskAssignment of taskAssignments">
        <p-card styleClass="task-history-card shadow-md hover:shadow-lg transition-shadow duration-200">
          <div class="flex items-center gap-4">
            <!-- Assignee Image -->
            <div class="flex-shrink-0">
              <img
                [src]="taskAssignment.assignee === 'Felix' ? 'assets/person1.jpg' : 'assets/person2.jpg'"
                [alt]="'Photo de ' + taskAssignment.assignee"
                class="w-16 h-16 rounded-full object-cover border-2 border-primary-500 dark:border-primary-400 shadow-sm"
                onError="this.src='assets/placeholder.jpg'"
              />
            </div>
  
            <!-- Task Details -->
            <div class="flex-grow">
              <p class="text-lg font-semibold text-surface-800 dark:text-surface-100 mb-1">{{ taskAssignment.taskTitle }}</p>
              <div class="text-sm text-surface-600 dark:text-surface-400 flex flex-col sm:flex-row sm:items-center sm:gap-4">
                 <!-- Assignee Info -->
                 <div class="flex items-center gap-1">
                   <i class="pi pi-user text-primary-500 dark:text-primary-400"></i>
                   <span>{{ taskAssignment.assignee }}</span>
                 </div>
                 <!-- Date Info -->
                 <div class="flex items-center gap-1 mt-1 sm:mt-0">
                   <i class="pi pi-calendar text-primary-500 dark:text-primary-400"></i>
                   <span>{{ taskAssignment.completedDate | date:'EEEE - dd MMMM YYYY @ HH:mm' }}</span>
                 </div>
              </div>
            </div>
  
            <!-- Optional: Add a visual indicator like a checkmark -->
            <div class="ml-auto flex-shrink-0">
               <i class="pi pi-check-circle text-green-500 text-2xl"></i>
            </div>
  
          </div>
        </p-card>
      </div>
    </div>
  
  </div>

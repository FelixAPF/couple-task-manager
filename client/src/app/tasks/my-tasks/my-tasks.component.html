<div class="container p-4 mx-auto flex flex-col flex-grow">

  <!-- Top Controls Bar -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6 p-4 bg-surface-50 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700" [formGroup]="formGroup">
    <!-- Action Buttons -->
    <div class="flex flex-wrap justify-center sm:justify-start gap-2">
      <p-button
        (click)="startNewPeriod()"
        label="Débuter période"
        icon="pi pi-calendar-plus"
        styleClass="p-button-raised p-button-info"
        pTooltip="Démarrer une nouvelle période de tâches assignées"
        tooltipPosition="bottom">
      </p-button>
      <p-button
        (click)="quickComplete()"
        label="Quick Complete"
        icon="pi pi-bolt"
        styleClass="p-button-raised p-button-secondary"
        pTooltip="Accéder à la complétion rapide (si disponible)"
        tooltipPosition="bottom">
      </p-button>
    </div>

    <!-- Display Duration Select -->
    <div class="w-full sm:w-auto">
      <p-select
        class="w-full"
        [formControlName]="DISPLAY_DURATION.DISPLAY_DURATION"
        (onChange)="onFrequencySelectChange($event)"
        label="Afficher les tâches"
        [options]="options"
        optionValue="value"
        optionLabel="label"
        appendTo="body"
      ></p-select>
    </div>
  </div>

  <!-- Title and User Switcher -->
  <div class="flex justify-center items-center gap-3 mb-6">
    <h2 class="text-2xl font-semibold text-center text-surface-800 dark:text-surface-100">
      Mes tâches - {{ selectedAssignee }}
    </h2>
    <i
      class="pi pi-users text-primary-500 dark:text-primary-400 cursor-pointer hover:text-primary-700 dark:hover:text-primary-300 transition-colors duration-200"
      (click)="changeUser()"
      style="font-size: 2rem"
      pTooltip="Changer d'utilisateur"
      tooltipPosition="top"
    ></i>
  </div>

  <!-- Empty State Message -->
  <div *ngIf="!tasks || tasks.length === 0" class="text-center text-surface-500 dark:text-surface-400 mt-8 p-6 border border-dashed rounded-lg bg-surface-100 dark:bg-surface-800">
    <i class="pi pi-check-square mr-2 text-xl align-middle"></i>
    <span>Aucune tâche à afficher pour {{ selectedAssignee }} avec les filtres actuels.</span>
  </div>

  <!-- Task List using Cards -->
  <div class="flex flex-col gap-4 pb-16" *ngIf="tasks && tasks.length > 0">
    <!-- Loop through TaskAssignmentDto objects -->
    <div *ngFor="let task of tasks">
      <p-card [styleClass]="'task-card shadow-md hover:shadow-lg transition-shadow duration-200 ' + (datePastDeadline(task.dueDate) ? 'border-l-4 border-red-500 dark:border-red-400' : 'border-l-4 border-primary-500 dark:border-primary-400')">
        <div class="flex items-center gap-4">

          <!-- Assignee Image -->
          <div class="flex-shrink-0">
            <img
              [src]="SOURCE_MAP[task.assignee]"
              [alt]="'Photo de ' + task.assignee"
              class="w-12 h-12 rounded-full object-cover border-2 border-primary-500 dark:border-primary-400 shadow-sm"
              onError="this.src='assets/placeholder.jpg'"
              pTooltip="{{task.assignee}}"
              tooltipPosition="top"
            />
          </div>

          <!-- Alert Icon (Conditional) -->
          <div class="flex-shrink-0 w-8 text-center">
             <i *ngIf="datePastDeadline(task.dueDate)"
                class="pi pi-exclamation-triangle text-red-500 dark:text-red-400 text-2xl animate-pulse"
                pTooltip="En retard!"
                tooltipPosition="right">
             </i>
             <!-- Optional: Placeholder if not overdue -->
             <!-- <i *ngIf="!datePastDeadline(task.dueDate)" class="pi pi-circle-fill text-gray-300 dark:text-gray-600 text-xs"></i> -->
          </div>

          <!-- Task Details -->
          <div class="flex-grow min-w-0"> <!-- min-w-0 prevents text overflow issues -->
            <!-- Access title via task.task.title -->
            <p class="text-lg font-semibold text-surface-800 dark:text-surface-100 mb-1" [pTooltip]="task.taskTitle" tooltipPosition="top">{{ task.taskTitle }}</p>
            <div class="text-sm text-surface-600 dark:text-surface-400 flex flex-col sm:flex-row sm:flex-wrap sm:items-center sm:gap-x-4 sm:gap-y-1">
              <!-- Deadline (Directly on TaskAssignmentDto) -->
              <span class="flex items-center gap-1" pTooltip="Date limite" tooltipPosition="bottom">
                <i class="pi pi-calendar text-primary-500 dark:text-primary-400"></i>
                <span>{{ task.dueDate | date:'dd/MM/yyyy' }}</span>
              </span>
              <!-- Room (Via task.task.room) -->
              <span class="flex items-center gap-1" pTooltip="Pièce" tooltipPosition="bottom">
                <i class="pi pi-map-marker text-primary-500 dark:text-primary-400"></i>
                <span>{{ task.room | roomPipe }}</span>
              </span>
              <!-- Frequency (Via task.task.frequency) -->
              <span class="flex items-center gap-1" pTooltip="Fréquence" tooltipPosition="bottom">
                <i class="pi pi-sync text-primary-500 dark:text-primary-400"></i>
                <span>{{ `FREQUENCY.${task.frequency}` | translate }}</span>
              </span>
            </div>
          </div>

          <!-- Complete Action -->
          <div class="ml-auto flex-shrink-0">
            <button pButton type="button"
                    icon="pi pi-check-circle"
                    class="p-button-rounded p-button-success p-button-text text-2xl hover:bg-green-100 dark:hover:bg-green-900"
                    (click)="completeTask(task)"
                    pTooltip="Marquer comme complétée"
                    tooltipPosition="left">
            </button>
          </div>

        </div>
      </p-card>
    </div>
  </div>

  <!-- Add some padding at the bottom to avoid content touching footer navbar -->
  <div class="pb-12"></div>

</div>

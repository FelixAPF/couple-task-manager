<div class="container p-4 md:p-6 mx-auto pb-20 lg:pb-6 max-w-2xl">
    <button pButton pRipple icon="pi pi-arrow-left" label="Retour" class="p-button-text p-button-secondary mb-4" routerLink="/finance/dashboard"></button>
    
    <div class="bg-surface-0 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 p-4 md:p-6">
        <h2 class="text-xl font-semibold mb-6 text-surface-800 dark:text-surface-100 mt-0">Configuration de la paie</h2>
        
        <div class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-surface-700 dark:text-surface-200">Montant habituel de la paie</label>
                <p-inputNumber [(ngModel)]="config.amount" mode="currency" currency="CAD" styleClass="w-full" inputStyleClass="w-full"></p-inputNumber>
            </div>
            
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-surface-700 dark:text-surface-200">Cycle de paie</label>
                <p-dropdown [options]="cycleOptions" [(ngModel)]="config.cycle" styleClass="w-full" appendTo="body"></p-dropdown>
            </div>
            
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-surface-700 dark:text-surface-200">Date de référence (Dernière paie)</label>
                <p-calendar [(ngModel)]="config.referenceDate" styleClass="w-full" inputStyleClass="w-full" [showIcon]="true" appendTo="body"></p-calendar>
            </div>

            <button pButton pRipple label="Enregistrer la configuration" icon="pi pi-save" class="p-button-primary w-full mt-4" (click)="saveConfig()"></button>
        </div>
    </div>
</div>

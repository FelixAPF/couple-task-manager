<div class="container">

    <p-button (click)="changeUser()" class="float-right">Changer Utilisateur</p-button>
    <h2>Mes tâches - {{selectedAssignee}}</h2>
    
    <div>
        <p-table
        [value]="tasks"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        [tableStyle]="{ 'min-width': '50rem' }"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[1, 3, 5]"
    >
        <ng-template #header>
            <tr>
                <th style="width:30%">Titre</th>
                <th style="width:40%">Description</th>
                <th style="width:15%">Date prévue</th>
                <th style="width:15%">Compléter</th>
            </tr>
        </ng-template>
        <ng-template #body let-element>
            <tr>
                <td>{{ element.task.title }}</td>
                <td>{{ element.task.description }}</td>
                <td>{{ element.dueDate | date: 'longDate' }}</td>
                <td (click)="completeTask(element.id)"><i class="pi pi-check hover" style="font-size: 1.5rem"></i></td>
            </tr>
        </ng-template>
    </p-table>
    </div>
</div>

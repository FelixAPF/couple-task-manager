server {
    listen 80;
    server_name localhost; # NPM will handle the actual domain name

    # Set the root directory to where your Angular files will be in the Docker image
    root /usr/share/nginx/html;
    index index.html index.htm;

    # This is the crucial part for Angular routing:
    # Try to serve the requested file/directory, otherwise serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Improve caching for static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Optional: Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
<div class="container p-4 mx-auto flex flex-col flex-grow">

  <!-- Header: Title + Add Button -->
  <div class="flex flex-col sm:flex-row justify-between items-center mb-6 p-4 bg-surface-50 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 gap-3">
    <h2 class="text-2xl font-semibold text-surface-800 dark:text-surface-100">
      Liste de courses
    </h2>
    <p-button
      (click)="openNewTaskDialog()"
      label="Ajouter Article"
      icon="pi pi-plus"
      styleClass="p-button-raised p-button-primary w-full sm:w-auto"
      pTooltip="Ajouter un nouvel article à la liste"
      tooltipPosition="bottom">
    </p-button>
  </div>

  <!-- Empty State Message -->
  <div *ngIf="!shoppingItems || shoppingItems.length === 0" class="text-center text-surface-500 dark:text-surface-400 mt-8 p-6 border border-dashed rounded-lg bg-surface-100 dark:bg-surface-800">
    <i class="pi pi-shopping-cart mr-2 text-xl align-middle"></i>
    <span>Votre liste de courses est vide. Cliquez sur "Ajouter Article" pour commencer.</span>
  </div>

  <!-- Shopping List Items using p-card -->
  <div class="flex flex-col gap-4 pb-16" *ngIf="shoppingItems && shoppingItems.length > 0"> <!-- Increased gap slightly for cards -->
    <div *ngFor="let item of shoppingItems; trackBy: trackById">
      <!-- Using p-card for more depth -->
      <p-card [styleClass]="'shopping-item-card shadow-md hover:shadow-lg transition-shadow duration-200 border-l-4 border-primary-500 dark:border-primary-400'">
        <!-- Added shadow, transition, and a consistent left border color -->
        <div class="flex items-center gap-3"> <!-- Internal flex container -->

          <!-- Item Details -->
          <div class="flex-grow min-w-0">
            <p class="text-base font-medium text-surface-800 dark:text-surface-100" [pTooltip]="item.name" tooltipPosition="top"> <!-- Added tooltip -->
              {{ item.name }}
            </p>
            <!-- Optional: Quantity display if needed -->
            <!--
            <span *ngIf="item.quantity" class="text-xs text-surface-500 dark:text-surface-400 block mt-0.5">
              Quantité: {{ item.quantity }}
            </span>
            -->
          </div>

          <div class="ml-auto flex-shrink-0 flex items-center gap-1">
            <!-- Buy Button - Enhanced Visibility & Accessibility -->
            <button pButton type="button"
                    icon="pi pi-check"
                    class="p-button-rounded p-button-success p-button-raised"
                    (click)="delete(item, item.id)"
                    pTooltip="Acheté (retirer de la liste)"
                    tooltipPosition="left"
                    [attr.aria-label]="'Marquer ' + item.name + ' comme acheté et retirer de la liste'">
                  </button>
          </div>

        </div> <!-- End internal flex container -->
      </p-card> <!-- End p-card -->
    </div> <!-- End *ngFor -->
  </div> <!-- End item list container -->

  <!-- Add some padding at the bottom -->
  <div class="pb-12"></div>

</div>

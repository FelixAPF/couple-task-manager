<form [formGroup]="formGroup">
    <p-stepper>
      <!-- Step 1: Period Configuration -->
        <p-step-panels>
            <p-step-panel header="Configuration Période" [hidden]="manualStepActivated">
                <ng-template pTemplate="content" let-activateCallback="activateCallback" let-index="index">
                <div class="p-fluid flex flex-col gap-5 p-4"> <!-- Main content area -->
                    <!-- Start Date -->
                    <div class="field flex flex-col gap-2">
                    <label for="startDate" class="font-semibold">Date de début</label>
                    <p-datePicker
                        id="startDate"
                        formControlName="startDate"
                        dateFormat="dd/mm/yy"
                        [showIcon]="true"
                        [disabled]="existingPeriodSelected"
                        appendTo="body">
                    </p-datePicker>
                    <small *ngIf="formGroup.get('startDate')?.invalid && formGroup.get('startDate')?.touched" class="p-error block">
                        La date de début est requise.
                    </small>
                    </div>
        
                    <!-- Duration Type -->
                    <div class="field flex flex-col gap-2">
                    <label class="font-semibold">Type de Durée</label>
                    <p-selectButton
                        [options]="[{label: 'Période', value: DURATION_TYPE.PERIOD}, {label: 'Date Explicite', value: DURATION_TYPE.EXPLICIT}]"
                        formControlName="durationType"
                        optionLabel="label"
                        optionValue="value"
                        [disabled]="existingPeriodSelected">
                    </p-selectButton>
                    </div>
        
                    <!-- Duration (Frequency) - Conditional -->
                    <div *ngIf="durationType?.value === DURATION_TYPE.PERIOD && !existingPeriodSelected" class="field flex flex-col gap-2">
                    <label for="duration" class="font-semibold">Durée de la période</label>
                    <p-select
                        id="duration"
                        formControlName="duration"
                        [options]="frequencies"
                        placeholder="Choisir la durée"
                        optionLabel="label"
                        optionValue="value"
                        appendTo="body">
                    </p-select>
                    <small *ngIf="formGroup.get('duration')?.invalid && formGroup.get('duration')?.touched" class="p-error block">
                        La durée est requise pour ce type.
                    </small>
                    </div>
        
                    <!-- Explicit Due Date - Conditional -->
                    <div *ngIf="durationType?.value === DURATION_TYPE.EXPLICIT && !existingPeriodSelected" class="field flex flex-col gap-2">
                    <label for="explicitDueDate" class="font-semibold">Date d'échéance explicite</label>
                    <p-datePicker
                        id="explicitDueDate"
                        formControlName="explicitDueDate"
                        dateFormat="dd/mm/yy"
                        [showIcon]="true"
                        appendTo="body">
                    </p-datePicker>
                    <small *ngIf="formGroup.get('explicitDueDate')?.invalid && formGroup.get('explicitDueDate')?.touched" class="p-error block">
                        La date d'échéance est requise pour ce type.
                    </small>
                    </div>
        
                    <!-- Creation Method -->
                    <div class="field flex flex-col gap-2">
                    <label class="font-semibold">Méthode de Création des Tâches</label>
                    <p-selectButton
                        [options]="[{label: 'Automatique', value: CREATION_METHOD.AUTOMATIC}, {label: 'Manuelle', value: CREATION_METHOD.MANUAL}]"
                        formControlName="creationMethod"
                        optionLabel="label"
                        optionValue="value">
                    </p-selectButton>
                    </div>
        
                </div>
                <!-- Footer for Step 1 -->
                <div class="flex justify-end gap-2 p-4 border-t border-surface-200 dark:border-surface-700 mt-2">
                    <p-button type="button" label="Annuler" severity="secondary" (click)="close()"></p-button>
                    <!-- If Automatic, submit directly. If Manual, go to next step -->
                    <p-button
                    *ngIf="isAutomaticCreation"
                    type="button"
                    label="Créer (Auto)"
                    icon="pi pi-check"
                    (click)="submit()"
                    [disabled]="formGroup.invalid">
                    </p-button>
                    <p-button
                    *ngIf="!isAutomaticCreation"
                    type="button"
                    label="Suivant (Assignation)"
                    icon="pi pi-arrow-right"
                    iconPos="right"
                    (click)="activateSecondFormGroup(activateCallback)"
                    [disabled]="formGroup.invalid"> <!-- Basic check, might need refinement -->
                    </p-button>
                </div>
                </ng-template>
            </p-step-panel>
        
            <!-- Step 2: Manual Assignment (Only shown if method is Manual) -->
            <p-step-panel header="Assignation Manuelle" [hidden]="!manualStepActivated">
                <ng-template pTemplate="content" let-prevCallback="prevCallback" let-index="index">
                    <!-- Embed the task assignment component -->
                    <app-task-assignment
                    [showCreateEachTaskOnce]="true"
                    (submit)="submit($event)"
                    (cancel)="handleManualCancel()"> <!-- Use prevCallback to go back -->
                    </app-task-assignment>
                </ng-template>
            </p-step-panel>
        </p-step-panels>
    </p-stepper>
  </form>

<p-card [styleClass]="'recipe-card h-full flex flex-col bg-surface-0 dark:bg-surface-800 shadow-md hover:shadow-lg transition-shadow duration-200 rounded-lg overflow-hidden'">
    <!-- Header, Title, Subtitle... -->
    <ng-template pTemplate="header">
      <div class="relative h-48 bg-surface-100 dark:bg-surface-700">
        <img *ngIf="recipe.imageUrl; else imagePlaceholder" [src]="recipe.imageUrl" [alt]="recipe.name" class="w-full h-full object-cover">
        <ng-template #imagePlaceholder>
          <div #imagePlaceholderRef class="absolute inset-0 flex items-center justify-center text-surface-400 dark:text-surface-500">
            <i class="pi pi-image text-5xl"></i>
          </div>
        </ng-template>
      </div>
    </ng-template>
    <ng-template pTemplate="title">
      <span class="block truncate text-lg font-semibold text-surface-800 dark:text-surface-100" [pTooltip]="recipe.name" tooltipPosition="top">
        {{ recipe.name }}
      </span>
    </ng-template>
    <ng-template pTemplate="subtitle">
      <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-surface-600 dark:text-surface-400 mb-2">
        <span *ngIf="recipe.category">
           <p-tag [value]="`RECIPE_CATEGORY.${recipe.category}` | translate | titlecase" [severity]="getCategoryTagSeverity(recipe.category)" [rounded]="true"></p-tag>
        </span>
      </div>
    </ng-template>

    <!-- Card Content -->
    <ng-template pTemplate="content">
      <div class="flex-grow">
        <p #descriptionParagraph *ngIf="recipe.description"
        class="text-sm text-surface-700 dark:text-surface-300 mb-1 description-paragraph"
        [class.line-clamp-3]="clampDescription && !overrideDescriptionClamp">
       {{ recipe.description }}
     </p>
        <!-- Combined and Styled Show More/Less Link -->
        <span *ngIf="clampDescription && isDescriptionOverflowing"
        (click)="toggleDescriptionClamp()"
        class="text-xs text-primary-600 dark:text-primary-400 hover:underline cursor-pointer font-medium mt-1 inline-block mb-3  description-paragraph">
        <!-- Text still depends on the override flag -->
          {{ overrideDescriptionClamp ? 'Voir moins' : 'Voir plus' }}
        </span>

        <!-- Accordion for Ingredients -->
        <p-accordion [value]="openIngredients ? 'ingredients' : ''" *ngIf="recipe.ingredients && recipe.ingredients.length > 0"
                     styleClass="recipe-details-accordion">
            <p-accordion-panel value="ingredients"> <!-- Panel value -->
                <p-accordion-header>
                    Ingrédients ({{ recipe.ingredients.length }})
                </p-accordion-header>
                <p-accordion-content>
                    <ul class="list-disc pl-5 space-y-1 text-xs text-surface-700 dark:text-surface-300">
                        <li *ngFor="let ingredient of recipe.ingredients">
                            {{ formatIngredient(ingredient) }}
                        </li>
                    </ul>
                </p-accordion-content>
            </p-accordion-panel>
        </p-accordion>
        <!-- End of changes -->

        <p *ngIf="!recipe.ingredients || recipe.ingredients.length === 0" class="text-xs text-surface-500 dark:text-surface-400 italic mt-2">
          Aucun ingrédient listé.
        </p>
      </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2 pt-2 border-t border-surface-100 dark:border-surface-700 mt-auto">
            <ng-container [ngTemplateOutlet]="buttonsTemplate"></ng-container>

        </div>
    </ng-template>

  </p-card>

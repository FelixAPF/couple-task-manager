<div class="flex flex-col flex-grow transition-transform duration-300 ease-in-out"
     [style.transform]="swipeTransform"
     (swipe)="swipeNavigation($event)">

  <div class="flex justify-between items-center mb-4 md:mb-6 px-2 py-2 rounded-lg bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 shadow-sm">
    <button pButton pRipple type="button" icon="pi pi-arrow-left"
            class="p-button-rounded p-button-text"
            (click)="previousWeek()"
            [pTooltip]="'meals.previous-week'|translate" tooltipPosition="bottom"
            aria-label="Semaine précédente">
    </button>

    <div class="flex flex-col items-center">
       <span class="text-sm font-semibold text-surface-800 dark:text-surface-100">
         {{ formattedWeekRange }}
       </span>
       <button pButton pRipple type="button" [label]="'meals.current-week' | translate"
               class="p-button-link p-button-sm !text-xs !py-0 !px-1"
               (click)="goToCurrentWeek()"
               aria-label="Aller à la semaine actuelle">
       </button>
    </div>

    <button pButton pRipple type="button" icon="pi pi-arrow-right"
            class="p-button-rounded p-button-text"
            (click)="nextWeek()"
            [pTooltip]="'meals.next-week'|translate" tooltipPosition="bottom"
            aria-label="Semaine suivante">
    </button>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-4 md:gap-6">
    <div *ngFor="let day of weekDays" class="day-card-wrapper">
        <ng-container *ngTemplateOutlet="dayTemplate; context: { $implicit: day }"></ng-container>
    </div>
  </div>

</div>

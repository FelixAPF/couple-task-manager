<div class="dialog-container">
    
    <div class="mb-4 flex justify-center w-full">
        <p-selectButton [options]="creationSourceOptions" [(ngModel)]="selectedSource" (onChange)="onModeChange()" optionLabel="label" optionValue="value" styleClass="w-full"></p-selectButton>
    </div>

    <div *ngIf="selectedSource === 'OCCASION'" class="mb-6 p-4 bg-gray-50 border border-gray-200 rounded-lg flex flex-col gap-4">
        <div class="flex flex-col gap-2">
            <label class="font-semibold text-gray-700">Sélectionner un groupe de tâches</label>
            <p-dropdown [options]="occasions" [(ngModel)]="selectedOccasion" (onChange)="onOccasionChange()" optionLabel="name" placeholder="Choose a list" styleClass="w-full" appendTo="body"></p-dropdown>
        </div>

        <div class="flex items-center justify-between" *ngIf="selectedOccasion">
            <div class="flex flex-col">
                <span class="font-semibold text-sm">Créer automatiquement les tâches?</span>
                <span class="text-xs text-gray-500">Si oui, {{selectedOccasion.taskAssignments.length}} tâches seront créées automatiquement.</span>
            </div>
            <p-inputSwitch [(ngModel)]="autoCreateFromOccasion" (onChange)="toggleOccasionAutoCreate($event.checked)"></p-inputSwitch>
        </div>
    </div>

    <form [formGroup]="formGroup" class="flex flex-col gap-4" *ngIf="!manualStepActivated">
        
        <div class="header-section">
            <div class="form-group date-group">
                <label class="label-bold block mb-2 font-semibold">Date de début de période</label>
                <p-calendar formControlName="startDate" appendTo="body" styleClass="w-full" [showIcon]="true"></p-calendar>
            </div>
        </div>

        <div class="form-group">
            <label class="label-bold block mb-2 font-semibold">Duration Type</label>
            <div class="flex gap-4">
                <div class="flex items-center">
                    <input type="radio" [value]="DURATION_TYPE.PERIOD" formControlName="durationType" id="dt_period" class="mr-2">
                    <label for="dt_period">Période récurrente</label>
                </div>
                <div class="flex items-center">
                    <input type="radio" [value]="DURATION_TYPE.EXPLICIT" formControlName="durationType" id="dt_explicit" class="mr-2">
                    <label for="dt_explicit">Date précise</label>
                </div>
            </div>
        </div>

        <div *ngIf="durationType.value === DURATION_TYPE.PERIOD" class="form-group animate-fade-in">
            <label class="label-bold block mb-2 font-semibold">Durée de la période</label>
            <p-dropdown [options]="frequencies" formControlName="duration" placeholder="Select Duration" styleClass="w-full" appendTo="body"></p-dropdown>
        </div>

        <div *ngIf="durationType.value === DURATION_TYPE.EXPLICIT" class="form-group animate-fade-in">
            <label class="label-bold block mb-2 font-semibold">Date de fin de période</label>
            <p-calendar formControlName="explicitDueDate" appendTo="body" styleClass="w-full" [showIcon]="true"></p-calendar>
        </div>

        <div class="form-group flex items-center justify-between mt-2">
            <div class="flex flex-col">
                <label class="label-bold font-semibold">Créer les tâches une seule fois</label>
                <span class="text-xs text-gray-500">Cocher pour générer les tâches une seule fois à la date précisée.</span>
            </div>
            <p-inputSwitch formControlName="createOnce"></p-inputSwitch>
        </div>

    </form>

    <div *ngIf="manualStepActivated" class="mt-4 border-t pt-4 h-[400px]">
        <app-task-assignment 
            (onCancel)="handleManualCancel()"
            (onSubmit)="submit($event)">
        </app-task-assignment>
    </div>

    <div class="dialog-footer mt-6 flex justify-end gap-2" *ngIf="!manualStepActivated">
        <p-button label="Cancel" styleClass="p-button-text" (onClick)="close()"></p-button>
        
        <p-button 
            [label]="(selectedSource === 'OCCASION' && autoCreateFromOccasion) ? 'Start Period' : 'Next'" 
            (onClick)="activateSecondFormGroup(dummyCallback)" 
            [disabled]="formGroup.invalid || (selectedSource === 'OCCASION' && !selectedOccasion)">
        </p-button>
    </div>

</div>

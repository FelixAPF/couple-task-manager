<!-- Toast for feedback -->
<p-toast></p-toast>

<div class="container p-4 md:p-6 mx-auto pb-20 lg:pb-6">
  <h2 class="text-2xl font-semibold mb-6 text-center text-surface-800 dark:text-surface-100">
    Gestion du Foyer
  </h2>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="flex justify-center items-center py-10">
    <p-progressSpinner styleClass="w-8 h-8" strokeWidth="4"></p-progressSpinner>
  </div>

  <!-- Household Members List -->
  <div *ngIf="(household$ | async) as household; else noHousehold">
    <div *ngIf="household.members && household.members.length > 0; else noMembers"
         class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">

      <!-- Member Card -->
      <div *ngFor="let member of household.members; trackBy: trackByMemberId"
           class="p-4 bg-surface-0 dark:bg-surface-800 rounded-lg shadow-md border border-surface-200 dark:border-surface-700 flex flex-col items-center text-center">

        <!-- Avatar -->
        <p-avatar
          [image]="member.imageUrl || 'assets/placeholder-user.png'"
          size="xlarge"
          shape="circle"
          class="mb-3 border-2 border-primary-500 dark:border-primary-400 shadow-sm">
        </p-avatar>

        <!-- Member Name -->
        <p class="text-lg font-medium text-surface-800 dark:text-surface-100 mb-4">
          {{ member.name }}
        </p>

        <!-- File Upload Section -->
        <div class="w-full flex flex-col items-center gap-2 relative">
           <!-- Spinner shown during upload for this member -->
           <p-progressSpinner *ngIf="uploadingMemberId() === member.id"
                              styleClass="w-6 h-6 absolute -top-8 z-10"
                              strokeWidth="6">
           </p-progressSpinner>

           <!-- FileUpload for SELECTION only -->
           <p-fileUpload
              #uploader 
              mode="basic"
              name="imageFile"
              accept="image/*"
              [maxFileSize]="2000000"
              chooseLabel="Choisir Photo"
              chooseIcon="pi pi-image"
              [auto]="false"  
              [customUpload]="false" 
              (onSelect)="onFileSelect($event, member.id)" 
              [disabled]="uploadingMemberId() !== null" 
              styleClass="p-button-sm p-button-outlined w-full max-w-[200px]"
              invalidFileSizeMessageSummary="{0}: Fichier trop volumineux,"
              invalidFileSizeMessageDetail="La taille max est {0}."
              invalidFileTypeMessageSummary="{0}: Type de fichier invalide,"
              invalidFileTypeMessageDetail="Seules les images {0} sont autorisées.">
           </p-fileUpload>

           <!-- Separate Save Button -->
           <button pButton pRipple
                   type="button"
                   label="Sauvegarder Image"
                   icon="pi pi-save"
                   class="p-button-sm w-full max-w-[200px]"
                   [disabled]="!selectedFiles[member.id] || uploadingMemberId() !== null"
                   [loading]="uploadingMemberId() === member.id"
                   (click)="triggerImageUpload(member.id, uploader)">
           </button>
        </div>

      </div> <!-- End Member Card -->

    </div>
  </div>

  <!-- Template for No Household Loaded -->
  <ng-template #noHousehold>
    <div *ngIf="!isLoading()" class="text-center text-surface-500 dark:text-surface-400 mt-8 p-6 border rounded-lg bg-surface-100 dark:bg-surface-800">
      <i class="pi pi-info-circle mr-2"></i>
      Les informations du foyer ne sont pas disponibles. Essayez de rejoindre ou créer un foyer.
    </div>
  </ng-template>

  <!-- Template for No Members in Household -->
  <ng-template #noMembers>
    <div class="text-center text-surface-500 dark:text-surface-400 mt-8 p-6 border rounded-lg bg-surface-100 dark:bg-surface-800">
      <i class="pi pi-users mr-2"></i>
      Vous êtes le seul membre de ce foyer pour le moment.
    </div>
  </ng-template>

</div>

<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog> 
<p-toast></p-toast> 

<div class="flex flex-col gap-6">

  <!-- Action & Search Bar -->
  <div class="bg-white dark:bg-surface-800 p-5 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-surface-100 dark:border-surface-700 flex flex-col md:flex-row justify-between items-center gap-4">
    
    <!-- Search Input -->
    <div class="relative w-full md:w-96">
      <div class="p-input-icon-left w-full">
        <i class="pi pi-search text-surface-400"></i>
        <input type="text" 
               pInputText 
               [(ngModel)]="searchTerm" 
               (ngModelChange)="applyFilters()" 
               placeholder="Rechercher par titre ou ingrédient..." 
               class="w-full !rounded-2xl !py-3 !pl-11 !pr-9 border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-900 font-medium" />
      </div>
      <button *ngIf="searchTerm" 
              (click)="clearSearch()" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-surface-400 hover:text-surface-600 dark:hover:text-surface-200">
        <i class="pi pi-times text-xs"></i>
      </button>
    </div>

    <!-- Right Action Buttons -->
    <div class="flex items-center gap-3 w-full md:w-auto">
      
      <!-- Random Recipe Button -->
      <button pButton pRipple
              type="button"
              icon="pi pi-sparkles"
              label="Recette au hasard"
              class="flex-1 md:flex-initial p-button-rounded font-bold !bg-gradient-to-r !from-amber-500 !to-orange-500 !border-none !text-white shadow-md shadow-orange-500/20 hover:scale-105 active:scale-95 transition-all"
              (click)="openRandomRecipeCard()">
      </button>

      <!-- New Recipe Button -->
      <button pButton pRipple
              type="button"
              icon="pi pi-plus"
              label="Nouvelle recette"
              class="flex-1 md:flex-initial p-button-rounded p-button-primary font-bold shadow-md shadow-primary-500/20 hover:scale-105 active:scale-95 transition-all"
              (click)="openCreateRecipeDialog()">
      </button>

    </div>
  </div>

  <!-- Horizontal Category Filters Carousel -->
  <div class="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar no-scrollbar">
    <button *ngFor="let cat of categoriesWithCounts"
            type="button"
            (click)="selectCategory(cat.value)"
            class="px-4 py-2 rounded-2xl text-xs font-bold whitespace-nowrap transition-all duration-200 flex items-center gap-2 border cursor-pointer"
            [ngClass]="selectedCategory === cat.value
              ? 'bg-surface-900 text-white dark:bg-white dark:text-surface-900 border-transparent shadow-md'
              : 'bg-white dark:bg-surface-800 text-surface-600 dark:text-surface-300 border-surface-200/80 dark:border-surface-700 hover:bg-surface-100 dark:hover:bg-surface-700/60'">
      <span>{{ cat.emoji }}</span>
      <span>{{ cat.label }}</span>
      <span class="px-2 py-0.5 rounded-full text-[10px]"
            [ngClass]="selectedCategory === cat.value
              ? 'bg-white/20 text-white dark:bg-black/10 dark:text-surface-900'
              : 'bg-surface-100 dark:bg-surface-700 text-surface-500 dark:text-surface-400'">
        {{ cat.count }}
      </span>
    </button>
  </div>

  <!-- Results Stats Banner -->
  <div class="flex justify-between items-center px-1 text-xs font-semibold text-surface-500 dark:text-surface-400">
    <span>{{ filteredRecipes.length }} recette(s) trouvée(s)</span>
    <button *ngIf="selectedCategory !== 'ALL' || searchTerm"
            (click)="resetAllFilters()"
            class="text-primary-600 dark:text-primary-400 font-bold hover:underline">
      Réinitialiser les filtres
    </button>
  </div>

  <!-- Error State -->
  <div *ngIf="errorLoading" class="flex justify-center py-10">
    <p-message severity="error" text="Une erreur est survenue lors du chargement des recettes."></p-message>
  </div>

  <!-- Empty Search Results State -->
  <div *ngIf="!errorLoading && allRecipes.length > 0 && filteredRecipes.length === 0" 
       class="flex flex-col items-center justify-center py-16 px-4 bg-white dark:bg-surface-800 rounded-3xl border border-dashed border-surface-300 dark:border-surface-600 text-center">
    <div class="bg-surface-100 dark:bg-surface-700 p-5 rounded-full mb-3 text-surface-400">
      <i class="pi pi-search text-3xl"></i>
    </div>
    <h3 class="text-lg font-bold text-surface-800 dark:text-surface-100 m-0 mb-1">Aucune recette ne correspond à vos critères</h3>
    <p class="text-sm text-surface-500 dark:text-surface-400 m-0 mb-4">Essayez un autre mot-clé ou changez de catégorie.</p>
    <button pButton pRipple label="Réinitialiser les filtres" class="p-button-outlined p-button-secondary p-button-rounded p-button-sm font-bold" (click)="resetAllFilters()"></button>
  </div>

  <!-- No Recipes Initial State -->
  <div *ngIf="!errorLoading && allRecipes.length === 0" 
       class="flex flex-col items-center justify-center py-16 px-4 bg-white dark:bg-surface-800 rounded-3xl border border-dashed border-surface-300 dark:border-surface-600 text-center">
    <div class="bg-primary-50 dark:bg-primary-900/20 p-6 rounded-full mb-4 text-primary-500">
      <i class="pi pi-book text-4xl"></i>
    </div>
    <h3 class="text-xl font-bold text-surface-800 dark:text-surface-100 mb-2 m-0">Votre livre de recettes est vide</h3>
    <p class="text-sm text-surface-500 dark:text-surface-400 mb-6 max-w-sm m-0">Créez votre première recette manuellement ou importez-en une avec l'IA.</p>
    <button pButton pRipple label="Ajouter ma première recette" icon="pi pi-plus" class="p-button-primary p-button-rounded font-bold shadow-md" (click)="openCreateRecipeDialog()"></button>
  </div>

  <!-- Recipes Grid -->
  <div *ngIf="!errorLoading && filteredRecipes.length > 0" 
       class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div *ngFor="let recipe of filteredRecipes; trackBy: trackById" class="recipe-card-wrapper">
      <app-recipe-card [buttonsTemplate]="buttonsTemplate" [recipe]="recipe" [clampDescription]="true"></app-recipe-card>
      
      <ng-template #buttonsTemplate>
        <button pButton pRipple type="button" icon="pi pi-pencil" 
                class="p-button-rounded p-button-text p-button-sm text-primary-500 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/30" 
                (click)="editRecipe(recipe)" 
                pTooltip="Modifier" 
                tooltipPosition="top">
        </button>
        <button pButton pRipple type="button" icon="pi pi-trash" 
                class="p-button-rounded p-button-text p-button-sm p-button-danger hover:bg-red-50 dark:hover:bg-red-900/30" 
                (click)="confirmDelete($event, recipe)" 
                pTooltip="Supprimer" 
                tooltipPosition="top" 
                [disabled]="!(recipe.id)">
        </button>
      </ng-template>
    </div>
  </div>

</div>

<p-confirmDialog [style]="{width: '50vw'}"></p-confirmDialog>
<p-toast></p-toast>
<div class="p-4 md:p-6 pb-16 flex flex-col flex-grow">

  <div *ngIf="errorLoading" class="flex justify-center items-center flex-grow">
     <p-message severity="error" text="Une erreur est survenue lors du chargement du plan de repas."></p-message>
  </div>

  <div *ngIf="!errorLoading">
    
    <app-week-navigation-control 
      [initialDate]="initialSelectedDay"
      [birthdays]="householdMembersBirthdays"
      (weekChanged)="onWeekChanged($event)">
      
      <ng-template let-day>
        
        <app-meal-card 
          [id]="day.isToday ? 'today' : day.id" 
          [customTemplate]="customTemplate" 
          [noMealPlanned]="noMealPlanned" 
          (click)="selectDay(day)"
          [title]="day.formattedDate" 
          [isBirthday]="day.isBirthday" 
          [borderHighlightClass]="getBorderClass(day)" 
          [meal]="getMealForDay(day.isoDate)">
        </app-meal-card>
        
        <ng-template #customTemplate>
          <div class="flex justify-center gap-2 mt-auto" *ngIf="enableCardModification">
            <button pButton pRipple type="button" icon="pi pi-arrow-right"
                    class="p-button-rounded p-button-text p-button-sm text-primary-500 dark:text-primary-400"
                    (click)="moveMeal(day.date, getMealForDay(day.isoDate))" aria-label="Déplacer le repas"
                    [pTooltip]="'meals.move'|translate" tooltipPosition="top">
            </button>
            <button pButton pRipple type="button" icon="pi pi-pencil"
                    class="p-button-rounded p-button-text p-button-sm text-primary-500 dark:text-primary-400"
                    (click)="assignMeal(day.date, getMealForDay(day.isoDate))" aria-label="Modifier le repas"
                    [pTooltip]="'meals.modify'|translate" tooltipPosition="top">
            </button>
            <button pButton pRipple type="button" icon="pi pi-trash"
                    class="p-button-rounded p-button-text p-button-sm p-button-danger"
                    (click)="confirmRemoveMeal($event, getMealForDay(day.isoDate))" aria-label="Supprimer le repas"
                    [pTooltip]="'meals.delete'|translate" tooltipPosition="top">
            </button>
            <button pButton pRipple type="button" icon="pi pi-user"
                    class="p-button-rounded p-button-text p-button-sm p-button-danger"
                    (click)="confirmAssignMeal(day)" aria-label="Assigner le repas"
                    [pTooltip]="'meals.assign'|translate" tooltipPosition="top">
            </button>
          </div>
        </ng-template>

        <ng-template #noMealPlanned>
          <div class="flex flex-col items-center">
            <i class="pi pi-calendar-times text-3xl text-surface-400 dark:text-surface-500 mb-2"></i>
            <p class="text-xs text-surface-500 dark:text-surface-400 italic mb-3">
              {{ 'meals.no-meal-planned' | translate }}
            </p>
            <button *ngIf="enableCardModification" pButton pRipple type="button" icon="pi pi-plus" [label]="'meals.assign-meal'|translate"
                    class="p-button-sm p-button-outlined"
                    (click)="assignMeal(day.date, undefined)"
                    aria-label="Assigner un repas">
            </button>
          </div>
        </ng-template>
        
      </ng-template>

    </app-week-navigation-control>

  </div> 
</div>

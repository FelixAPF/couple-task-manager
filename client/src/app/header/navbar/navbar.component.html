

<!-- Main Navigation Bar -->
<nav class="bg-surface-100 dark:bg-surface-800 shadow-md fixed top-0 left-0 right-0 z-50 h-12 sm:h-16 flex items-center px-4 sm:px-6">
  <div class="container mx-auto flex justify-between items-center h-full">

    <!-- Left Side: Logo/Brand (Example) -->
    <img src="assets/Gemini_Generated_Image_fw61ocfw61ocfw61-modified.png" alt="App Icon" class="h-6 w-6 mr-2">
    <div class="font-semibold text-lg text-surface-600 dark:text-surface-300">
     Couple Task Manager
    </div>

    <!-- Center/Right Side: Desktop Menu Items & Logout -->
    <div class="hidden sm:flex items-center space-x-4">
      <!-- Add other desktop nav links here if needed -->
      <!-- Example: <a routerLink="/tasks" pButton pRipple class="p-button-text">Tasks</a> -->

      <!-- Desktop Logout Button -->
      <!-- Use *ngIf with async pipe to check login status -->
      <button *ngIf="isLoggedIn$ | async"
              pButton
              pRipple
              type="button"
              label="Logout"
              icon="pi pi-sign-out"
              class="p-button-danger p-button-text"
              (click)="logout()">
      </button>
    </div>

    <!-- Mobile Menu Button (Hamburger) -->
    <div class="sm:hidden">
      <button pButton pRipple type="button" icon="pi pi-bars" class="p-button-text" (click)="toggleMenu()"></button>
    </div>

  </div>
</nav>

<!-- Mobile Menu Overlay & Panel (Example Structure) -->
<!-- Overlay to close menu on outside click -->
<div *ngIf="isMenuOpen" class="sm:hidden fixed inset-0 z-40" (click)="toggleMenu()"></div>

<!-- Sliding Menu Panel -->
<div *ngIf="isMenuOpen"
     class="sm:hidden fixed top-0 right-0 h-full w-64 bg-surface-0 dark:bg-surface-900 shadow-lg z-50 p-4 transition-transform duration-300 ease-in-out transform"
     [class.translate-x-0]="isMenuOpen"
     [class.translate-x-full]="!isMenuOpen">

  <!-- Menu Header -->
  <div class="flex justify-between items-center mb-6">
    <span class="font-semibold text-lg text-surface-800 dark:text-surface-100">Menu</span>
    <button pButton pRipple type="button" icon="pi pi-times" class="p-button-text p-button-rounded" (click)="toggleMenu()"></button>
  </div>

  <!-- Menu Items -->
  <div class="flex flex-col space-y-2">
    <!-- Add other mobile navigation links here -->
    <!-- Example: <a routerLink="/dashboard" class="p-button p-button-text text-left w-full justify-start" (click)="toggleMenu()">Dashboard</a> -->
    <!-- Example: <a routerLink="/tasks" class="p-button p-button-text text-left w-full justify-start" (click)="toggleMenu()">Tasks</a> -->

    <!-- Mobile Logout Button -->
    <!-- Use *ngIf with async pipe to check login status -->
    <button *ngIf="isLoggedIn$ | async"
            pButton
            pRipple
            type="button"
            label="Logout"
            icon="pi pi-sign-out"
            class="p-button-danger p-button-text text-left w-full justify-start"
            (click)="logout()">
    </button>

    <!-- Optional: Add language/theme switches at the bottom -->
    <div class="mt-auto pt-4 border-t border-surface-200 dark:border-surface-700">
       <button pButton pRipple (click)="useLanguage('en')" label="EN" class="p-button-text p-button-sm"></button>
       <button pButton pRipple (click)="useLanguage('fr')" label="FR" class="p-button-text p-button-sm"></button>
       <!-- Add theme switch button if needed -->
    </div>
  </div>
</div>

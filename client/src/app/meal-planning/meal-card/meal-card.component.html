<div class="h-full w-full relative block" *ngIf="isBirthday else regularTemplate">
  <app-balloon-container 
       class="h-full w-full block"
       [numberOfBalloons]="30" 
       [minDuration]="10" 
       [maxDuration]="20">
       <ng-container *ngTemplateOutlet="template"></ng-container>
  </app-balloon-container>
</div>

<ng-template #regularTemplate> 
   <ng-container *ngTemplateOutlet="template"></ng-container>
</ng-template>

<ng-template #template>
  <div class="meal-card-root h-full flex flex-col bg-white dark:bg-surface-800 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] hover:shadow-[0_12px_35px_rgb(0,0,0,0.09)] dark:hover:shadow-[0_12px_35px_rgba(0,0,0,0.4)] transition-all duration-300 ease-out hover:-translate-y-1.5 border border-surface-100 dark:border-surface-700/80 overflow-hidden group/card"
       [ngClass]="borderHighlightClass">
      
    <!-- Day Header -->
    <div class="px-4 py-3 bg-surface-50/70 dark:bg-surface-900/40 border-b border-surface-100 dark:border-surface-700/50 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xs uppercase tracking-widest font-black text-surface-500 dark:text-surface-400 m-0">
          {{ title }}
        </span>
      </div>

      <!-- Delete Button (Shown only when meal is present) -->
      <button *ngIf="meal" 
              pButton 
              pRipple 
              type="button" 
              icon="pi pi-trash"
              class="p-button-rounded p-button-text p-button-sm !w-7 !h-7 !p-0 text-surface-400 hover:!text-red-500 hover:!bg-red-50 dark:hover:!bg-red-900/30 transition-colors opacity-0 group-hover/card:opacity-100"
              (click)="onRemoveClick($event)" 
              aria-label="Supprimer le repas"
              [pTooltip]="'meals.delete' | translate" 
              tooltipPosition="left">
      </button>
    </div>

    <!-- Card Body -->
    <div class="p-4 flex-grow flex flex-col justify-between items-center text-center">
      
      <!-- WHEN MEAL IS PLANNED -->
      <div *ngIf="meal" class="w-full flex flex-col items-center flex-grow justify-between">
        
        <!-- Food Image & Floating Badges Showcase -->
        <div (click)="openRecipeView()" 
             class="relative w-full max-w-[170px] aspect-square rounded-2xl cursor-pointer group/img overflow-hidden mb-3.5 bg-surface-100 dark:bg-surface-700 shadow-sm border border-surface-200/60 dark:border-surface-600/50">
          
          <!-- Image Loading Skeleton -->
          <div *ngIf="meal.recipe.imageUrl && !recipeImageLoaded"
               class="absolute inset-0 w-full h-full bg-surface-200 dark:bg-surface-700 animate-pulse flex items-center justify-center">
            <i class="pi pi-image text-3xl text-surface-400 opacity-40"></i>
          </div>

          <!-- Recipe Image -->
          <img *ngIf="meal.recipe.imageUrl"
               [src]="meal.recipe.imageUrl"
               [alt]="recipeName"
               (load)="recipeImageLoaded = true"
               (error)="recipeImageLoaded = true"
               class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover/img:scale-110"
               [class.opacity-0]="!recipeImageLoaded"
               [class.opacity-100]="recipeImageLoaded">
          
          <!-- Fallback Image Placeholder -->
          <div *ngIf="!meal.recipe.imageUrl" 
               class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-primary-50 to-pink-50 dark:from-surface-700 dark:to-surface-800 text-primary-400 dark:text-primary-300">
            <i class="fa-solid fa-utensils text-3xl mb-1 opacity-60"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider opacity-70">Recette</span>
          </div>

          <!-- Hover Overlay -->
          <div class="absolute inset-0 bg-black/25 opacity-0 group-hover/img:opacity-100 transition-opacity duration-200 flex items-center justify-center">
            <span class="bg-white/90 dark:bg-surface-900/90 text-surface-900 dark:text-white px-2.5 py-1 rounded-full text-xs font-bold shadow-md flex items-center gap-1 backdrop-blur-sm">
              <i class="pi pi-eye text-[11px]"></i> Voir
            </span>
          </div>

          <!-- Thawing Required Badge (Top-Left) -->
          <div *ngIf="meal.isThawingNeeded" 
               class="absolute top-2 left-2 z-20 flex items-center justify-center w-7 h-7 bg-blue-500 text-white rounded-full shadow-md ring-2 ring-white dark:ring-surface-800 transition-transform duration-200 hover:scale-110"
               pTooltip="Décongélation requise la veille" 
               tooltipPosition="top">
            <i class="pi pi-snowflake text-xs"></i>
          </div>

          <!-- Chef / Assignee Avatar Badge (Bottom-Right) -->
          <div *ngIf="meal?.assignedUser as assignee" class="absolute bottom-2 right-2 z-20">
            <img [src]="assignee.imageUrl || 'assets/placeholder.jpg'"
                 [alt]="assignee.name || 'Chef'"
                 class="w-8 h-8 rounded-full object-cover shadow-md ring-2 ring-white dark:ring-surface-800"
                 onError="this.src='assets/placeholder.jpg'"
                 [pTooltip]="'Chef : ' + assignee.name" 
                 tooltipPosition="left" />
          </div>
        </div>

        <!-- Recipe Title & Info -->
        <div class="w-full flex flex-col items-center">
          
          <!-- Category Badge if present -->
          <span *ngIf="meal.recipe.category" 
                class="text-[10px] font-extrabold uppercase tracking-wider text-primary-600 dark:text-primary-400 bg-primary-50 dark:bg-primary-900/30 px-2 py-0.5 rounded-md mb-1.5">
            {{ meal.recipe.category }}
          </span>

          <!-- Recipe Title -->
          <h4 class="text-sm sm:text-base font-bold text-surface-900 dark:text-surface-100 m-0 line-clamp-2 leading-tight min-h-[2.4rem] flex items-center justify-center"
              [pTooltip]="recipeName" 
              tooltipPosition="top">
            {{ recipeName }}
          </h4>
          
          <!-- Location Badge -->
          <div *ngIf="meal.location && meal.location !== 'Maison'" 
               class="inline-flex items-center gap-1 px-2.5 py-0.5 bg-surface-100 dark:bg-surface-700/50 rounded-full text-[11px] font-semibold text-surface-600 dark:text-surface-300 mt-1.5 border border-surface-200/60 dark:border-surface-700">
            <i class="pi pi-map-marker text-[9px] text-primary-500"></i>
            <span>{{ meal.location }}</span>
          </div>
        </div>

        <!-- Action Buttons Slot (Move & Modify) -->
        <div class="w-full mt-3">
          <ng-container [ngTemplateOutlet]="customTemplate"></ng-container>
        </div>

      </div>

      <!-- WHEN NO MEAL IS PLANNED (Empty slot) -->
      <ng-container *ngIf="!meal && noMealPlanned" [ngTemplateOutlet]="noMealPlanned"></ng-container>

    </div>
  </div>
</ng-template>

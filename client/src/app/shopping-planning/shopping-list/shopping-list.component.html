<p-toast></p-toast>
<div class="container p-4 md:p-6 mx-auto pb-20 lg:pb-6">

  <h2 class="text-2xl font-semibold mb-6 text-center text-surface-800 dark:text-surface-100">
    {{'side-menu.shopping-list'|translate}}<i class="pi pi-shopping-cart ml-2" style="font-size: 1.25rem"></i>
  </h2>

  <form [formGroup]="addItemForm" (ngSubmit)="handleAddItem()" class="mb-6 p-4 bg-surface-50 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700">
    <div class="flex flex-col md:flex-row items-end gap-3">
      <div class="flex-grow w-full md:w-auto flex flex-col gap-1">
        <label for="itemName" class="text-sm font-medium text-surface-700 dark:text-surface-200">Nom de l'article</label>
        <p-autoComplete inputId="itemName" formControlName="name" [suggestions]="nameSuggestions" (completeMethod)="searchNameSuggestions($event)" placeholder="Rechercher ou saisir..." styleClass="w-full" inputStyleClass="w-full"></p-autoComplete>
        <div *ngIf="addItemForm.get('name')?.invalid && addItemForm.get('name')?.touched" class="p-error text-xs mt-1">Le nom de l'article est requis.</div>
      </div>
      <div class="flex flex-col sm:flex-row items-end gap-2 w-full md:w-auto flex-shrink-0">
        <div class="w-full sm:w-24 flex-shrink-0 flex flex-col gap-1">
            <label for="itemQuantityAdd" class="text-sm font-medium text-surface-700 dark:text-surface-200">Quantité</label>
            <p-inputNumber inputId="itemQuantityAdd" formControlName="quantity" [showButtons]="true" buttonLayout="horizontal" spinnerMode="horizontal" [min]="1" decrementButtonClass="p-button-secondary p-button-outlined p-button-sm !px-1.5" incrementButtonClass="p-button-secondary p-button-outlined p-button-sm !px-1.5" incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus" styleClass="w-full" inputStyleClass="w-full p-inputtext-sm text-center" [ngClass]="{'p-invalid': addItemForm.get('quantity')?.invalid && addItemForm.get('quantity')?.touched}"></p-inputNumber>
            <div *ngIf="addItemForm.get('quantity')?.invalid && addItemForm.get('quantity')?.touched" class="p-error text-xs mt-1">Quantité min. 1.</div>
        </div>
        <div class="w-full sm:w-48 flex-shrink-0 flex flex-col gap-1">
          <label for="itemStore" class="text-sm font-medium text-surface-700 dark:text-surface-200">Magasin</label>
          <p-dropdown inputId="itemStore" formControlName="store" [options]="storeOptions" placeholder="Choisir" optionLabel="label" optionValue="value" styleClass="w-full" [ngClass]="{'p-invalid': addItemForm.get('store')?.invalid && addItemForm.get('store')?.touched}" appendTo="body"></p-dropdown>
            <div *ngIf="addItemForm.get('store')?.invalid && addItemForm.get('store')?.touched" class="p-error text-xs mt-1">Le magasin est requis.</div>
        </div>
        <div class="flex-shrink-0 w-full sm:w-auto">
          <button pButton pRipple type="submit" icon="pi pi-plus" label="Ajouter" aria-label="Ajouter l'article" [loading]="isAdding()" [disabled]="isAdding() || addItemForm.invalid" class="p-button-primary w-full"></button>
        </div>
      </div>
    </div>
  </form>

  <div *ngIf="groupedShoppingList().length === 0 && !isAdding()" class="text-center py-10 px-4 bg-surface-100 dark:bg-surface-800 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700">
    <i class="pi pi-shopping-cart text-4xl text-surface-400 dark:text-surface-500 mb-3"></i>
    <p class="text-lg font-medium text-surface-600 dark:text-surface-300">Votre liste est vide !</p>
    <p class="text-sm text-surface-500 dark:text-surface-400">Ajoutez des articles en utilisant le formulaire ci-dessus.</p>
  </div>

  <div *ngIf="groupedShoppingList().length > 0" class="flex flex-col gap-6">
    <div *ngFor="let group of groupedShoppingList(); trackBy: trackStoreGroup" class="store-group bg-surface-50 dark:bg-surface-800 p-3 md:p-4 rounded-lg shadow-md border border-surface-200 dark:border-surface-700">
      <div class="flex items-center mb-3 pb-2 border-b border-surface-200 dark:border-surface-600">
        <p-tag [value]="group.storeDisplayName" [severity]="group.severity" styleClass="text-base md:text-lg"></p-tag>
      </div>

      <div class="flex flex-col gap-3"> <div *ngFor="let item of group.items; trackBy: trackById"
             class="item-container p-2.5 bg-surface-0 dark:bg-surface-700 rounded-md shadow-sm border border-surface-100 dark:border-surface-600"
             [ngClass]="{'opacity-60 dark:opacity-50': item.bought}">

          <div class="flex items-center justify-between gap-2">
            <span class="item-name flex-grow font-medium text-surface-700 dark:text-surface-200 truncate"
                  [ngClass]="{'line-through text-surface-400 dark:text-surface-500': item.bought}"
                  [pTooltip]="item.name" tooltipPosition="top" [tooltipOptions]="mainActionTooltipOptions"> {{ item.name }}
            </span>
            <button pButton type="button"
                    [icon]="item.bought ? 'pi pi-undo' : 'pi pi-check-circle'"
                    [pTooltip]="item.bought ? 'Marquer non acheté' : 'Marquer acheté'" tooltipPosition="left"
                    [tooltipOptions]="mainActionTooltipOptions" (click)="toggleBoughtStatus(item)"
                    class="p-button-rounded p-button-text flex-shrink-0 !w-8 !h-8"
                    [ngClass]="item.bought ? 'p-button-warning hover:bg-yellow-500/10 dark:hover:bg-yellow-300/10' : 'p-button-success hover:bg-green-500/10 dark:hover:bg-green-300/10'">
            </button>
          </div>

<div class="custom-quantity-control flex items-center justify-start gap-1.5 mt-1.5">
            <button pButton type="button" icon="pi pi-minus"
                    (click)="decrementQuantity(item)"
                    [disabled]="((item.quantity ?? 1) <= 1) || item.bought" aria-label="Diminuer la quantité"
                    pTooltip="Diminuer" tooltipPosition="bottom" [tooltipOptions]="quantityButtonTooltipOptions"
                    class="p-button-rounded p-button-secondary p-button-outlined p-button-sm !w-7 !h-7 !text-xs">
            </button>
            <span class="quantity-display text-sm font-medium text-surface-600 dark:text-surface-300 w-6 text-center tabular-nums">
              {{ item.quantity ?? 1 }} </span>
            <button pButton type="button" icon="pi pi-plus"
                    (click)="incrementQuantity(item)"
                    [disabled]="item.bought" aria-label="Augmenter la quantité"
                    pTooltip="Augmenter" tooltipPosition="bottom" [tooltipOptions]="quantityButtonTooltipOptions"
                    class="p-button-rounded p-button-secondary p-button-outlined p-button-sm !w-7 !h-7 !text-xs">
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

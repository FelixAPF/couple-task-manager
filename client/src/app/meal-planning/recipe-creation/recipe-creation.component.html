<div class="p-fluid p-4">
    <p-toast></p-toast>
  
    <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()">
  
      <!-- Dialog Title -->
      <h3 class="text-xl font-semibold mb-5 text-surface-800 dark:text-surface-100">
        {{ isEditMode ? 'Modifier la recette' : 'Créer une recette' }}
      </h3>
  
      <!-- Basic Recipe Info Section -->
      <div class="formgrid grid mb-4 gap-y-3">
        <div class="field col-12">
          <label for="name" class="block text-sm font-medium mb-1 text-surface-600 dark:text-surface-300">
            Nom de la recette <span class="text-red-500">*</span>
          </label>
          <input id="name" type="text" pInputText formControlName="name" class="w-full"
                 [ngClass]="{'ng-invalid ng-dirty': name.invalid && (name.dirty || name.touched)}" />
          <small *ngIf="name.invalid && (name.dirty || name.touched)" class="p-error block mt-1">
            Le nom est requis.
          </small>
        </div>
  
        <div class="field col-12 md:col-6">
          <label for="category" class="block text-sm font-medium mb-1 text-surface-600 dark:text-surface-300">
            Catégorie
          </label>
          <p-dropdown id="category" [options]="recipeTypes" formControlName="category"
                      optionLabel="label" optionValue="value" placeholder="Sélectionner une catégorie"
                      class="w-full" styleClass="w-full"
                      [ngClass]="{'ng-invalid ng-dirty': category.invalid && (category.dirty || category.touched)}">
          </p-dropdown>
          <small *ngIf="category.invalid && (category.dirty || category.touched)" class="p-error block mt-1">
            La catégorie est requise.
          </small>
        </div>
  
        <div class="field col-12 md:col-6">
          <label class="block text-sm font-medium mb-1 text-surface-600 dark:text-surface-300">
            Image de la recette
          </label>
          <!-- Image Preview -->
          <!-- Show preview if a new file is selected OR if there's an existing imageUrl and no new file -->
          <div *ngIf="imagePreviewUrl || (imageUrl.value && !imagePreviewUrl)" class="mb-2 relative w-full aspect-video bg-surface-100 dark:bg-surface-700 rounded overflow-hidden flex items-center justify-center border border-surface-200 dark:border-surface-600">
             <img [src]="imagePreviewUrl || imageUrl.value" alt="Aperçu de la recette" class="object-cover w-full h-full">
             <!-- Remove Button Overlay -->
             <button pButton pRipple type="button" icon="pi pi-times"
                     class="p-button-rounded p-button-danger absolute top-1 right-1 p-button-sm opacity-80 hover:opacity-100"
                     (click)="removeImage()"
                     pTooltip="Supprimer l'image" tooltipPosition="left">
             </button>
          </div>

          <!-- File Upload Component -->
          <!-- We use customUpload=true because FileService handles the actual upload logic -->
          <p-fileUpload mode="basic" name="recipeImage" #fileUploader
                        accept="image/*" maxFileSize="2000000" 
                        chooseLabel="Choisir une image" chooseIcon="pi pi-upload"
                        class="p-button-sm w-full md:w-auto"
                        [auto]="true" 
                        customUpload="true"
                        (uploadHandler)="onFileSelect($event)">
                        <!-- Note: The (uploadHandler) is triggered when the user selects a file in basic mode with customUpload=true -->
          </p-fileUpload>

          <!-- Display selected file name -->
          <small *ngIf="selectedFile" class="block mt-1 text-surface-500 dark:text-surface-400">
            Fichier sélectionné : {{ selectedFile.name }}
          </small>
          <!-- Hidden form control to store the final image URL -->
          <input type="hidden" formControlName="imageUrl">
          <!-- Add validation message for image if needed, e.g., file type or size -->
          <!-- <small *ngIf="imageControlHasError" class="p-error block mt-1"> Error message for image </small> -->
        </div>
  
        <div class="field col-12">
          <label for="description" class="block text-sm font-medium mb-1 text-surface-600 dark:text-surface-300">
            Description
          </label>
          <textarea id="description" pInputTextarea formControlName="description" rows="3" class="w-full" [autoResize]="true"></textarea>
        </div>
      </div>
  
      <div class="border-t border-surface-200 dark:border-surface-700 pt-4 mb-3">
        <h4 class="text-md font-semibold mb-3 text-surface-700 dark:text-surface-200">Ingrédients</h4>
        <div formArrayName="ingredients">
          <!-- Loop through ingredient FormGroups -->
          <div *ngFor="let ingredientGroup of ingredients.controls; let i = index" [formGroupName]="i"
               class="formgrid grid items-start mb-3 gap-x-2 gap-y-3 p-2 rounded-md border border-surface-100 dark:border-surface-700 bg-surface-50 dark:bg-surface-800">

            <!-- Combined Quantity & Unit Section -->
            <!-- This div now holds both Qty and Unit -->
            <div class="field col-12 sm:col"> <!-- Takes remaining horizontal space on sm+ screens -->
                <label [for]="'name' + i" class="block text-xs font-medium mb-1 text-surface-600 dark:text-surface-300">
                  Nom <span class="text-red-500">*</span>
                </label>
                <input [id]="'name' + i" type="text" pInputText formControlName="name" placeholder="Ex: Farine" class="w-full p-inputtext-sm" />
                 <!-- Add validation message if needed -->
              </div>
          
              <!-- Combined Quantity & Unit Section (Moved Second) -->
              <div class="field col-12 sm:col-5 md:col-4">
                  <div class="flex gap-2 items-start"> <!-- Use flexbox for side-by-side layout -->
                      <!-- Quantity Field -->
                      <div class="flex-1 min-w-0"> <!-- flex-1 allows fields to share space -->
                          <label [for]="'quantity' + i" class="block text-xs font-medium mb-1 text-surface-600 dark:text-surface-300">
                              Qté
                          </label>
                          <input [id]="'quantity' + i" type="text" pInputText formControlName="quantity" placeholder="100" class="w-full p-inputtext-sm" />
                          <!-- Add validation message if needed -->
                      </div>
                      <!-- Unit Field -->
                      <div class="flex-1 min-w-0">
                          <label [for]="'unit' + i" class="block text-xs font-medium mb-1 text-surface-600 dark:text-surface-300">
                              Unité
                          </label>
                          <input [id]="'unit' + i" type="text" pInputText formControlName="unit" placeholder="g" class="w-full p-inputtext-sm" />
                      </div>
                  </div>
              </div>

            <!-- Delete Button -->
            <!-- Adjusted alignment slightly for consistency -->
            <div class="field col-fixed flex items-center pt-4 sm:pt-0 sm:items-end pb-1">
               <button pButton pRipple type="button" icon="pi pi-trash"
                      class="p-button-danger p-button-text p-button-sm p-button-rounded"
                      (click)="removeIngredient(i)"
                      [disabled]="ingredients.length <= 1"
                      aria-label="Supprimer l'ingrédient"
                      pTooltip="Supprimer" tooltipPosition="left">
              </button>
            </div>

          </div>
        </div>

        <!-- Add Ingredient Button -->
        <div class="flex justify-start mt-3">
          <button pButton pRipple type="button" icon="pi pi-plus" label="Ajouter un ingrédient"
                  class="p-button-sm p-button-outlined"
                  (click)="addIngredient()">
          </button>
        </div>
      </div>
  
      <!-- Dialog Actions -->
      <div class="flex justify-end gap-2 border-t border-surface-200 dark:border-surface-700 pt-4 mt-5">
        <button pButton pRipple type="button" label="Annuler"
                class="p-button-secondary"
                (click)="closeDialog()">
        </button>
        <button pButton pRipple type="submit" [label]="isEditMode ? 'Mettre à jour' : 'Créer'"
                class="p-button-primary"
                [loading]="isLoading"
                [disabled]="recipeForm.invalid || isLoading">
        </button>
      </div>
  
    </form>
  </div>

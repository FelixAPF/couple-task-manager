<p>radio-test works!</p>
<div *ngFor="let frequency of frequencies; let i = index">
  <p-radiobutton
    name="frequency"
    [value]="frequency.value"
    formControlName="frequency"
    [inputId]="'frequency-' + i"
  ></p-radiobutton>
  <label [for]="'frequency-' + i">{{ frequency.label }}</label>
</div>
